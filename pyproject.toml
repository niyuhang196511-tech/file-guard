[project]
name = "fileguard"
version = "1.23.0"
description = "FileGuard 文件变更监控与版本追溯"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "pypdf==6.21.4",
    "PyYAML==6.0.3",
    "watchdog>=4,<7",
    "Pillow>=11,<14",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.12,<7",
]

[tool.uv]
package = false
