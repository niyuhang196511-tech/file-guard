name: Windows x64 packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-windows.ps1'
      - 'scripts/check-windows-install.ps1'
      - 'scripts/windows-python.ps1'
      - '构建Windows版本.cmd'
      - 'FileGuard-RecordAdmin.cmd'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test
        shell: powershell
        run: ./scripts/build-windows.ps1
      - name: Test desktop recovery logic
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Check dependency locks were preserved
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: FileGuard-Portable-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*/FileGuard-Portable-x64.zip
            release/*/SHA256SUMS.txt
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: FileGuard-NSIS-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*/*-setup.exe
            release/*/SHA256SUMS.txt
      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: FileGuard-MSI-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*/*.msi
            release/*/SHA256SUMS.txt

  installer:
    name: Verify ${{ matrix.kind }} installer
    needs: package
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kind: [MSI, NSIS]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: FileGuard-${{ matrix.kind }}-x64
          path: ${{ runner.temp }}/fileguard-installer
      - name: Install, test, and uninstall
        shell: powershell
        run: ./scripts/check-windows-install.ps1 -Kind '${{ matrix.kind }}' -ArtifactDirectory "$env:RUNNER_TEMP/fileguard-installer" -CheckDesktop
      - name: Upload MSI failure logs
        if: failure() && matrix.kind == 'MSI'
        uses: actions/upload-artifact@v4
        with:
          name: FileGuard-MSI-test-logs
          path: ${{ runner.temp }}/fileguard-install-*/*.log
          if-no-files-found: ignore
