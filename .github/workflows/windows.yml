name: Windows x64 packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'src-tauri/**'
      - 'scripts/build-windows.ps1'
      - '构建Windows版本.cmd'
      - 'FileGuard-RecordAdmin.cmd'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test
        shell: powershell
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FileGuard-Windows-x64
          if-no-files-found: error
          path: |
            release/*/*.msi
            release/*/*.exe
            release/*/*.zip
            release/*/SHA256SUMS.txt
