name: Windows x64 packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'src-tauri/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/windows-python.ps1'
      - '构建Windows版本.cmd'
      - 'FileGuard-RecordAdmin.cmd'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test
        shell: powershell
        run: ./scripts/build-windows.ps1
      - name: Test desktop recovery logic
        run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: FileGuard-Portable-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*/FileGuard-Portable-x64.zip
            release/*/SHA256SUMS.txt
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: FileGuard-NSIS-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*/*-setup.exe
            release/*/SHA256SUMS.txt
      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: FileGuard-MSI-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*/*.msi
            release/*/SHA256SUMS.txt
