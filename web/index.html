<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FileGuard · 文件变更追溯</title><link rel="stylesheet" href="style.css"></head><body><div id="app" v-cloak><div class="shell" :class="{dark:theme==='深色'}">
<aside><div class="brand"><div class="brand-mark"><ico n="shield-check"></ico></div><div><strong>FileGuard</strong><small>文件变更追溯</small></div></div>
<nav><div class="nav-label">工作空间</div><button v-for="x in nav.slice(0,9)" :aria-label="x[0]" :aria-current="page===x[0]?'page':undefined" :class="{active:page===x[0]}" @click="go(x[0])"><ico :n="x[1]"></ico>{{x[0]}}</button><div class="nav-label second">系统管理</div><button v-for="x in nav.slice(9)" :aria-label="x[0]" :aria-current="page===x[0]?'page':undefined" :class="{active:page===x[0]}" @click="go(x[0])"><ico :n="x[1]"></ico>{{x[0]}}</button></nav>
<div class="aside-bottom"><div class="local-icon"><ico n="monitor"></ico></div><div><b>{{demo?'示例工作区':'本地工作区'}}</b><small>桌面版 · 1.14.0</small></div></div></aside>
<main><header class="top"><div class="crumb"><ico n="panel-left"></ico><i></i>工作空间 <span>›</span><b>{{page}}</b></div><div class="tools"><button class="global-search" @click="openSearch"><ico n="search"></ico>搜索文件 <kbd>Ctrl K</kbd></button><button class="iconbtn" title="通知中心" aria-label="通知中心" @click="notifications=!notifications"><ico n="bell"></ico><em v-if="alerts.length" class="reddot"></em></button><button class="iconbtn" :title="theme==='浅色'?'切换深色':'切换浅色'" aria-label="切换主题" @click="toggleTheme"><ico :n="theme==='浅色'?'moon':'sun'"></ico></button></div></header>
<div v-if="notifications" class="notice"><div class="card-head"><b>通知中心</b><button class="iconbtn" @click="notifications=false" aria-label="关闭通知"><ico n="x"></ico></button></div><p v-if="!alerts.length">暂无运行异常</p><button class="alert-link" v-for="a in alerts" @click="openAlert(a)"><span>{{a.label}}</span><ico n="chevron-right"></ico></button><div v-if="s.recent.length" class="mini-notes"><b>最近文件活动</b><button v-for="e in s.recent.slice(0,3)" class="textbtn" @click="notifications=false;fromEvent(e)">{{base(e.rel)}} · {{e.kind}}</button></div></div>
<div class="workspace">
<template v-if="page==='系统总览'"><section class="hero"><div class="contours"></div><div><div class="hero-state"><span class="dot"></span>{{statusText}}</div><h1>监控工作台</h1><p>{{demo?'示例工作区':'本地工作区'}}<i>·</i>{{activeRoots}} 个目录正在监控<i>·</i>{{dateText}}</p></div><button class="hero-btn" :disabled="demo&&!s.recent.some(r=>r.rel.endsWith('库存台账.xlsx')&&r.kind==='内容修改')" @click="demo?fromEvent(s.recent.find(r=>r.rel.endsWith('库存台账.xlsx')&&r.kind==='内容修改')):rootDialog()"><ico :n="demo?'folder':'plus'"></ico>{{demo?'体验整行对比':'添加目录'}}</button></section>
<div class="stats"><button v-for="m in metrics" class="stat" @click="metricGo(m)"><span class="stat-title">{{m.label}}<span class="tile-icon" :class="m.tone"><ico :n="m.icon"></ico></span></span><strong>{{num(m.value)}}</strong><small>{{m.hint}}</small></button></div>
<div class="chart-row"><section class="card trend"><div class="card-head"><h2>文件变更趋势</h2><select v-model.number="days" @change="refresh"><option v-for="v in [7,14,30]" :value="v">近 {{v}} 天</option></select></div><div class="legend"><span><b class="bl"></b>内容修改</span><span><b class="te"></b>新增文件</span><span><b class="sl"></b>其他变更</span></div>
<div class="chart" v-if="s.trend.length"><svg viewBox="0 0 640 146" role="img" aria-label="每日内容修改、新增和其他变更趋势"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#537dce" stop-opacity=".17"/><stop offset="1" stop-color="#537dce" stop-opacity="0"/></linearGradient></defs><g v-for="j in [0,1,2,3]"><line x1="34" x2="624" :y1="15+j*34" :y2="15+j*34" class="grid"/><text x="24" :y="19+j*34" text-anchor="end">{{ceil*(3-j)/3}}</text></g><path :d="area" fill="url(#fill)"/><polyline v-for="(k,i) in ['edited','added','other']" :points="points(k)" fill="none" :stroke="['#426fbd','#36a99a','#99a9bf'][i]" :stroke-width="i===0?3:2" stroke-linejoin="round" stroke-linecap="round"/><g v-for="(d,i) in s.trend"><text v-if="xlabel(i)" :x="px(i)" y="141" text-anchor="middle">{{d.day.slice(5).replace('-','/')}}</text><rect :x="px(i)-8" y="4" width="16" height="116" fill="transparent"><title>{{d.day}}　修改 {{d.edited}}　新增 {{d.added}}　其他 {{d.other}}</title></rect></g></svg></div></section>
<section class="card"><div class="card-head"><h2>文件类型分布</h2><span class="quiet">按文件数</span></div><div class="distribution"><div class="donut" :style="{background:donut}"><div><strong>{{num(s.files)}}</strong><small>文件总数</small></div></div><div class="dist-list"><div v-for="(g,i) in s.groups"><span><b :style="{background:palette[i%5]}"></b>{{g[0]}}</span><strong>{{num(g[1])}}</strong></div><span class="quiet" v-if="!s.groups.length">尚无已监控文件</span></div></div></section></div>
<div class="bottom-row"><section class="card"><div class="card-head"><h2>最近变更</h2><button class="textbtn" @click="go('变更记录')">全部记录 <ico n="arrow-right"></ico></button></div><div class="activity" v-for="e in s.recent" @click="fromEvent(e)" tabindex="0" @keydown.enter="fromEvent(e)"><div class="file-icon" :class="tone(e.ext)"><ico :n="fileIcon(e.ext)"></ico></div><div class="activity-name"><b>{{base(e.rel)}}</b><small>{{parent(e.root,e.rel)}}</small></div><span class="tag" :class="kindTone(e.kind)">{{e.kind}}</span><time>{{shortTime(e.stamp)}}</time></div><div v-if="!s.recent.length" class="empty"><ico n="history"></ico><b>暂无变更记录</b><small>添加目录后，这里将显示最近的文件活动。</small></div></section>
<section class="card"><div class="card-head"><h2>监控目录</h2><button class="textbtn" @click="go('目录监控')">管理 <ico n="arrow-right"></ico></button></div><div v-for="r in s.roots.slice(0,4)" class="root-mini"><div class="folder-icon"><ico n="folder"></ico></div><div><b>{{base(r.path)}}</b><small>{{num(r.total)}} 个文件</small></div><span class="light-state" :class="{warn:!!r.error,off:!r.active}"><i></i>{{rstate(r)}}</span></div><div class="empty" v-if="!s.roots.length"><ico n="folder-plus"></ico><b>还没有监控目录</b><button class="textbtn" @click="rootDialog()">添加第一个目录</button></div></section></div></template>
<template v-else><div class="page-title"><div><h1>{{page}}</h1><p>{{descs[page]}}</p></div><div class="actions"><button class="btn" v-if="page==='目录监控'" :disabled="!activeRoots" @click="scanRoots()"><ico n="refresh-cw"></ico>{{demo?'模拟扫描全部':'扫描全部'}}</button><button class="primary" v-if="page==='目录监控'&&!demo" @click="rootDialog()"><ico n="plus"></ico>添加目录</button><button class="btn" v-if="page==='变更记录'" @click="reportDialog('period')">变更期间对照</button><button class="btn" v-if="file&&['历史版本','版本对比'].includes(page)" @click="reportDialog('trace')">字段变动轨迹</button><button class="btn" v-if="file&&['历史版本','版本对比'].includes(page)" @click="receiptDialog">保存核对</button><button class="btn" v-if="ledgerEnabled&&['历史版本','版本对比'].includes(page)" @click="ledgerDialog">台账对账</button><button class="btn" v-if="reviewReturn&&['历史版本','版本对比'].includes(page)" @click="go('复核工作台')">返回复核工作台</button><button class="btn" v-if="eventReturn&&['历史版本','版本对比'].includes(page)" @click="returnToEvents">返回变更记录</button><button class="btn" v-if="['变更记录','文件管理','审计中心'].includes(page)" :disabled="listLoading||!!rangeError||!list.total" @click="exportEvents"><ico n="download"></ico>{{listLoading?'正在筛选…':'导出记录（'+num(list.total)+' 条）'}}</button></div></div>
<template v-if="page==='目录监控'"><div v-if="!s.roots.length" class="card empty"><ico n="folder-plus"></ico><b>添加第一个业务目录</b><small>首次扫描会为已有文件建立初始版本。</small><button class="primary" @click="rootDialog()">添加目录</button></div><section class="card root-toolbar" v-if="s.roots.length"><label class="search-input"><ico n="search"></ico><input v-model="rootQuery" placeholder="搜索目录名称或完整路径" aria-label="搜索监控目录"></label><select aria-label="目录排序" v-model="rootOrder"><option value="">添加顺序</option><option value="count">在册文件最多</option></select><div class="root-tabs"><button v-for="tab in rootTabs" :aria-pressed="rootScope===tab.label" @click="rootScope=tab.label;rootFocus=null">{{tab.label}} <b>{{tab.count}}</b></button></div><button class="textbtn" v-if="rootFocus||rootQuery||rootScope!=='全部'" @click="clearRootFilter">清除筛选</button></section>
<section class="card root-card" v-for="r in visibleRoots" :key="r.id"><div class="folder-icon"><ico n="folder"></ico></div><div class="grow"><h2>{{base(r.path)}}</h2><p class="path">{{r.path}}</p><small>{{num(r.total)}} 个在册文件　·　{{r.watch_mode}}　·　最近扫描 {{fmt(r.last_scan)}}</small><details v-if="r.active&&r.waiting" class="wait-list"><summary>等待保存或读取 · {{r.waiting}} 项</summary><p>引擎已安排复查，重试间隔约 {{r.retry_delay}} 秒。</p><ul><li v-for="entry in r.wait_samples">{{entry[0]}} · {{entry[1]}}</li></ul><small v-if="r.waiting>10">显示前 10 项</small></details><details v-if="r.skipped" class="skip-details"><summary>上次完成扫描跳过 {{r.skipped}} 项</summary><ul v-if="r.skip_counts"><li v-for="(count,reason) in r.skip_counts">{{reason}} · {{count}} 项</li></ul><small v-else>下次扫描后可查看原因。</small></details><p v-if="r.error" class="error">{{r.error}}</p></div><div class="right"><span class="light-state" :class="{off:!r.active,warn:!!r.error}"><i></i>{{rstate(r)}}</span><small class="queue-state" v-if="r.progress||r.queued_source">{{r.progress || r.queued_source}}</small><div class="actions"><button class="textbtn" @click="policyDialog(r)">监听采集策略</button><button class="textbtn" @click="waitingDialog(r)">等待队列</button><button class="textbtn" @click="scanJournal(r)">扫描运行记录</button><button class="textbtn" @click="showRuleHistory(r)">规则沿革</button><button class="textbtn" @click="treeFor(r)">子目录</button><button class="textbtn" @click="rootFiles(r)">查看文件</button><button class="textbtn" @click="rootEvents(r)">变更记录</button><button class="textbtn" :disabled="!r.active||!!r.progress||!!r.queued_source" @click="scanRoots(r)">{{demo?'模拟扫描':'扫描此目录'}}</button><button v-if="!demo" class="textbtn" @click="rootDialog(r)">配置</button><button v-if="!demo" class="textbtn" @click="actRoot(r,r.active?'暂停':'继续')">{{r.active?'暂停':'继续'}}</button><button v-if="!demo" class="textbtn danger" @click="actRoot(r,'移除')">移除</button></div></div></section><div v-if="s.roots.length&&!visibleRoots.length" class="card empty"><b>没有匹配的监控目录</b><button class="textbtn" @click="clearRootFilter">显示全部目录</button></div></template>
<template v-if="['文件管理','变更记录','审计中心'].includes(page)"><section class="card listcard"><div v-if="f.prefix" class="tag blue">目录范围：{{f.prefix}}</div><div class="filters"><label class="search-input"><ico n="search"></ico><input aria-label="搜索记录" v-model="f.q" :placeholder="page==='审计中心'?'搜索操作名称或内容':page==='变更记录'?'搜索文件名、现路径或原路径':'搜索现名、旧名或相对路径'" @input="searchLater"></label><template v-if="page!=='审计中心'"><select aria-label="监控目录" v-model="f.root" @change="queryFirst"><option value="">全部目录</option><option v-for="r in s.roots" :value="r.id">{{base(r.path)}}</option></select><input v-model="f.ext" class="extbox" aria-label="扩展名" placeholder="xlsx, pdf" @input="searchLater"></template><select v-if="page==='文件管理'" aria-label="文件范围" v-model="f.scope" @change="queryFirst"><option v-for="entry in fileScopes" :value="entry[0]">{{entry[1]}}</option></select><template v-if="page==='变更记录'"><select v-model="f.kind" @change="queryFirst"><option value="">全部变化</option><option v-for="k in kinds">{{k}}</option></select></template><template v-if="page==='审计中心'"><select aria-label="管理操作" v-model="f.action" @change="queryFirst"><option value="">全部操作</option><option v-for="action in list.actions" :value="action">{{action}}</option></select></template><button class="textbtn" v-if="Object.values(f).some(Boolean)" @click="clearFilter">重置</button></div><details class="advanced"><summary>更多筛选与排序</summary><div class="filter-grid">
<label>排序<select v-model="f.sort" @change="queryFirst"><option value="">最近优先</option><option value="oldest">最早优先</option><template v-if="page==='文件管理'"><option value="size">大小降序</option><option value="versions">版本最多</option><option value="name">路径升序</option></template></select></label>
<template v-if="page!=='审计中心'"><label>解析状态<select v-model="f.status" @change="queryFirst"><option value="">全部状态</option><option v-for="v in parseStates">{{v}}</option></select></label><label>SHA-256 前缀<input v-model="f.sha" maxlength="64" @input="searchLater" placeholder="例如 43af"></label></template>
<template v-if="page==='文件管理'"><label><input type="checkbox" v-model="f.starred" @change="queryFirst">仅关注文件</label><label>最小字节数<input v-model="f.min_bytes" type="number" min="0" @input="searchLater"></label><label>最大字节数<input v-model="f.max_bytes" type="number" min="0" @input="searchLater"></label><label><input type="checkbox" v-model="f.multiple" @change="queryFirst">仅多版本文件</label></template>
<template v-if="page==='变更记录'"><button class="btn" @click="privateDialog">管理已移出记录</button><label>事件编号<input type="number" min="1" v-model="f.event_id" @input="searchLater"></label><label>公开更正说明<input v-model="f.caption" @input="searchLater"></label><label><input type="checkbox" v-model="f.amended" @change="queryFirst">仅已处置</label><label>记录来源<select v-model="f.source" @change="queryFirst"><option value="">全部来源</option><option v-for="v in list.sources">{{v}}</option></select></label><label><input type="checkbox" v-model="f.with_diff" @change="queryFirst">仅有内容差异</label></template></div></details>
<div class="range-tools" v-if="['文件管理','变更记录','审计中心'].includes(page)"><label class="date-field">从 <input aria-label="开始日期" type="date" v-model="f.start" :max="f.end||undefined" @change="queryFirst"></label><label class="date-field">至 <input aria-label="结束日期" type="date" v-model="f.end" :min="f.start||undefined" @change="queryFirst"></label><template v-if="page==='变更记录'"><button class="range-preset" @click="recentDays(1)">今天</button><button class="range-preset" @click="recentDays(7)">近七天</button><label class="activity-toggle"><input type="checkbox" v-model="f.activity" @change="queryFirst">隐藏初始建档</label></template></div>
<p class="error" v-if="rangeError" role="alert">{{rangeError}}</p><div class="scroll"><table v-if="page==='文件管理'"><thead><tr><th>文件名称</th><th>所属目录</th><th>大小</th><th>最近版本</th><th>最近变化</th><th></th></tr></thead><tbody><tr v-for="x in list.items"><td><div class="filecell"><span class="file-icon" :class="tone(x.ext)"><ico :n="fileIcon(x.ext)"></ico></span><div class="file-summary"><strong>{{base(x.rel)}}</strong><small v-if="x.matched_path">原路径：{{x.matched_path}}</small><span class="tag" :class="stateTone(x.file_state)">{{x.file_state}}</span></div></div></td><td class="file-folder">{{parent(x.root,x.rel)}}</td><td>{{bytes(x.size)}}</td><td>V{{x.version}}</td><td>{{fmt(x.updated)}}</td><td><button class="textbtn" :aria-pressed="!!x.starred" @click="toggleStar(x)">{{x.starred?'取消关注':'关注'}}</button><button class="textbtn" @click="selectFile(x)">历史版本</button><button v-if="native&&x.live&&!x.root_removed" class="textbtn" @click="perform('open_dir',{id:x.id})">打开位置</button></td></tr></tbody></table>
<table v-if="page==='变更记录'"><thead><tr><th>文件与位置</th><th>变更类型</th><th>版本</th><th>记录时间</th><th>解析状态</th><th></th></tr></thead><tbody><tr v-for="x in list.items"><td><strong>{{base(x.rel)}}</strong><small>{{parent(x.root,x.rel)}}</small><small v-if="x.old_rel">原路径：{{x.old_rel}}</small></td><td><span class="tag" :class="kindTone(x.kind)">{{x.kind}}</span><small v-if="x.caption">更正：{{x.caption}}</small></td><td>{{x.prior?'V'+x.prior:'—'}} → {{x.version?'V'+x.version:'—'}}</td><td>{{fmt(x.stamp)}}</td><td>{{x.status||'已记录'}}</td><td><button class="textbtn" :disabled="listLoading||x.kind==='已撤回'" @click="fromEvent(x)">查看详情</button><button class="textbtn" @click="recordDialog(x)">管理记录</button></td></tr></tbody></table>
<table v-if="page==='审计中心'"><thead><tr><th>时间</th><th>管理操作</th><th>操作内容</th></tr></thead><tbody><tr v-for="x in list.items"><td>{{fmt(x.stamp)}}</td><td>{{x.action}}</td><td class="wrap">{{x.note}}</td></tr></tbody></table></div>
<div class="empty" v-if="!list.items.length&&!listLoading&&!rangeError"><ico n="search"></ico><b>没有符合条件的记录</b></div><div class="pager"><span>共 {{num(list.total)}} 条　<select v-model.number="listSize" aria-label="记录每页条数" @change="queryFirst"><option v-for="v in [10,25,50,100]" :value="v">每页 {{v}} 条</option></select></span><div><button class="btn" :disabled="p<=1" @click="p--;loadList()">上一页</button> {{p}} / {{Math.max(1,Math.ceil(list.total/list.size))}} <button class="btn" :disabled="p*list.size>=list.total" @click="p++;loadList()">下一页</button></div></div></section></template>
<template v-if="['历史版本','版本对比'].includes(page)"><div class="card picker"><div class="folder-icon"><ico n="files"></ico></div><div class="grow"><b>{{file?base(file.rel):'选择需要追溯的文件'}}</b><small>{{file?parent(file.root,file.rel):'可以查找已删除文件的历史记录'}}</small><span v-if="file&&file.file_state" class="tag" :class="stateTone(file.file_state)">{{file.file_state}}</span></div><button class="btn" @click="fileDialog">选择文件</button></div>
<template v-if="file&&versions.length"><div class="split-head"><h2>{{page==='历史版本'?'版本时间线':'版本选择'}}</h2><button class="textbtn" @click="navVersion(page==='历史版本'?'版本对比':'历史版本')">{{page==='历史版本'?'比较版本':'查看时间线'}} <ico n="arrow-right"></ico></button></div>
<section v-if="page==='历史版本'" class="card timeline"><div class="timeline-filters"><label>复核结论<select v-model="historyReview" @change="versionPage=1"><option value="">全部结论</option><option v-for="v in reviewStates">{{v}}</option></select></label><label>版本号或摘要<input v-model="versionQuery" @input="versionPage=1" placeholder="V2 或至少 6 位摘要" aria-label="查找版本号"></label><label>保存日期<input type="date" v-model="versionDay" @change="versionPage=1" aria-label="版本保存日期"></label><label>解析状态<select v-model="versionStatus" @change="versionPage=1"><option value="">全部状态</option><option v-for="v in parseStates">{{v}}</option></select></label><button class="textbtn" v-if="versionQuery||versionDay||versionStatus||historyReview" @click="resetVersions">清除条件</button><small>共 {{matchedVersions.length}} 个版本</small></div><div v-if="!visibleVersions.length" class="empty"><b>没有符合条件的版本</b><small>可清除条件查看完整时间线。</small></div><div class="version" v-for="v in visibleVersions" :key="v.id"><span class="node"></span><div class="grow"><h3>V{{v.num}} <span class="tag neutral">{{v.status}}</span></h3><p>{{fmt(v.stamp)}}　·　{{bytes(v.size)}}<template v-if="v.delta!=null">　·　{{v.delta>=0?'+':'−'}}{{bytes(Math.abs(v.delta))}}</template><template v-if="v.status==='已解析'">　·　{{v.changes}} 项差异</template></p><small v-if="v.note" class="review-note">{{v.note}}</small><small class="hash">SHA-256　{{v.sha}}</small><small class="error" v-if="v.error">{{v.error}}</small></div><div class="actions"><button class="textbtn" @click="editReview(v)">{{v.review||'待复核'}} · 登记</button><button v-if="v.num>2" class="textbtn" @click="pair(versions[versions.length-1].id,v.id)">与首版比较</button><button v-if="v.id!==versions[0].id" class="textbtn" @click="pair(v.id,versions[0].id)">与最新版比较</button><button v-if="v.parent_id" class="textbtn" @click="pair(v.parent_id,v.id)">比较</button><button v-if="!demo" class="textbtn" @click="saveFile('copy',base(file.rel),v.id)">另存</button><button class="textbtn" @click="restoreDialog(v)">{{demo?'恢复预览':'恢复'}}</button></div></div><div class="pager" v-if="versionPages>1"><span>第 {{versionPage}} / {{versionPages}} 页</span><div><button class="btn" :disabled="versionPage<=1" @click="versionPage--">上一页</button> <button class="btn" :disabled="versionPage>=versionPages" @click="versionPage++">下一页</button></div></div></section>
<section v-else class="card"><div class="pair"><label>旧版本<select v-model.number="left" @change="changePair"><option v-for="v in versions" :value="v.id">V{{v.num}}　{{fmt(v.stamp)}}</option></select></label><button class="btn swap-pair" :disabled="left===right||diffLoading" @click="swapPair">交换版本</button><label>新版本<select v-model.number="right" @change="changePair"><option v-for="v in versions" :value="v.id">V{{v.num}}　{{fmt(v.stamp)}}</option></select></label></div><template v-if="left!==right&&diff"><div v-if="diff.is_source" class="diff-options"><div class="mode-switch" aria-label="源文件比较方式"><button :aria-pressed="diffMode==='aligned'" @click="setDiffMode('aligned')">按结构比较</button><button :aria-pressed="diffMode==='coordinate'" @click="setDiffMode('coordinate')">按原文逐行比较</button></div></div><div v-if="diff.is_excel||diff.is_word||diff.is_tabular" class="diff-options"><div class="mode-switch" aria-label="比较方式"><button v-for="m in [['aligned',diff.is_word?'按段落内容对齐':'按编号对齐'],['coordinate',diff.is_word?'按原始位置':'按原始坐标']]" :aria-pressed="diffMode===m[0]" @click="setDiffMode(m[0])">{{m[1]}}</button></div><small v-if="diff.is_word">{{diffMode==='aligned'?'按文档区域核对段落，突出显示修改文字':'逐个段号和表格位置核对'}}</small><small v-else-if="diffMode==='aligned' && Object.keys(diff.aligned).length">按 {{Object.entries(diff.aligned).filter(([name])=>!sheet || sheet===name).map(([name,key])=>name+' · '+key).join('、') || '单元格坐标'}} 核对</small><small v-else>按单元格坐标核对</small></div>
<button v-if="diff.is_excel||diff.is_tabular" class="btn" @click="varianceDialog">数值差异核对</button><div class="view-tabs" v-if="formatView[0]!=='detail'">
<button :aria-pressed="displayMode==='auto'" @click="displayMode='auto';changePair()">{{formatView[1]}}</button>
<button :aria-pressed="displayMode==='detail'" @click="displayMode='detail'">{{diff.is_excel?'单元格与属性明细':'明细表'}} · {{diff.is_excel?'筛选与导出':'并排查看'}}</button></div>
<section v-if="presentation==='grid'" class="sheet-review">
<div v-if="grid" class="grid-toolbar"><label>工作表 <select v-model="gridSheet" @change="gridPage=1;gridCol=1;loadGrid()"><option v-for="g in grid.sheets">{{g}}</option></select></label>
<span>{{grid.key?'按「'+grid.key+'」配对':'按原始行号配对'}}</span><label>整行筛选<select v-model="gridFilter" @change="gridPage=1;loadGrid()"><option value="">全部行</option><option v-for="v in ['新增行','删除行','修改行','调序行','内容','批注','格式','超链接']">{{v}}</option></select></label><span v-if="grid.row_filter">匹配 {{grid.matches}} 行</span><label><input type="checkbox" :disabled="!!gridFilter" v-model="expandRows" @change="gridPage=1;loadGrid()">显示未变行</label></div>
<details v-if="grid" class="cell-search111"><summary>从整张工作表查找单元格</summary><div class="filters"><label>单元格内容<input v-model="cellSearch.q" maxlength="512" @keyup.enter="searchCells()"></label><label>工作表一侧<select v-model="cellSearch.side"><option value="">两侧</option><option value="old">旧表</option><option value="new">新表</option></select></label><label>字段名<input v-model="cellSearch.field"></label><label>数据类型<select v-model="cellSearch.type"><option value="">全部</option><option v-for="t in ['文本','数字','公式','日期时间','布尔值','错误值']">{{t}}</option></select></label><label><input type="checkbox" v-model="cellSearch.changed">仅发生变化的单元格</label><label><input type="checkbox" v-model="cellSearch.exact">整格匹配</label><label><input type="checkbox" v-model="cellSearch.sensitive">区分大小写</label><button class="btn" :disabled="!cellSearch.q.trim()||cellBusy" @click="searchCells()">查找单元格</button></div>
<template v-if="cellHits&&cellSig===JSON.stringify(cellOptions())"><p v-if="!cellHits.items.length">没有匹配的单元格。</p><ul><li v-for="h in cellHits.items"><button class="textbtn" @click="jumpCell(h)">{{h.side==='old'?'旧表':'新表'}} {{h.address}}</button> · {{h.field}} · {{h.value}}</li></ul><button class="btn" :disabled="!cellHits.offset" @click="searchCells(cellHits.offset-20)">上一批</button><button class="btn" :disabled="!cellHits.more" @click="searchCells(cellHits.offset+20)">下一批</button></template></details>
<div class="grid-tools19" v-if="grid"><div><span v-for="(n,label) in grid.summary">{{label}} <b>{{n}}</b></span></div><div><select v-model="gridLocate" aria-label="整行定位方式"><option value="new">新表地址</option><option value="old">旧表地址</option><option v-if="grid.key" value="key">业务编号</option></select><input v-model="gridTarget" :placeholder="gridLocate==='key'?'输入完整编号':'例如 C24 或 24'" @keyup.enter="loadGrid(true)"><button class="btn" :disabled="!gridTarget.trim()" @click="loadGrid(true)">定位</button></div></div><p role="alert" class="error" v-if="grid&&gridError">{{gridError}}</p><div class="empty" v-if="!grid">{{gridError||diff.error||'正在读取工作表…'}}</div>
<template v-else><div class="scroll sheet-scroll"><table class="sheet-table"><thead><tr><th>旧行</th><th>新行</th><th>修订</th><th v-for="c in grid.columns">{{c.title}}<small>{{c.old||'—'}} → {{c.new||'—'}}</small></th></tr></thead><tbody>
<tr v-for="line in grid.rows" :class="{'row-add':line.kind==='新增','row-del':line.kind==='删除','row-gap':line.kind==='gap','row-target':line.target}">
<template v-if="line.kind==='gap'"><td>{{line.old}}</td><td>{{line.new}}</td><td :colspan="1+grid.columns.length"><button @click="expandRows=true;gridPage=line.expand_page;loadGrid()">展开 {{line.count}} 个未变行</button></td></template>
<template v-else><td>{{line.old||''}}</td><td>{{line.new||''}}</td><td>{{line.kind==='新增'?'＋':line.kind==='删除'?'−':'·'}}<small v-if="line.moved">调序</small></td><td v-for="cell in line.cells" :class="{'cell-changed':!!cell.note}"><span>{{cell.value??'—'}}</span><small v-if="cell.note">{{cell.address}} · {{cell.note}}<template v-if="cell.type"> · {{cell.type}}</template></small><details v-if="cell.detail"><summary>具体变化</summary><small>{{cell.detail}}</small></details></td></template></tr></tbody></table></div>
<div class="pager"><span>整行视图 · {{grid.page}} / {{grid.pages}} 页 · 列组 {{grid.col_page}} / {{grid.col_pages}}</span><div><button class="btn" v-if="grid.col_pages>1" :disabled="gridCol===1" @click="gridCol--;loadGrid()">上一组列</button> <button class="btn" v-if="grid.col_pages>1" :disabled="gridCol===grid.col_pages" @click="gridCol++;loadGrid()">下一组列</button> <button class="btn" :disabled="gridPage===1" @click="gridPage--;loadGrid()">上一页</button> <button class="btn" :disabled="gridPage===grid.pages" @click="gridPage++;loadGrid()">下一页</button></div></div></template>
<button class="textbtn" @click="displayMode='detail'">查看单元格、打印设置及其他属性差异（{{diff.total}} 项）</button></section>
<template v-else><div class="diff-meta"><button v-for="k in ['新增','修改','删除']" class="kind-chip" :class="kindTone(k)" :aria-pressed="diffKind===k" @click="filterDiff(k)">{{k}} <b>{{diff.counts[k]}}</b></button><button class="textbtn" v-if="diffKind" @click="filterDiff(diffKind)">显示全部</button><span class="quiet">{{diff.status}}</span></div><div class="filters"><select v-model="sheet" @change="dp=1;loadDiff()"><option value="">全部位置分组</option><option v-for="g in diff.sheets">{{g}}</option></select><select v-if="diff.is_excel||diff.is_tabular" aria-label="差异类别" v-model="diffCategory" @change="dp=1;loadDiff()"><option value="">全部差异类别</option><option v-for="c in diff.categories">{{c}}</option></select><label class="search-input"><ico n="search"></ico><input v-model="loc" :placeholder="diff.is_excel?'搜索字段、位置、编号或值':'搜索位置、旧值或新值'" @input="dp=1;loadDiff()"></label><button class="textbtn" v-if="diffFiltered" @click="changePair">清除筛选</button><button class="btn export-diff" :disabled="diffLoading||!diff.total" @click="exportDifference"><ico n="download"></ico>导出筛选结果（{{diff.total}} 项）</button></div><details class="advanced"><summary>精确查找与匹配范围</summary><div class="filter-grid"><label>搜索范围<select v-model="searchIn" @change="dp=1;loadDiff()"><option value="">全部内容</option><option value="old">仅旧值</option><option value="new">仅新值</option><option value="location">仅位置</option></select></label><label><input type="checkbox" v-model="caseSensitive" @change="dp=1;loadDiff()">区分大小写</label><label><input type="checkbox" v-model="exact" @change="dp=1;loadDiff()">完全匹配</label><template v-if="diff.is_excel||diff.is_tabular"><label>业务字段<select v-model="diffField" @change="dp=1;loadDiff()"><option value="">全部字段</option><option v-for="v in diff.fields">{{v}}</option></select></label><label>完整记录编号<input v-model="recordId" @input="dp=1;loadDiff()"></label></template></div></details>
<div class="revision-groups" v-if="['records','paths','assets'].includes(presentation)"><section v-for="[group,items] in groupedChanges" class="revision-group"><h3>{{group}}</h3><div class="scroll"><table class="compare"><thead><tr><th>{{presentation==='records'?'列':presentation==='paths'?'字段路径':'条目'}}</th><th>旧版本</th><th>新版本</th><th>变化</th></tr></thead><tbody><tr v-for="d in items"><td>{{presentation==='records'?d.location.split(' · ').pop():d.location}}</td><td class="oldval">{{d.old??'—'}}</td><td class="newval">{{d.new??'—'}}</td><td>{{d.kind}}</td></tr></tbody></table></div></section></div>
<div class="revision-groups" v-else-if="presentation!=='detail'"><section v-for="[group,items] in groupedChanges" class="revision-group"><h3>{{group}}</h3><article v-for="d in items"><h4>{{d.location}} · {{d.kind}}</h4><div v-for="side in ['old','new'].filter(k=>d[k]!=null)" :class="side==='old'?'row-del':'row-add'" class="revision-line"><b>{{side==='old'?'−':'＋'}}</b><span><template v-if="d[side+'_parts']"><span v-for="part in d[side+'_parts']" :class="{'fragment-change':part[1]}">{{part[0]}}</span></template><template v-else>{{d[side]}}</template></span></div></article></section></div>
<div class="scroll" v-else><table class="compare"><thead><tr><th>位置</th><th>旧值 · V{{diff.old_number}}</th><th>新值 · V{{diff.new_number}}</th><th>变化</th></tr></thead><tbody><tr v-for="d in diff.items"><td><small>{{d.sheet}}</small><b>{{d.location}}</b><small v-if="d.category">{{d.category}}<template v-if="d.field"> · {{d.field}}</template></small><small v-if="d.record_key" class="record-key">{{d.record_key}}</small></td><td class="oldval"><small class="value-type" v-if="d.old_type&&d.new_type&&d.old_type!==d.new_type">{{d.old_type}}</small><template v-if="d.old_parts"><span v-for="(part,index) in d.old_parts" :key="index" :class="{'text-change':part[1]}">{{part[0]}}</span></template><template v-else>{{d.old===null?'—':d.old}}</template></td><td class="newval"><small class="value-type" v-if="d.old_type&&d.new_type&&d.old_type!==d.new_type">{{d.new_type}}</small><template v-if="d.new_parts"><span v-for="(part,index) in d.new_parts" :key="index" :class="{'text-change':part[1]}">{{part[0]}}</span></template><template v-else>{{d.new===null?'—':d.new}}</template></td><td><span class="tag" :class="kindTone(d.kind)">{{d.kind}}</span></td></tr></tbody></table></div><div class="empty" v-if="!diff.items.length"><b>{{diff.error||(diffFiltered?'当前筛选没有匹配项':'两个版本没有可列出的结构化差异')}}</b><small>可在下方核对版本属性。</small></div><div class="pager"><span>共 {{diff.total}} 项　<select aria-label="差异每页条数" v-model.number="diffSize" @change="dp=1;loadDiff()"><option v-for="n in [20,40,80,100]" :value="n">每页 {{n}} 项</option></select></span><div><button class="btn" :disabled="dp===1" @click="dp--;loadDiff()">上一页</button> {{dp}} <button class="btn" :disabled="dp*diff.size>=diff.total" @click="dp++;loadDiff()">下一页</button></div></div></template><button class="textbtn" @click="editReview(versions.find(v=>v.id===right))">登记新侧版本 V{{diff.new_number}} 的复核结论</button><details><summary>文件大小与 SHA-256</summary><p class="hash" v-for="v in versions.filter(v=>v.id===left||v.id===right)">V{{v.num}} · {{bytes(v.size)}} · {{v.sha}}</p></details></template><p class="empty" v-else>{{diffLoading?'正在比较版本…':left===right?'请选择两个不同的历史版本进行对比。':'暂时无法显示对比结果。'}}</p></section></template></template>
<template v-if="page==='复核工作台'"><section class="card review-board">
<div class="review-statebar"><button v-for="state in ['',...reviewStates]" :aria-pressed="reviewFilter.state===state" @click="reviewFilter.state=state;loadReview(true)">{{state||'全部'}} <b>{{state?reviews.counts[state]||0:Object.values(reviews.counts).reduce((a,b)=>a+b,0)}}</b></button></div>
<div class="filters"><input v-model="reviewFilter.q" aria-label="搜索复核记录" @input="scheduleReview" @keyup.enter="loadReview(true)" placeholder="文件名、复核备注或失败原因"><button class="btn" @click="loadReview(true)">查询</button><button class="btn" @click="reviewFilter=freshReviewForm();loadReview(true)">清除条件</button><button class="btn" :disabled="reviewBusy||!reviews.total" @click="exportReviews">导出复核清单</button></div>
<details class="advanced"><summary>复核范围与排序</summary><div class="filter-grid">
<label>目录<select v-model="reviewFilter.root" @change="loadReview(true)"><option value="">全部目录</option><option v-for="r in s.roots" :value="r.id">{{base(r.path)}}</option></select></label>
<label>文件类型<input v-model="reviewFilter.ext" @change="loadReview(true)" placeholder="例如 xlsx"></label>
<label>解析状态<select v-model="reviewFilter.status" @change="loadReview(true)"><option value="">全部</option><option v-for="n in parseStates">{{n}}</option></select></label>
<label>起始日<input type="date" v-model="reviewFilter.start" @change="loadReview(true)"></label><label>结束日<input type="date" v-model="reviewFilter.end" @change="loadReview(true)"></label>
<label><input type="checkbox" v-model="reviewFilter.baseline" @change="loadReview(true)">包含初始快照</label><label><input type="checkbox" v-model="reviewFilter.latest" @change="loadReview(true)">仅文件最新版</label><label><input type="checkbox" v-model="reviewFilter.starred" @change="loadReview(true)">仅关注文件</label>
<label>排序<select v-model="reviewFilter.sort" @change="loadReview(true)"><option value="">最近保存</option><option value="oldest">最早保存</option><option value="changes">差异最多</option><option value="reviewed">最近复核</option></select></label></div></details>
<div class="scroll"><table><thead><tr><th>文件与版本</th><th>保存时间</th><th>解析结果</th><th>复核结论</th><th>操作</th></tr></thead><tbody><tr v-for="v in reviews.items" :key="v.id"><td><b>{{base(v.rel)}} · V{{v.num}}</b><small>{{parent(v.root,v.rel)}}</small></td><td>{{fmt(v.stamp)}}</td><td>{{v.status}}<small v-if="v.status==='已解析'">{{v.changes}} 项差异</small><small v-if="v.error" class="error">{{v.error}}</small></td><td><span class="tag" :class="v.review==='已复核'?'green':v.review==='需跟进'?'amber':'neutral'">{{v.review}}</span><small class="review-note">{{v.note}}</small><small v-if="v.reviewed_at">{{fmt(v.reviewed_at)}}</small></td><td><button class="textbtn" @click="openReviewVersion(v)">{{v.parent_id?'查看差异':'查看初版'}}</button><button class="textbtn" @click="editReview(v)">登记复核</button><button class="textbtn" v-if="!demo&&v.status==='解析失败'" @click="perform('retry',{id:v.id}).then(()=>loadReview())">重试此版本</button></td></tr></tbody></table></div>
<div class="empty" v-if="!reviews.items.length">{{reviewBusy?'正在读取…':'当前范围没有复核记录'}}</div><div class="pager"><span>共 {{reviews.total}} 个版本</span><div><button class="btn" :disabled="reviewBusy||reviews.page<=1" @click="reviewFilter.page--;loadReview()">上一页</button> {{reviews.page}} / {{reviews.pages}} <button class="btn" :disabled="reviewBusy||reviews.page>=reviews.pages" @click="reviewFilter.page++;loadReview()">下一页</button></div></div>
</section></template>
<template v-if="page==='差异检索'"><section class="card listcard">
<form @submit.prevent="findChanges()"><div class="filters"><label>检索内容<input v-model="findForm.q" maxlength="512" placeholder="例如物料编号、库存或旧值"></label>
<label>查找范围<select v-model="findForm.side"><option value="">全部位置与值</option><option value="old_value">仅旧值</option><option value="new_value">仅新值</option><option value="location">仅位置</option></select></label>
<label>监控目录<select v-model="findForm.root"><option value="">所有目录</option><option v-for="r in s.roots" :value="r.id">{{r.path}}</option></select></label>
<label>事件路径<input v-model="findForm.filename" placeholder="文件名或路径片段"></label><label>扩展名<input v-model="findForm.ext" placeholder="xlsx, csv"></label>
<label>变化类型<select v-model="findForm.kind"><option value="">全部类型</option><option v-for="k in ['新增','修改','删除']">{{k}}</option></select></label>
<label>数值方向<select v-model="findForm.direction"><option value="">全部</option><option value="up">数值上升</option><option value="down">数值下降</option><option value="same">数值等值</option></select></label></div>
<details><summary>更多查询条件</summary><div class="filters"><label>工作表或分组<input v-model="findForm.sheet"></label><label>字段名<input v-model="findForm.field"></label><label>业务编号<input v-model="findForm.record"></label>
<label>开始日期<input type="date" v-model="findForm.start"></label><label>结束日期<input type="date" v-model="findForm.end"></label>
<label><input type="checkbox" v-model="findForm.exact">整项匹配</label><label><input type="checkbox" v-model="findForm.sensitive">区分大小写</label><label><input type="checkbox" v-model="findForm.starred">仅关注文件</label></div></details>
<div class="filters"><label>结果排序<select v-model="findForm.sort"><option value="">最近优先</option><option value="oldest">最早优先</option><option value="path">事件路径</option></select></label>
<button class="primary" :disabled="finderBusy">查询差异</button><button type="button" class="btn" @click="findForm=freshFind();presetId=0;findChanges()">清空条件</button></div></form>
<details><summary>保存或使用查询条件</summary><div class="filters"><label>组合名称<input v-model="presetName" maxlength="60"></label><button class="btn" :disabled="!presetName.trim()" @click="savePreset">保存条件</button>
<label>已保存组合<select v-model.number="presetId" @change="applyPreset"><option :value="0">自定义</option><option v-for="p in presets" :value="p.id">{{p.name}}</option></select></label><button class="textbtn" :disabled="!presetId" @click="forgetPreset">移除组合</button></div></details></section>
<section class="card listcard" aria-live="polite"><p v-if="finderBusy">正在查询已解析差异…</p><template v-if="found"><div class="card-head"><h2>{{found.total}} 项差异</h2><button class="btn" :disabled="!found.total" @click="exportFinder">导出查询结果</button></div><p>{{found.files}} 个文件 · {{found.events}} 条变更事件</p>

<template v-if="page==='目录清单'">

<template v-if="page==='系统设置'"><section class="card settings"><h2>后台引擎状态</h2><div><label>{{demo?'示例进程':'当前进程'}} {{runtime?.pid||'—'}}</label><button class="btn" @click="loadRuntime">刷新状态</button></div><template v-if="runtime"><p>启动 {{fmt(runtime.started)}} · 已运行 {{runtime.uptime}} 秒 · {{runtime.watch}}</p><p>待扫描目录 {{runtime.queued}} · 待解析版本 {{runtime.parsing}} · 等待文件 {{runtime.waiting}}<span v-if="runtime.due_in!==null"> · 最早任务约 {{runtime.due_in}} 秒后到期</span></p><p v-for="(stamp,name) in runtime.beats">{{name}}最近活动 · {{fmt(stamp)}}</p><p v-for="(stamp,name) in runtime.faults" class="error">{{name}} · {{fmt(stamp)}}</p></template></section><section class="card settings"><h2>监控与外观</h2><div><label>周期校对间隔<small>重新检查目录并核对文件内容</small></label><select v-model.number="prefs.interval"><option v-for="n in [5,15,30,60,300,900,3600]" :value="n">{{n<60?n+' 秒':n/60+' 分钟'}}</option></select></div><div><label>界面主题</label><select v-model="prefs.theme"><option>浅色</option><option>深色</option></select></div><div v-if="!demo"><label>登录 Windows 后后台启动</label><input type="checkbox" v-model="prefs.autostart"></div><div><span></span><button class="primary" @click="savePrefs">保存设置</button></div></section><section class="card settings"><h2>存储与维护</h2><div class="actions"><button class="btn" @click="healthDialog">仓库体检报告</button><button class="btn" @click="deliveryDialog()">核查交付包</button><button v-if="demo" class="btn" @click="inspectDialog">示例备份覆盖情况</button></div><div><label>仓库用量<small>按快照大小计算，重复内容只存一份。</small></label><button class="btn" @click="loadStorage">计算用量</button></div><section v-if="storageData" class="storage19"><p>历史版本合计 {{bytes(storageData.logical)}} · 唯一对象 {{bytes(storageData.unique)}} · 去重节省 {{bytes(storageData.saved)}}</p><p>数据库与日志 {{bytes(storageData.database)}} · 所在磁盘可用 {{bytes(storageData.free)}}</p><details><summary>各目录历史用量</summary><p v-for="r in storageData.by_root">{{r.root}} · {{r.versions}} 版 · {{bytes(r.bytes)}}</p></details><details><summary>历史体积最大的文件</summary><p v-for="r </div><footer class="foot"><span><i></i>{{demo?'示例数据':s.watch}}</span><span>FileGuard · 1.14.0</span></footer></main>

<template v-if="dialog.tab==='records'&&dialog.report"><p><span v-for="(n,k) in dialog.report.counts">{{k}} {{n}}　</span> · 跳过全空行：左 {{dialog.report.emptyLeft}} / 右 {{dialog.report.emptyRight}}</p>
<div class="report-controls" @input="dialog.page=1;dialog.expand=null" @change="dialog.page=1;dialog.expand=null"><label>左表行号<input type="number" min="1" v-model.number="dialog.leftRow"></label><label>右表行号<input type="number" min="1" v-model.number="dialog.rightRow"></label><label>含变化的值类型<select v-model="dialog.cellType"><option value="">全部</option><option v-for="k in ['文本','数值','公式','错误','布尔','日期时间','时长']">{{k}}</option></select></label><label><span><input type="checkbox" v-model="dialog.onlySuppressed"> 只看按规则视为相同的原始差别</span></label><label>编号含有<input v-model="dialog.q"></label><label>变化字段含有<input v-model="dialog.field"></label><label>状态<select v-model="dialog.status"><option value="">全部</option><option v-for="(_,k) in dialog.report.counts">{{k}}</option></select></label><label>排序<select v-model="dialog.sort"><option value="">右表原顺序</option><option value="old">左表原顺序</option><option value="key">按编号</option><option value="count">变动字段最多</option></select></label><label><span><input type="checkbox" v-model="dialog.differences"> 隐藏一致行</span></label></div>
<p v-if="dialog.fieldMatch">限定字段 {{dialog.fieldMatch.left}} → {{dialog.fieldMatch.right}} <button type="button" class="textbtn" @click="dialog.fieldMatch=null;dialog.page=1">取消限定</button></p><div class="scroll"><table><thead><tr><th>业务编号</th><th>左行 → 右行</th><th>结果</th><th>字段数</th></tr></thead><tbody><template v-for="r in ledgerSlice.items"><tr><td><button class="textbtn" type="button" @click="dialog.expand=dialog.expand===r.key?null:r.key">{{r.key}}</button></td><td>{{r.old??'—'}} → {{r.new??'—'}}</td><td>{{r.status}}</td><td>{{r.changes.length}}</td></tr><tr v-if="dialog.expand===r.key"><td colspan="4"><p v-if="!r.changes.length">没有字段值差异。</p><details v-if="r.suppressed.length"><summary>按规则视为相同的原始差别 · {{r.suppressed.length}}</summary><p v-for="c in r.suppressed">{{c.left}} {{c.oldAddress}}［{{c.before?.[0]||'缺格'}}］{{c.before?.[1]??'—'}} → {{c.right}} {{c.newAddress}}［{{c.after?.[0]||'缺格'}}］{{c.after?.[1]??'—'}}</p></details><div class="ledger-field" v-for="c in r.changes"><b>{{c.left||'—'}} → {{c.right||'—'}}</b><span>{{c.oldAddress||'—'}}　{{c.before?.[0]||'缺格'}}　{{c.before?.[1]??'—'}}</span><span>{{c.newAddress||'—'}}　{{c.after?.[0]||'缺格'}}　{{c.after?.[1]??'—'}}</span></div></td></tr></template></tbody></table></div></template>
<template v-if="dialog.tab==='fields'"><table><thead><tr><th>字段配对</th><th>影响记录</th><th>新增值</th><th>移除值</th><th>双侧变化</th><th>其中类型改变</th></tr></thead><tbody><tr v-for="v in ledgerSlice.items"><td><button type="button" class="textbtn" @click="ledgerFieldRows(v)">{{v.left||'—'}} → {{v.right||'—'}}</button></td><td>{{v.count}}</td><td>{{v.added}}</td><td>{{v.removed}}</td><td>{{v.changed}}</td><td>{{v.retyped}}</td></tr></tbody></table></template><template v-if="dialog.tab==='issues'"><p>编号重复或不完整的行单列，避免配错业务记录。</p><table><thead><tr><th>一侧</th><th>原始行</th><th>编号</th><th>原因</th></tr></thead><tbody><tr v-for="r in ledgerSlice.items"><td>{{r.side==='l'?'左':'右'}}</td><td>{{r.n}}</td><td>{{r.key}}</td><td>{{r.why}}</td></tr></tbody></table></template>
<template v-if="dialog.tab==='profile'&&dialog.profile"><p>基于{{dialog.profileSide==='l'?'左':'右'}}表表头以下的非空数据行。点击字段查看各取值出现次数。</p>
<div class="scroll"><table><thead><tr><th>字段</th><th>非空 / 空</th><th>不同值 / 多余重复</th><th>含首尾空白</th><th>数值数 / 零</th><th>最小 → 最大</th><th>最长字符 / 行</th><th>类型</th></tr></thead><tbody><tr v-for="p in ledgerSlice.items"><td><button type="button" class="textbtn" @click="ledgerFrequency(p)">{{p.field}}</button></td><td>{{p.filled}} / {{p.missing}}</td><td>{{p.unique}} / {{p.duplicates}}</td><td>{{p.spaces}}</td><td>{{p.numeric}} / {{p.zeros}}</td><td>{{p.min||'—'}} → {{p.max||'—'}}</td><td>{{p.longest}} / {{p.longRow??'—'}}</td><td><span v-for="(n,k) in p.types">{{k}} {{n}}　</span></td></tr></tbody></table></div></template>
<template v-if="dialog.tab==='freq'&&dialog.frequency"><h3>{{dialog.frequency.field}} · 取值频次</h3><div class="actions"><label>取值片段<input v-model="dialog.freqTerm" @input="dialog.page=1"></label><label><input type="checkbox" v-model="dialog.repeatOnly" @change="dialog.page=1"> 只看重复值</label><button type="button" class="textbtn" @click="ledgerTab('profile')">返回字段体检</button></div><table><thead><tr><th>取值</th><th>类型</th><th>次数</th><th>首次 / 末次行</th></tr></thead><tbody><tr v-for="v in ledgerSlice.items"><td class="trace-value">{{v.value}}</td><td>{{v.type}}</td><td>{{v.count}}</td><td>{{v.first}} / {{v.last}}</td></tr></tbody></table></template>
<div class="actions" v-if="dialog.report||dialog.profile"><button type="button" class="btn" :disabled="ledgerSlice.page<=1" @click="dialog.page=ledgerSlice.page-1">上一页</button><span>{{ledgerSlice.page}} / {{ledgerSlice.pages}} 页 · {{ledgerSlice.total}} 项</span><button type="button" class="btn" :disabled="ledgerSlice.page>=ledgerSlice.pages" @click="dialog.page=ledgerSlice.page+1">下一页</button><button type="button" class="btn" :disabled="!ledgerSlice.total" @click="ledgerExport()">导出当前结果 CSV</button><button v-if="dialog.tab==='records'" type="button" class="btn" :disabled="!ledgerSlice.total" @click="ledgerExport(true)">导出字段明细 CSV</button></div></template></template>
<template v-if="dialog.type==='restore_preview'"><p class="path">{{dialog.info.path}}</p><table><thead><tr><th></th><th>当前磁盘文件</th><th>所选 V{{dialog.info.version}}</th></tr></thead><tbody><tr><th>大小</th><td>{{dialog.info.exists?bytes(dialog.info.current_size):'路径不存在'}}</td><td>{{bytes(dialog.info.size)}}</td></tr><tr><th>SHA-256</th><td class="hash">{{dialog.info.current_sha||'—'}}</td><td class="hash">{{dialog.info.sha}}</td></tr></tbody></table><p>最新在册 V{{dialog.info.latest}} · 写回字节差 {{dialog.info.delta}}</p><p>{{dialog.info.identical?'磁盘内容与所选版本一致。':dialog.info.unrecorded?'当前磁盘内容尚未记录，写回前会先留存版本。':dialog.info.exists?'确认后替换此路径的磁盘内容。':'确认后在原路径重建文件。'}}</p><small v-if="demo">此预览使用示例文件。</small></template>
<template v-if="dialog.type==='backup_result'"><p>数据库版本 {{dialog.result.schema}} · {{dialog.result.roots}} 个目录 · {{dialog.result.files}} 个文件条目 · {{dialog.result.versions}} 个版本</p><p>创建时间 {{dialog.result.created?fmt(dialog.result.created):'旧版备份无创建清单'}} · 保存时间范围 {{fmt(dialog.result.oldest)}} 至 {{fmt(dialog.result.latest)}}</p><p>版本合计 {{bytes(dialog.result.logical)}} · 去重后 {{bytes(dialog.result.bytes)}} · 节省 {{bytes(dialog.result.saved)}} · 待核对恢复 {{dialog.result.pending_restores}} 项</p><p v-if="dialog.result.extra_entries">另有 {{dialog.result.extra_entries}} 个未列入备份索引的条目。</p><section v-if="dialog.result.coverage"><h3>按内容摘要核对当前仓库</h3><p>两边都有 {{dialog.result.coverage.shared}} 个对象。当前仓库独有 {{dialog.result.coverage.missing}} 个，共 {{bytes(dialog.result.coverage.missing_bytes)}}，涉及 {{dialog.result.coverage.affected_versions}} 个当前版本。备份独有 {{dialog.result.coverage.only_backup}} 个，共 {{bytes(dialog.result.coverage.only_backup_bytes)}}。</p><small>相同内容可以被多个历史版本引用。</small></section></template>
<template v-if="dialog.type==='inventory'"><div class="filters"><label>路径片段<input v-model="dialog.q"></label><label>子目录及下级<input v-model="dialog.folder" placeholder="业务明细"></label><label>扩展名<input v-model="dialog.ext" placeholder="xlsx, csv"></label><label>摘要前缀<input v-model="dialog.sha"></label><label>排序<select v-model="dialog.sort"><option value="">按路径</option><option value="size">体积最大</option><option value="updated">最近保存</option><option value="version">版本号最高</option></select></label><button type="button" class="btn" @click="loadInventory()">查询成员</button></div>
<template v-if="dialog.data"><p>{{dialog.data.meta.label}} · {{dialog.data.total}} 个文件 · {{bytes(dialog.data.bytes)}} · {{dialog.data.objects}} 个唯一内容</p><div class="actions"><button type="button" class="btn" :disabled="!dialog.data.total" @click="exportInventory()">导出成员 CSV</button><button type="button" class="btn" @click="checkDisk(dialog.data.page)">核对本页原路径</button><label><input type="checkbox" v-model="dialog.quick" @change="dialog.disk=null">只核对大小</label><button type="button" class="btn" :disabled="!dialog.data.total||(demo&&(dialog.active.q||dialog.active.ext||dialog.active.folder||dialog.active.sha))" @click="exportInventory(true)">{{demo?'下载完整示例包':'导出所选历史文件 ZIP'}}</button><button type="button" class="btn" @click="deliveryDialog(dialog.active)">对照此范围核查交付包</button></div><details v-if="dialog.disk" open><summary>原路径核对 · {{fmt(dialog.disk.checked)}}</summary><p><span v-for="(n,k) in dialog.disk.counts">{{k}} {{n}}　</span></p><ul><li v-for="r in dialog.disk.items">{{r.rel}} · {{r.state}}<small v-if="r.current_rel&&r.current_rel!==r.rel">当前在册位置 {{r.current_rel}}</small><small v-if="r.replaced">此路径当前对应另一文件编号</small></li></ul></details><div class="scroll"><table><thead><tr><th>清单路径</th><th>版本</th><th>大小</th><th>摘要</th></tr></thead><tbody><tr v-for="r in dialog.data.items"><td>{{r.rel}}</td><td>V{{r.num}}</td><td>{{bytes(r.size)}}</td><td><details><summary>{{r.sha.slice(0,10)}}</summary><span class="hash">{{r.sha}}</span></details></td></tr></tbody></table></div><div class="pager"><button type="button" class="btn" :disabled="dialog.data.page<=1" @click="loadInventory(dialog.data.page-1,dialog.active)">上一页</button>{{dialog.data.page}} / {{dialog.data.pages}}<button type="button" class="btn" :disabled="dialog.data.page>=dialog.data.pages" @click="loadInventory(dialog.data.page+1,dialog.active)">下一页</button></div></template></template>
<template v-if="dialog.type==='delivery_check'"><label>文件交付 ZIP 路径<input v-model="dialog.path" required></label><small>{{dialog.scope?'同时核对此范围的路径、版本、长度和摘要。':'依据包内清单校验每份副本。'}}</small></template>
<template v-if="dialog.type==='delivery_result'"><p>{{dialog.result.label}} · 打包 {{fmt(dialog.result.created)}} · 来源扫描 {{fmt(dialog.result.scanned)}}</p><p>清单 {{dialog.result.total}} 项 · 内容通过 {{dialog.result.verified}} 项 · 已核对 {{bytes(dialog.result.bytes)}} · {{dialog.result.compared?'已对照所选清单':'依据包内清单'}}</p><p v-for="(n,k) in dialog.result.counts">{{k}} {{n}}</p><ul><li v-for="r in dialog.result.issues">{{r.kind}} · {{r.rel}}</li></ul><small v-if="dialog.result.issue_count>100">共 {{dialog.result.issue_count}} 项问题，显示前 100 项。</small></template>
<template v-if="dialog.type==='health'"><p>保留最近五份完整报告。检查读取历史对象，后台采集继续运行。</p><div class="actions"><button type="button" class="btn" :disabled="dialog.job.state==='检查中'" @click="refreshHealth('health_start')">{{demo?'查看示例检查':'开始检查'}}</button><button type="button" v-if="dialog.job.state==='检查中'" class="btn" @click="refreshHealth('health_cancel')">取消检查</button></div><p role="status">{{dialog.job.state}} <span v-if="dialog.job.state==='检查中'">{{dialog.job.done}} / {{dialog.job.total}}</span> {{dialog.job.error}}</p>
<template v-if="dialog.reports.length"><label>检查报告<select v-model.number="dialog.id" @change="dialog.status='';dialog.change='';loadHealth()"><option v-for="r in dialog.reports" :value="r.id">#{{r.id}} · {{fmt(r.ended)}}</option></select></label><template v-if="dialog.data"><p>核验通过 {{dialog.data.report.verified}} / {{dialog.data.report.objects}} 个对象，{{bytes(dialog.data.report.verified_bytes)}}。异常 {{dialog.data.report.issues}}，涉及 {{dialog.data.report.affected}} 个版本。另有未引用对象 {{dialog.data.report.unreferenced}} 个。</p>
<div class="filters"><label>对象摘要片段<input v-model="dialog.q"></label><label>结果类别<select v-model="dialog.status"><option value="">全部</option><option v-for="(_,k) in dialog.data.counts">{{k}}</option></select></label><label>与前一份报告相比<select v-model="dialog.change"><option value="">本轮发现</option><option v-for="(_,k) in dialog.data.changes">{{k}}</option></select></label><button type="button" class="btn" @click="loadHealth()">筛选</button><button type="button" class="btn" @click="healthExport">导出明细</button></div><p>{{dialog.data.total}} 条匹配</p><ul><li v-for="r in dialog.data.items"><span class="hash">{{r.object_key}}</span> · {{r.status}} · {{r.change}}<small>索引 {{r.expected??'—'}} / 实际 {{r.actual??'—'}} 字节 · {{r.versions}} 版 / {{r.files}} 个文件</small><button v-if="r.versions" class="textbtn" type="button" @click="affectedVersions(r)">查看引用</button></li></ul><div class="pager"><button type="button" class="btn" :disabled="dialog.data.page<=1" @click="loadHealth(dialog.data.page-1)">上一页</button>{{dialog.data.page}} / {{dialog.data.pages}}<button type="button" class="btn" :disabled="dialog.data.page>=dialog.data.pages" @click="loadHealth(dialog.data.page+1)">下一页</button></div>
<details v-if="dialog.refs" open><summary>当前引用版本 · {{dialog.refs.total}}</summary><p v-for="r in dialog.refs.items">{{r.root}} / {{r.rel}} · V{{r.num}} · {{fmt(r.stamp)}}</p><button type="button" class="btn" :disabled="dialog.refs.page<=1" @click="affectedVersions(dialog.refs.row,dialog.refs.page-1)">上一页</button><button type="button" class="btn" :disabled="dialog.refs.page>=dialog.refs.pages" @click="affectedVersions(dialog.refs.row,dialog.refs.page+1)">下一页</button></details></template></template></template>
<template v-if="dialog.type==='variance'"><div class="filters"><label>工作表或分组<input v-model="dialog.sheet"></label><label>字段<input v-model="dialog.field"></label><label>业务编号<input v-model="dialog.record"></label><label>绝对差额至少<input v-model="dialog.minimum" placeholder="例如 5"></label><label>绝对变化率至少（%）<input v-model="dialog.rate" placeholder="例如 10"></label><label>变化方向<select v-model="dialog.direction"><option value="">全部</option><option v-for="k in ['上升','下降','等值']">{{k}}</option></select></label><label>顺序<select v-model="dialog.sort"><option value="magnitude">差额绝对值最大</option><option value="rate">变化率绝对值最大</option><option value="up">差额降序</option><option value="down">差额升序</option><option value="position">原始差异顺序</option></select></label><button type="button" class="btn" @click="loadVariance()">核对</button></div>
<template v-if="dialog.data"><p>{{dialog.data.total}} 项符合条件 · 上升 {{dialog.data.counts['上升']||0}} · 下降 {{dialog.data.counts['下降']||0}} · 等值 {{dialog.data.counts['等值']||0}}</p><small v-for="(n,k) in dialog.data.skips">{{k}} {{n}}　</small><details><summary>按分组与字段汇总匹配项</summary><p v-for="g in dialog.data.groups">{{g.sheet}} / {{g.field}} · {{g.count}} 项 · {{g.old}} → {{g.new}} · 净差 {{g.delta}}</p></details><div class="scroll"><table><thead><tr><th>位置</th><th>旧值</th><th>新值</th><th>差额</th><th>变化率</th></tr></thead><tbody><tr v-for="r in dialog.data.items"><td><button type="button" class="textbtn" @click="varianceSource(r)">{{r.sheet}} · {{r.location}}</button> <button type="button" class="textbtn" @click="reportDialog('trace',r)">追踪此项</button><small>{{r.record}}　{{r.field}}</small></td><td>{{r.old}}</td><td>{{r.new}}</td><td>{{r.delta}}</td><td>{{r.percent===null?'原值为零':r.percent+'%'}}</td></tr></tbody></table></div><div class="pager"><button type="button" class="btn" :disabled="dialog.data.page<=1" @click="loadVariance(dialog.data.page-1,dialog.applied)">上一页</button>{{dialog.data.page}} / {{dialog.data.pages}}<button type="button" class="btn" :disabled="dialog.data.page>=dialog.data.pages" @click="loadVariance(dialog.data.page+1,dialog.applied)">下一页</button><button type="button" class="btn" :disabled="!dialog.data.total" @click="varianceExport">导出数值 CSV</button></div><small>变化率 = 差额 ÷ 旧值绝对值。此处仅统计差异中的可比数值。</small></template></template>
<template v-if="dialog.type==='period'||dialog.type==='trace'">
<div v-if="dialog.type==='period'" class="report-controls">
<label>本期开始<input type="date" v-model="dialog.form.start"></label><label>本期结束<input type="date" v-model="dialog.form.end"></label>
<label>统计分组<select v-model="dialog.form.group"><option v-for="(label,k) in {file:'文件',root:'监控目录',folder:'所在文件夹',ext:'扩展名',kind:'变更类型',source:'采集来源',weekday:'星期',hour:'小时'}" :value="k">{{label}}</option></select></label>
<label>监控目录<select v-model="dialog.form.root_id"><option value="">全部</option><option v-for="r in s.roots" :value="r.id">{{r.path}}</option></select></label>
<label>历史路径片段<input v-model="dialog.form.q"></label><label>扩展名<input v-model="dialog.form.ext" placeholder="xlsx, csv"></label><label>事件类型<input v-model="dialog.form.kind" placeholder="例如 内容修改"></label><label>采集来源<input v-model="dialog.form.source" placeholder="例如 手动扫描"></label>
<label>只看分组<select v-model="dialog.form.trend"><option v-for="(label,k) in {'':'全部',up:'次数增加',down:'次数减少',equal:'次数相同',new:'本期才出现',gone:'仅上期出现'}" :value="k">{{label}}</option></select></label>
<label>排序<select v-model="dialog.form.sort"><option v-for="(label,k) in {after:'本期次数',before:'上期次数',delta:'增幅最大（次数）',drop:'减幅最大（次数）',files:'文件最多',days:'活跃天数最多',label:'分组名称'}" :value="k">{{label}}</option></select></label>
<label><span>初次采集</span><span><input type="checkbox" v-model="dialog.form.initial"> 包含初始建档</span></label>
</div>
<p v-if="dialog.type==='trace'">填写业务编号、字段或位置中的至少一项，查看这个文件多次保存之间的变化。</p>
<div v-if="dialog.type==='trace'" class="report-controls"><label>业务编号<input v-model="dialog.form.record" placeholder="例如 MD-001"></label><label>字段<input v-model="dialog.form.field" placeholder="例如 现存量"></label><label>位置<input v-model="dialog.form.location" placeholder="例如 C2"></label><label>工作表或分组<input v-model="dialog.form.sheet"></label>
<label>起始新版本号<input type="number" min="1" v-model="dialog.form.low"></label><label>结束新版本号<input type="number" min="1" v-model="dialog.form.high"></label>
<label>变化类型<select v-model="dialog.form.kind"><option value="">全部</option><option v-for="t in ['新增','修改','删除']">{{t}}</option></select></label>
<label>差异类别<input v-model="dialog.form.category" placeholder="例如 单元格值"></label><label>旧值或新值含有<input v-model="dialog.form.value"></label>
<label><span>轨迹</span><span><input type="checkbox" v-model="dialog.form.only_return"> 只看回到先前可见值</span></label><label><span>时间顺序</span><span><input type="checkbox" v-model="dialog.form.ascending"> 最早版本优先</span></label>
</div>
<div class="actions"><button type="button" class="primary" @click="runReport()">查询</button><button type="button" class="btn" :disabled="!dialog.data?.total" @click="exportReport">导出查询结果 CSV</button></div>
<p v-if="dialog.loading" role="status">正在读取变动…</p>
<template v-if="dialog.data">
<template v-if="dialog.type==='period'"><p>上期 {{dialog.data.previous}} 至 {{dialog.data.previous_end}}，{{dialog.data.before}} 次，涉及 {{dialog.data.files_before}} 个文件。<br>本期 {{dialog.data.start}} 至 {{dialog.data.end}}，{{dialog.data.after}} 次，涉及 {{dialog.data.files_after}} 个文件。</p>
<div class="scroll"><table><thead><tr><th>分组</th><th>上期</th><th>本期</th><th>增减</th><th>本期文件</th><th>活跃天数</th><th>本期首次 / 最近</th><th>核查</th></tr></thead><tbody><tr v-for="r in dialog.data.items"><td>{{r.label}}</td><td>{{r.before}}</td><td>{{r.after}}</td><td>{{r.delta>0?'+'+r.delta:r.delta}}</td><td>{{r.files}}</td><td>{{r.days}}</td><td>{{r.first?fmt(r.first):'—'}}<br>{{r.last?fmt(r.last):'—'}}</td><td><button type="button" class="textbtn" @click="reportSource(r)">最近事件</button></td></tr></tbody></table></div></template>
<template v-else><p>命中 {{dialog.data.versions}} 个版本 · 回到先前可见值 {{dialog.data.returns}} 项</p><small>所选范围内可见相邻版本的解析情况：<span v-for="(n,k) in dialog.data.coverage"> {{k}} {{n}}　</span></small>
<div class="scroll"><table><thead><tr><th>保存时间 / 版本</th><th>当时路径 / 位置</th><th>编号 / 字段</th><th>旧值</th><th>新值</th><th>变化</th></tr></thead><tbody><tr v-for="r in dialog.data.items"><td>{{fmt(r.stamp)}}<br>V{{r.prior}} → V{{r.version}}</td><td>{{r.rel}}<br>{{r.sheet}} · <button type="button" class="textbtn" @click="reportSource(r)">{{r.location}}</button></td><td>{{r.record}}<br>{{r.field}}</td><td class="trace-value">{{r.old??'—'}}</td><td class="trace-value">{{r.new??'—'}}</td><td>{{r.kind}} {{r.category}}<small v-if="r.returning==='是'">回到先前可见值</small></td></tr></tbody></table></div></template>
<p v-if="!dialog.data.total">当前条件没有匹配项。</p><div class="actions"><button type="button" class="btn" :disabled="dialog.data.page===1" @click="runReport(dialog.data.page-1,dialog.applied)">上一页</button><span>{{dialog.data.page}} / {{dialog.data.pages}} 页 · {{dialog.data.total}} 项</span><button type="button" class="btn" :disabled="dialog.data.page===dialog.data.pages" @click="runReport(dialog.data.page+1,dialog.applied)">下一页</button></div>
</template></template>
<template v-if="dialog.type==='capture_policy'"><p class="path">{{dialog.path}}</p><label>稳定等待时长<select v-model.number="dialog.settle_ms"><option v-for="v in [500,1500,3000,5000,10000]" :value="v">{{v/1000}} 秒</option></select></label><label><input type="checkbox" v-model="dialog.all_types">对所有扩展名启用稳定等待</label><small>监听到保存后，在复查中确认签名保持稳定。默认用于 Office、开放文档、PDF、电子书、ZIP 和笔记本等格式。</small></template>
<template v-if="dialog.type==='waiting_files'"><p class="path">{{dialog.path}}</p><div class="filters"><label>文件路径<input v-model="dialog.q" @keyup.enter.prevent="loadWaiting()"></label><label>等待原因<select v-model="dialog.reason" @change="loadWaiting()"><option value="">全部</option><option v-for="v in dialog.data?.reasons">{{v}}</option></select></label><label>排序<select v-model="dialog.sort" @change="loadWaiting()"><option value="">最早等待</option><option value="attempts">复查次数最多</option><option value="path">文件路径</option></select></label><button type="button" class="btn" @click="loadWaiting()">查询</button></div><template v-if="dialog.data"><p>{{dialog.data.total}} 个文件</p><div class="scroll"><table><thead><tr><th>路径与原因</th><th>首次等待</th><th>最近一次</th><th>观察次数</th></tr></thead><tbody><tr v-for="r in dialog.data.items"><td>{{r.rel}}<small>{{r.reason}}</small></td><td>{{fmt(r.first_seen)}}</td><td>{{fmt(r.last_seen)}}</td><td>{{r.attempts}}</td></tr></tbody></table></div><div class="pager"><button class="btn" type="button" :disabled="dialog.data.page<=1" @click="loadWaiting(dialog.data.page-1)">上一页</button>{{dialog.data.page}} / {{dialog.data.pages}}<button class="btn" type="button" :disabled="dialog.data.page>=dialog.data.pages" @click="loadWaiting(dialog.data.page+1)">下一页</button></div></template></template>
<template v-if="dialog.type==='scan_log'"><p class="path">{{dialog.path}}</p><div class="filters"><label>运行结果<select v-model="dialog.state" @change="loadJournal()"><option value="">全部</option><option v-for="v in ['完成','等待保存','有异常','中断','进行中']">{{v}}</option></select></label><label>触发来源<select v-model="dialog.source" @change="loadJournal()"><option value="">全部</option><option v-for="v in dialog.data?.sources">{{v}}</option></select></label><label><input type="checkbox" v-model="dialog.skips" @change="loadJournal()">仅有跳过项</label><button type="button" class="btn" @click="loadJournal()">刷新</button></div>
<template v-if="dialog.data"><p>匹配 {{dialog.data.total}} 次 · 平均 {{dialog.data.average}} 毫秒 · 最长 {{dialog.data.longest}} 毫秒</p><div class="scroll"><table><thead><tr><th>开始 / 来源</th><th>结果</th><th>耗时</th><th>明细</th></tr></thead><tbody><tr v-for="r in dialog.data.items" :key="r.id"><td>{{fmt(r.started)}}<small>{{r.source}}</small></td><td>{{r.status}}</td><td>{{r.ended?r.elapsed_ms+' ms':'—'}}</td><td><details><summary>运行数据</summary><p>候选 {{r.candidates}} · 快照读取 {{r.captured}}（{{bytes(r.read_bytes)}}）· 内容复用 {{r.reused}} · 等待 {{r.waiting}} · 跳过 {{r.skipped}}</p><p v-for="(n,k) in r.skip_reasons">{{k}} {{n}}</p><p v-if="r.problem">{{r.problem}}</p></details></td></tr></tbody></table></div><p v-if="!dialog.data.total">没有匹配的运行记录。</p>
<div class="pager"><button type="button" class="btn" :disabled="dialog.data.page<=1" @click="loadJournal(dialog.data.page-1)">上一页</button>{{dialog.data.page}} / {{dialog.data.pages}}<button type="button" class="btn" :disabled="dialog.data.page>=dialog.data.pages" @click="loadJournal(dialog.data.page+1)">下一页</button><button type="button" class="btn" :disabled="!dialog.data.total" @click="exportJournal">导出 CSV</button></div></template><small>每个目录保留最近 200 次扫描。</small></template>
<template v-if="dialog.type==='rule_history'"><p class="path">{{dialog.path}}</p><ol><li v-for="r in dialog.entries" :key="r.id">{{fmt(r.stamp)}} · {{r.patterns||'无排除规则'}} · {{r.max_mb ? r.max_mb+' MiB':'不限大小'}}</li></ol><small>最近 100 次配置，最新在前。</small></template><template v-if="dialog.type==='inspect'"><label>备份 ZIP 路径<input v-model="dialog.path" required></label><small>逐个核对对象，无需退出监控。</small></template><template v-if="dialog.type==='backup'"><label>管理口令<input v-model="dialog.password" type="password" autocomplete="off" required></label><label>新备份文件的完整路径<input v-model="dialog.path" required></label></template><template v-if="dialog.type==='root'"><label>目录路径<div class="inline"><input v-model="dialog.path" placeholder="例如 D:\业务资料\仓库" required :readonly="!!dialog.id"><button type="button" class="btn" v-if="native&&!dialog.id" @click="chooseDir">浏览</button></div></label><label>排除规则<input v-model="dialog.patterns" placeholder="例如 *.tmp，*.bak，缓存/*"></label><label>单文件大小上限（MiB）<input type="number" min="0" v-model.number="dialog.max_mb"></label><small>填 0 表示不限大小。超过上限的文件会跳过。</small><details><summary>保存前预演规则</summary><label>待测文件相对路径，每行一个<textarea v-model="dialog.paths" placeholder="草稿/试算.xlsx"></textarea></label><label>假设每个文件大小（字节，可留空）<input type="number" min="0" v-model="dialog.probeBytes"></label><button class="btn" type="button" @click="previewRules">预演</button><ul v-if="dialog.samples&&dialog.probed===ruleSignature(dialog)"><li v-for="r in dialog.samples">{{r.rel}} · {{r.reason}} <span v-if="r.pattern">· {{r.pattern}} 命中 {{r.part}}</span></li></ul></details></template>
<template v-if="dialog.type==='save'"><label>保存路径<input v-model="dialog.path" required placeholder="请输入完整的新文件路径"></label></template><template v-if="['info','confirm'].includes(dialog.type)"><p style="white-space:pre-line">{{dialog.body}}</p></template>
<template v-if="dialog.type==='tree'"><label class="search-input"><ico n="search"></ico><input v-model="dialog.query" placeholder="搜索子目录路径"></label><div class="picklist"><button type="button" @click="rootFiles(dialog.root)">全部文件</button><button type="button" v-for="folder in visibleFolders" :key="folder.path" @click="treeSelect(dialog.root,folder.path)" :style="{paddingLeft:(8+14*(folder.path.split('/').length-1))+'px'}"><ico n="folder"></ico><span>{{folder.path}}</span><small>{{folder.total}} 个文件</small></button></div><small v-if="!dialog.folders.length">当前目录没有含已跟踪文件的子目录。</small><small v-else-if="!visibleFolders.length">没有匹配的子目录。</small></template><template v-if="dialog.type==='pick'"><div class="picker-tools"><label class="search-input"><ico n="search"></ico><input id="filePicker" v-model="pickQ" @input="searchPick" placeholder="搜索现名、旧名或相对路径"></label><select v-model="pickScope" aria-label="历史文件范围" @change="pickPage=1;loadPicks()"><option v-for="entry in fileScopes" :value="entry[0]">{{entry[1]}}</option></select></div><div class="picklist"><button type="button" v-for="v in picks.items" :key="v.id" :disabled="pickLoading" @click="picked(v)"><span class="file-icon" :class="tone(v.ext)"><ico :n="fileIcon(v.ext)"></ico></span><span class="file-summary"><b>{{base(v.rel)}}</b><small>{{parent(v.root,v.rel)}}</small><small v-if="v.matched_path">原路径：{{v.matched_path}}</small><small><span class="tag" :class="stateTone(v.file_state)">{{v.file_state}}</span>　V{{v.version}} · {{fmt(v.updated)}}</small></span><ico n="chevron-right"></ico></button><p v-if="pickLoading" role="status">正在查找…</p><p v-else-if="!picks.items.length">当前范围内没有找到文件</p></div><div class="pager"><span>共 {{picks.total}} 个文件</span><span><button type="button" class="btn" :disabled="pickPage<=1" @click="pickPage--;loadPicks()">上一页</button> <button type="button" class="btn" :disabled="pickPage*picks.size>=picks.total" @click="pickPage++;loadPicks()">下一页</button></span></div></template>
<p class="error" v-if="dialog.error">{{dialog.error}}</p><div v-if="!['pick','info','tree','rule_history','private_records','scan_log','waiting_files','ledger','receipt','period','trace','inventory','health','variance','backup_result','delivery_result'].includes(dialog.type)&&!(dialog.type==='restore_preview'&&(demo||dialog.info.identical))" class="form-actions"><button type="button" class="btn" :disabled="busy" @click="dialog=null">取消</button><button class="primary" :disabled="busy">{{busy?'处理中…':dialog.submit||'保存'}}</button></div></form></section></div><div class="toast" role="status" v-if="message">{{message}}</div></div></div><script src="vue.js"></script><script src="icons.js"></script><script src="ledger.js"></script><script src="view.js"></script><script src="app.js"></script></body></html>
