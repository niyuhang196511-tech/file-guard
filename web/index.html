<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FileGuard · 文件变更追溯</title><link rel="stylesheet" href="style.css"></head><body><div id="app" v-cloak><div class="shell" :class="{dark:theme==='深色'}">
<aside><div class="brand"><div class="brand-mark"><ico n="shield-check"></ico></div><div><strong>FileGuard</strong><small>文件变更追溯</small></div></div>
<nav><div class="nav-label">工作空间</div><button v-for="x in nav.slice(0,16)" :aria-label="x[0]" :aria-current="page===x[0]?'page':undefined" :class="{active:page===x[0]}" @click="go(x[0])"><ico :n="x[1]"></ico>{{x[0]}}</button><div class="nav-label second">系统管理</div><button v-for="x in nav.slice(16)" :aria-label="x[0]" :aria-current="page===x[0]?'page':undefined" :class="{active:page===x[0]}" @click="go(x[0])"><ico :n="x[1]"></ico>{{x[0]}}</button></nav>
<div class="aside-bottom"><div class="local-icon"><ico n="monitor"></ico></div><div><b>{{demo?'示例工作区':'本地工作区'}}</b><small>桌面版 · 1.23.0</small></div></div></aside>
<main><header class="top"><div class="crumb"><ico n="panel-left"></ico><i></i>工作空间 <span>›</span><b>{{page}}</b></div><div class="tools"><button class="global-search" @click="openSearch"><ico n="search"></ico>搜索文件 <kbd>Ctrl K</kbd></button><button class="iconbtn" title="通知中心" aria-label="通知中心" @click="notifications=!notifications"><ico n="bell"></ico><em v-if="alerts.length" class="reddot"></em></button><button class="iconbtn" :title="theme==='浅色'?'切换深色':'切换浅色'" aria-label="切换主题" @click="toggleTheme"><ico :n="theme==='浅色'?'moon':'sun'"></ico></button></div></header>
<div v-if="notifications" class="notice"><div class="card-head"><b>通知中心</b><button class="iconbtn" @click="notifications=false" aria-label="关闭通知"><ico n="x"></ico></button></div><p v-if="!alerts.length">暂无运行异常</p><button class="alert-link" v-for="a in alerts" @click="openAlert(a)"><span>{{a.label}}</span><ico n="chevron-right"></ico></button><div v-if="s.recent.length" class="mini-notes"><b>最近文件活动</b><button v-for="e in s.recent.slice(0,3)" class="textbtn" @click="notifications=false;fromEvent(e)">{{base(e.rel)}} · {{e.kind}}</button></div></div>
<div class="workspace">
<template v-if="page==='系统总览'"><section class="hero"><div class="contours"></div><div><div class="hero-state"><span class="dot"></span>{{statusText}}</div><h1>监控工作台</h1><p>{{demo?'示例工作区':'本地工作区'}}<i>·</i>{{activeRoots}} 个目录正在监控<i>·</i>{{dateText}}</p></div><button class="hero-btn" :disabled="demo&&!s.recent.some(r=>r.rel.endsWith('库存台账.xlsx')&&r.kind==='内容修改')" @click="demo?fromEvent(s.recent.find(r=>r.rel.endsWith('库存台账.xlsx')&&r.kind==='内容修改')):rootDialog()"><ico :n="demo?'folder':'plus'"></ico>{{demo?'体验整行对比':'添加目录'}}</button></section>
<div class="stats"><button v-for="m in metrics" class="stat" @click="metricGo(m)"><span class="stat-title">{{m.label}}<span class="tile-icon" :class="m.tone"><ico :n="m.icon"></ico></span></span><strong>{{num(m.value)}}</strong><small>{{m.hint}}</small></button></div>
<div class="chart-row"><section class="card trend"><div class="card-head"><h2>文件变更趋势</h2><select v-model.number="days" @change="refresh"><option v-for="v in [7,14,30]" :value="v">近 {{v}} 天</option></select></div><div class="legend"><span><b class="bl"></b>内容修改</span><span><b class="te"></b>新增文件</span><span><b class="sl"></b>其他变更</span></div>
<div class="chart" v-if="s.trend.length"><svg viewBox="0 0 640 146" role="img" aria-label="每日内容修改、新增和其他变更趋势"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#537dce" stop-opacity=".17"/><stop offset="1" stop-color="#537dce" stop-opacity="0"/></linearGradient></defs><g v-for="j in [0,1,2,3]"><line x1="34" x2="624" :y1="15+j*34" :y2="15+j*34" class="grid"/><text x="24" :y="19+j*34" text-anchor="end">{{ceil*(3-j)/3}}</text></g><path :d="area" fill="url(#fill)"/><polyline v-for="(k,i) in ['edited','added','other']" :points="points(k)" fill="none" :stroke="['#426fbd','#36a99a','#99a9bf'][i]" :stroke-width="i===0?3:2" stroke-linejoin="round" stroke-linecap="round"/><g v-for="(d,i) in s.trend"><text v-if="xlabel(i)" :x="px(i)" y="141" text-anchor="middle">{{d.day.slice(5).replace('-','/')}}</text><rect :x="px(i)-8" y="4" width="16" height="116" fill="transparent"><title>{{d.day}}　修改 {{d.edited}}　新增 {{d.added}}　其他 {{d.other}}</title></rect></g></svg></div></section>
<section class="card"><div class="card-head"><h2>文件类型分布</h2><span class="quiet">按文件数</span></div><div class="distribution"><div class="donut" :style="{background:donut}"><div><strong>{{num(s.files)}}</strong><small>文件总数</small></div></div><div class="dist-list"><div v-for="(g,i) in s.groups"><span><b :style="{background:palette[i%5]}"></b>{{g[0]}}</span><strong>{{num(g[1])}}</strong></div><span class="quiet" v-if="!s.groups.length">尚无已监控文件</span></div></div></section></div>
<div class="bottom-row"><section class="card"><div class="card-head"><h2>最近变更</h2><button class="textbtn" @click="go('变更记录')">全部记录 <ico n="arrow-right"></ico></button></div><div class="activity" v-for="e in s.recent" @click="fromEvent(e)" tabindex="0" @keydown.enter="fromEvent(e)"><div class="file-icon" :class="tone(e.ext)"><ico :n="fileIcon(e.ext)"></ico></div><div class="activity-name"><b>{{base(e.rel)}}</b><small>{{parent(e.root,e.rel)}}</small></div><span class="tag" :class="kindTone(e.kind)">{{e.kind}}</span><time>{{shortTime(e.stamp)}}</time></div><div v-if="!s.recent.length" class="empty"><ico n="history"></ico><b>暂无变更记录</b><small>添加目录后，这里将显示最近的文件活动。</small></div></section>
<section class="card"><div class="card-head"><h2>监控目录</h2><button class="textbtn" @click="go('目录监控')">管理 <ico n="arrow-right"></ico></button></div><div v-for="r in s.roots.slice(0,4)" class="root-mini"><div class="folder-icon"><ico n="folder"></ico></div><div><b>{{base(r.path)}}</b><small>{{num(r.total)}} 个文件</small></div><span class="light-state" :class="{warn:!!r.error,off:!r.active}"><i></i>{{rstate(r)}}</span></div><div class="empty" v-if="!s.roots.length"><ico n="folder-plus"></ico><b>还没有监控目录</b><button class="textbtn" @click="rootDialog()">添加第一个目录</button></div></section></div></template>
<template v-else><div class="page-title"><div><h1>{{page}}</h1><p>{{descs[page]}}</p></div><div class="actions"><button class="btn" v-if="page==='目录监控'" :disabled="!activeRoots" @click="scanRoots()"><ico n="refresh-cw"></ico>{{demo?'模拟扫描全部':'扫描全部'}}</button><button class="primary" v-if="page==='目录监控'&&!demo" @click="rootDialog()"><ico n="plus"></ico>添加目录</button><button class="btn" v-if="page==='变更记录'" @click="reportDialog('period')">变更期间对照</button><button class="btn" v-if="file&&['历史版本','版本对比'].includes(page)" @click="reportDialog('trace')">字段变动轨迹</button><button class="btn" v-if="file&&['历史版本','版本对比'].includes(page)" @click="receiptDialog">保存核对</button><button class="btn" v-if="ledgerEnabled&&['历史版本','版本对比'].includes(page)" @click="ledgerDialog">台账对账</button><button class="btn" v-if="file&&['历史版本','版本对比'].includes(page)&&!textReturn" @click="searchThisFile">检索本文件正文</button><button class="btn" v-if="page==='版本对比'&&activeContentVersion" @click="openSnapshot(activeContentVersion)">预览新版原件</button><button class="btn" v-if="page==='版本对比'&&activeContentVersion" :disabled="hasBundleVersion(activeContentVersion.id)" @click="addBundleVersion(activeContentVersion)">{{hasBundleVersion(activeContentVersion.id)?'新版已在交付篮':'新版加入交付篮'}}</button><button class="btn" v-if="bundleRows.length&&['历史版本','版本对比','历史正文检索','复核工作台'].includes(page)" @click="go('历史版本交付篮')">打开交付篮（{{bundleRows.length}}）</button><button class="btn" v-if="page==='版本对比'&&canTraceLines(activeContentVersion)" @click="openLineage(activeContentVersion)">追溯新版逐行来源</button><button class="btn" v-if="lineageReturn&&['历史版本','版本对比'].includes(page)" @click="go('逐行来源')">返回逐行来源</button><button class="btn" v-if="page==='版本对比'&&activeContentVersion&&!contentReturn" @click="go('相同内容追溯',{sha:activeContentVersion.sha})">追溯新版正文</button><button class="btn" v-if="file&&['历史版本','版本对比'].includes(page)&&!pathReturn" @click="openPath(file,'identity')">查看此身份沿革</button><button class="btn" v-if="triReturn&&['历史版本','版本对比'].includes(page)" @click="go('清单三方对照')">返回三方对照</button><button class="btn" v-if="pathReturn&&['历史版本','版本对比'].includes(page)" @click="go('路径沿革')">返回路径沿革</button><button class="btn" v-if="contentReturn&&['历史版本','版本对比'].includes(page)" @click="go('相同内容追溯')">返回相同内容追溯</button><button class="btn" v-if="textReturn&&['历史版本','版本对比'].includes(page)" @click="go('历史正文检索')">返回正文检索</button><button class="btn" v-if="reviewReturn&&['历史版本','版本对比'].includes(page)" @click="go('复核工作台')">返回复核工作台</button><button class="btn" v-if="eventReturn&&['历史版本','版本对比'].includes(page)" @click="returnToEvents">返回变更记录</button><button class="btn" v-if="['变更记录','文件管理','审计中心'].includes(page)" :disabled="listLoading||!!rangeError||!list.total" @click="exportEvents"><ico n="download"></ico>{{listLoading?'正在筛选…':'导出记录（'+num(list.total)+' 条）'}}</button></div></div>
<template v-if="page==='目录监控'"><div v-if="!s.roots.length" class="card empty"><ico n="folder-plus"></ico><b>添加第一个业务目录</b><small>首次扫描会为已有文件建立初始版本。</small><button class="primary" @click="rootDialog()">添加目录</button></div><section class="card root-toolbar" v-if="s.roots.length"><label class="search-input"><ico n="search"></ico><input v-model="rootQuery" placeholder="搜索目录名称或完整路径" aria-label="搜索监控目录"></label><select aria-label="目录排序" v-model="rootOrder"><option value="">添加顺序</option><option value="count">在册文件最多</option></select><div class="root-tabs"><button v-for="tab in rootTabs" :aria-pressed="rootScope===tab.label" @click="rootScope=tab.label;rootFocus=null">{{tab.label}} <b>{{tab.count}}</b></button></div><button class="textbtn" v-if="rootFocus||rootQuery||rootScope!=='全部'" @click="clearRootFilter">清除筛选</button></section>
<section class="card root-card" v-for="r in visibleRoots" :key="r.id"><div class="folder-icon"><ico n="folder"></ico></div><div class="grow"><h2>{{base(r.path)}}</h2><p class="path">{{r.path}}</p><small>{{num(r.total)}} 个在册文件　·　{{r.watch_mode}}　·　最近扫描 {{fmt(r.last_scan)}}</small><details v-if="r.active&&r.waiting" class="wait-list"><summary>等待保存或读取 · {{r.waiting}} 项</summary><p>引擎已安排复查，重试间隔约 {{r.retry_delay}} 秒。</p><ul><li v-for="entry in r.wait_samples">{{entry[0]}} · {{entry[1]}}</li></ul><small v-if="r.waiting>10">显示前 10 项</small></details><details v-if="r.skipped" class="skip-details"><summary>上次完成扫描跳过 {{r.skipped}} 项</summary><ul v-if="r.skip_counts"><li v-for="(count,reason) in r.skip_counts">{{reason}} · {{count}} 项</li></ul><small v-else>下次扫描后可查看原因。</small></details><p v-if="r.error" class="error">{{r.error}}</p></div><div class="right"><span class="light-state" :class="{off:!r.active,warn:!!r.error}"><i></i>{{rstate(r)}}</span><small class="queue-state" v-if="r.progress||r.queued_source">{{r.progress || r.queued_source}}</small><div class="actions"><button class="textbtn" @click="policyDialog(r)">监听采集策略</button><button class="textbtn" @click="waitingDialog(r)">等待队列</button><button class="textbtn" @click="scanJournal(r)">扫描运行记录</button><button class="textbtn" @click="showRuleHistory(r)">规则沿革</button><button class="textbtn" @click="treeFor(r)">子目录</button><button class="textbtn" @click="rootFiles(r)">查看文件</button><button class="textbtn" @click="openPath({root_id:r.id})">查目录路径沿革</button><button class="textbtn" @click="searchRootText(r)">检索目录正文</button><button class="textbtn" @click="rootEvents(r)">变更记录</button><button class="textbtn" :disabled="!r.active||!!r.progress||!!r.queued_source" @click="scanRoots(r)">{{demo?'模拟扫描':'扫描此目录'}}</button><button v-if="!demo" class="textbtn" @click="rootDialog(r)">配置</button><button v-if="!demo" class="textbtn" @click="actRoot(r,r.active?'暂停':'继续')">{{r.active?'暂停':'继续'}}</button><button v-if="!demo" class="textbtn danger" @click="actRoot(r,'移除')">移除</button></div></div></section><div v-if="s.roots.length&&!visibleRoots.length" class="card empty"><b>没有匹配的监控目录</b><button class="textbtn" @click="clearRootFilter">显示全部目录</button></div></template>
<template v-if="['文件管理','变更记录','审计中心'].includes(page)"><section class="card listcard"><div v-if="f.prefix" class="tag blue">目录范围：{{f.prefix}}</div><div class="filters"><label class="search-input"><ico n="search"></ico><input aria-label="搜索记录" v-model="f.q" :placeholder="page==='审计中心'?'搜索操作名称或内容':page==='变更记录'?'搜索文件名、现路径或原路径':'搜索现名、旧名或相对路径'" @input="searchLater"></label><template v-if="page!=='审计中心'"><select aria-label="监控目录" v-model="f.root" @change="queryFirst"><option value="">全部目录</option><option v-for="r in s.roots" :value="r.id">{{base(r.path)}}</option></select><input v-model="f.ext" class="extbox" aria-label="扩展名" placeholder="xlsx, pdf" @input="searchLater"></template><select v-if="page==='文件管理'" aria-label="文件范围" v-model="f.scope" @change="queryFirst"><option v-for="entry in fileScopes" :value="entry[0]">{{entry[1]}}</option></select><template v-if="page==='变更记录'"><select v-model="f.kind" @change="queryFirst"><option value="">全部变化</option><option v-for="k in kinds">{{k}}</option></select></template><template v-if="page==='审计中心'"><select aria-label="管理操作" v-model="f.action" @change="queryFirst"><option value="">全部操作</option><option v-for="action in list.actions" :value="action">{{action}}</option></select></template><button class="textbtn" v-if="Object.values(f).some(Boolean)" @click="clearFilter">重置</button></div><details class="advanced"><summary>更多筛选与排序</summary><div class="filter-grid">
<label>排序<select v-model="f.sort" @change="queryFirst"><option value="">最近优先</option><option value="oldest">最早优先</option><template v-if="page==='文件管理'"><option value="size">大小降序</option><option value="versions">版本最多</option><option value="name">路径升序</option></template></select></label>
<template v-if="page!=='审计中心'"><label>解析状态<select v-model="f.status" @change="queryFirst"><option value="">全部状态</option><option v-for="v in parseStates">{{v}}</option></select></label><label>SHA-256 前缀<input v-model="f.sha" maxlength="64" @input="searchLater" placeholder="例如 43af"></label></template>
<template v-if="page==='文件管理'"><label><input type="checkbox" v-model="f.starred" @change="queryFirst">仅关注文件</label><label>最小字节数<input v-model="f.min_bytes" type="number" min="0" @input="searchLater"></label><label>最大字节数<input v-model="f.max_bytes" type="number" min="0" @input="searchLater"></label><label><input type="checkbox" v-model="f.multiple" @change="queryFirst">仅多版本文件</label></template>
<template v-if="page==='变更记录'"><button class="btn" @click="privateDialog">管理已移出记录</button><label>事件编号<input type="number" min="1" v-model="f.event_id" @input="searchLater"></label><label>公开更正说明<input v-model="f.caption" @input="searchLater"></label><label><input type="checkbox" v-model="f.amended" @change="queryFirst">仅已处置</label><label>记录来源<select v-model="f.source" @change="queryFirst"><option value="">全部来源</option><option v-for="v in list.sources">{{v}}</option></select></label><label><input type="checkbox" v-model="f.with_diff" @change="queryFirst">仅有内容差异</label></template></div></details>
<div class="range-tools" v-if="['文件管理','变更记录','审计中心'].includes(page)"><label class="date-field">从 <input aria-label="开始日期" type="date" v-model="f.start" :max="f.end||undefined" @change="queryFirst"></label><label class="date-field">至 <input aria-label="结束日期" type="date" v-model="f.end" :min="f.start||undefined" @change="queryFirst"></label><template v-if="page==='变更记录'"><button class="range-preset" @click="recentDays(1)">今天</button><button class="range-preset" @click="recentDays(7)">近七天</button><label class="activity-toggle"><input type="checkbox" v-model="f.activity" @change="queryFirst">隐藏初始建档</label></template></div>
<p class="error" v-if="rangeError" role="alert">{{rangeError}}</p><div class="scroll"><table v-if="page==='文件管理'"><thead><tr><th>文件名称</th><th>所属目录</th><th>大小</th><th>最近版本</th><th>最近变化</th><th></th></tr></thead><tbody><tr v-for="x in list.items"><td><div class="filecell"><span class="file-icon" :class="tone(x.ext)"><ico :n="fileIcon(x.ext)"></ico></span><div class="file-summary"><strong>{{base(x.rel)}}</strong><small v-if="x.matched_path">原路径：{{x.matched_path}}</small><span class="tag" :class="stateTone(x.file_state)">{{x.file_state}}</span></div></div></td><td class="file-folder">{{parent(x.root,x.rel)}}</td><td>{{bytes(x.size)}}</td><td>V{{x.version}}</td><td>{{fmt(x.updated)}}</td><td><button class="textbtn" :aria-pressed="!!x.starred" @click="toggleStar(x)">{{x.starred?'取消关注':'关注'}}</button><button class="textbtn" @click="selectFile(x)">历史版本</button><button v-if="native&&x.live&&!x.root_removed" class="textbtn" @click="perform('open_dir',{id:x.id})">打开位置</button></td></tr></tbody></table>
<table v-if="page==='变更记录'"><thead><tr><th>文件与位置</th><th>变更类型</th><th>版本</th><th>记录时间</th><th>解析状态</th><th></th></tr></thead><tbody><tr v-for="x in list.items"><td><strong>{{base(x.rel)}}</strong><small>{{parent(x.root,x.rel)}}</small><small v-if="x.old_rel">原路径：{{x.old_rel}}</small></td><td><span class="tag" :class="kindTone(x.kind)">{{x.kind}}</span><small v-if="x.caption">更正：{{x.caption}}</small></td><td>{{x.prior?'V'+x.prior:'—'}} → {{x.version?'V'+x.version:'—'}}</td><td>{{fmt(x.stamp)}}</td><td>{{x.status||'已记录'}}</td><td><button class="textbtn" :disabled="listLoading||x.kind==='已撤回'" @click="fromEvent(x)">查看详情</button><button v-if="x.file_id" class="textbtn" @click="openPath(x)">追溯此路径</button><button class="textbtn" @click="recordDialog(x)">管理记录</button></td></tr></tbody></table>
<table v-if="page==='审计中心'"><thead><tr><th>时间</th><th>管理操作</th><th>操作内容</th></tr></thead><tbody><tr v-for="x in list.items"><td>{{fmt(x.stamp)}}</td><td>{{x.action}}</td><td class="wrap">{{x.note}}</td></tr></tbody></table></div>
<div class="empty" v-if="!list.items.length&&!listLoading&&!rangeError"><ico n="search"></ico><b>没有符合条件的记录</b></div><div class="pager"><span>共 {{num(list.total)}} 条　<select v-model.number="listSize" aria-label="记录每页条数" @change="queryFirst"><option v-for="v in [10,25,50,100]" :value="v">每页 {{v}} 条</option></select></span><div><button class="btn" :disabled="p<=1" @click="p--;loadList()">上一页</button> {{p}} / {{Math.max(1,Math.ceil(list.total/list.size))}} <button class="btn" :disabled="p*list.size>=list.total" @click="p++;loadList()">下一页</button></div></div></section></template>
<template v-if="['历史版本','版本对比'].includes(page)"><div class="card picker"><div class="folder-icon"><ico n="files"></ico></div><div class="grow"><b>{{file?base(file.rel):'选择需要追溯的文件'}}</b><small>{{file?parent(file.root,file.rel):'可以查找已删除文件的历史记录'}}</small><span v-if="file&&file.file_state" class="tag" :class="stateTone(file.file_state)">{{file.file_state}}</span></div><button class="btn" @click="fileDialog">选择文件</button></div>
<template v-if="file&&versions.length"><div class="split-head"><h2>{{page==='历史版本'?'版本时间线':'版本选择'}}</h2><button class="textbtn" @click="navVersion(page==='历史版本'?'版本对比':'历史版本')">{{page==='历史版本'?'比较版本':'查看时间线'}} <ico n="arrow-right"></ico></button></div>
<section v-if="page==='历史版本'" class="card timeline"><div class="timeline-filters"><label>复核结论<select v-model="historyReview" @change="versionPage=1"><option value="">全部结论</option><option v-for="v in reviewStates">{{v}}</option></select></label><label>版本号或摘要<input v-model="versionQuery" @input="versionPage=1" placeholder="V2 或至少 6 位摘要" aria-label="查找版本号"></label><label>保存日期<input type="date" v-model="versionDay" @change="versionPage=1" aria-label="版本保存日期"></label><label>解析状态<select v-model="versionStatus" @change="versionPage=1"><option value="">全部状态</option><option v-for="v in parseStates">{{v}}</option></select></label><button class="textbtn" v-if="versionQuery||versionDay||versionStatus||historyReview" @click="resetVersions">清除条件</button><small>共 {{matchedVersions.length}} 个版本</small></div><div v-if="!visibleVersions.length" class="empty"><b>没有符合条件的版本</b><small>可清除条件查看完整时间线。</small></div><div class="version" v-for="v in visibleVersions" :key="v.id"><span class="node"></span><div class="grow"><h3>V{{v.num}} <span class="tag neutral">{{v.status}}</span></h3><p>{{fmt(v.stamp)}}　·　{{bytes(v.size)}}<template v-if="v.delta!=null">　·　{{v.delta>=0?'+':'−'}}{{bytes(Math.abs(v.delta))}}</template><template v-if="v.status==='已解析'">　·　{{v.changes}} 项差异</template></p><small v-if="v.note" class="review-note">{{v.note}}</small><small class="hash">SHA-256　{{v.sha}}</small><small class="error" v-if="v.error">{{v.error}}</small></div><div class="actions"><button class="textbtn" v-if="canTraceLines(v)" @click="openLineage(v)">逐行来源</button><button class="textbtn" @click="openSnapshot(v)">预览原件</button><button class="textbtn" :disabled="hasBundleVersion(v.id)" @click="addBundleVersion(v)">{{hasBundleVersion(v.id)?'已在交付篮':'加入交付篮'}}</button><button class="textbtn" @click="go('相同内容追溯',{sha:v.sha})">追溯相同内容</button><button class="textbtn" @click="editReview(v)">{{v.review||'待复核'}} · 登记</button><button v-if="v.num>2" class="textbtn" @click="pair(versions[versions.length-1].id,v.id)">与首版比较</button><button v-if="v.id!==versions[0].id" class="textbtn" @click="pair(v.id,versions[0].id)">与最新版比较</button><button v-if="v.parent_id" class="textbtn" @click="pair(v.parent_id,v.id)">比较</button><button v-if="!demo" class="textbtn" @click="saveFile('copy',base(file.rel),v.id)">另存</button><button class="textbtn" @click="restoreDialog(v)">{{demo?'恢复预览':'恢复'}}</button></div></div><div class="pager" v-if="versionPages>1"><span>第 {{versionPage}} / {{versionPages}} 页</span><div><button class="btn" :disabled="versionPage<=1" @click="versionPage--">上一页</button> <button class="btn" :disabled="versionPage>=versionPages" @click="versionPage++">下一页</button></div></div></section>
<section v-else class="card"><div class="pair"><label>旧版本<select v-model.number="left" @change="changePair"><option v-for="v in versions" :value="v.id">V{{v.num}}　{{fmt(v.stamp)}}</option></select></label><button class="btn swap-pair" :disabled="left===right||diffLoading" @click="swapPair">交换版本</button><label>新版本<select v-model.number="right" @change="changePair"><option v-for="v in versions" :value="v.id">V{{v.num}}　{{fmt(v.stamp)}}</option></select></label></div><template v-if="left!==right&&diff"><div v-if="diff.is_source" class="diff-options"><div class="mode-switch" aria-label="源文件比较方式"><button :aria-pressed="diffMode==='aligned'" @click="setDiffMode('aligned')">按结构比较</button><button :aria-pressed="diffMode==='coordinate'" @click="setDiffMode('coordinate')">按原文逐行比较</button></div></div><div v-if="diff.is_excel||diff.is_word||diff.is_tabular" class="diff-options"><div class="mode-switch" aria-label="比较方式"><button v-for="m in [['aligned',diff.is_word?'按段落内容对齐':'按编号对齐'],['coordinate',diff.is_word?'按原始位置':'按原始坐标']]" :aria-pressed="diffMode===m[0]" @click="setDiffMode(m[0])">{{m[1]}}</button></div><small v-if="diff.is_word">{{diffMode==='aligned'?'按文档区域核对段落，突出显示修改文字':'逐个段号和表格位置核对'}}</small><small v-else-if="diffMode==='aligned' && Object.keys(diff.aligned).length">按 {{Object.entries(diff.aligned).filter(([name])=>!sheet || sheet===name).map(([name,key])=>name+' · '+key).join('、') || '单元格坐标'}} 核对</small><small v-else>按单元格坐标核对</small></div>
<button v-if="diff.is_excel||diff.is_tabular" class="btn" @click="varianceDialog">数值差异核对</button><div class="view-tabs" v-if="formatView[0]!=='detail'">
<button :aria-pressed="displayMode==='auto'" @click="displayMode='auto';changePair()">{{formatView[1]}}</button>
<button :aria-pressed="displayMode==='detail'" @click="displayMode='detail'">{{diff.is_excel?'单元格与属性明细':'明细表'}} · {{diff.is_excel?'筛选与导出':'并排查看'}}</button></div>
<section v-if="presentation==='grid'" class="sheet-review">
<div v-if="grid" class="grid-toolbar"><label>工作表 <select v-model="gridSheet" @change="gridPage=1;gridCol=1;loadGrid()"><option v-for="g in grid.sheets">{{g}}</option></select></label>
<span>{{grid.key?'按「'+grid.key+'」配对':'按原始行号配对'}}</span><label>整行筛选<select v-model="gridFilter" @change="gridPage=1;loadGrid()"><option value="">全部行</option><option v-for="v in ['新增行','删除行','修改行','调序行','内容','批注','格式','超链接']">{{v}}</option></select></label><span v-if="grid.row_filter">匹配 {{grid.matches}} 行</span><label><input type="checkbox" :disabled="!!gridFilter" v-model="expandRows" @change="gridPage=1;loadGrid()">显示未变行</label></div>
<details v-if="grid" class="cell-search111"><summary>从整张工作表查找单元格</summary><div class="filters"><label>单元格内容<input v-model="cellSearch.q" maxlength="512" @keyup.enter="searchCells()"></label><label>工作表一侧<select v-model="cellSearch.side"><option value="">两侧</option><option value="old">旧表</option><option value="new">新表</option></select></label><label>字段名<input v-model="cellSearch.field"></label><label>数据类型<select v-model="cellSearch.type"><option value="">全部</option><option v-for="t in ['文本','数字','公式','日期时间','布尔值','错误值']">{{t}}</option></select></label><label><input type="checkbox" v-model="cellSearch.changed">仅发生变化的单元格</label><label><input type="checkbox" v-model="cellSearch.exact">整格匹配</label><label><input type="checkbox" v-model="cellSearch.sensitive">区分大小写</label><button class="btn" :disabled="!cellSearch.q.trim()||cellBusy" @click="searchCells()">查找单元格</button></div>
<template v-if="cellHits&&cellSig===JSON.stringify(cellOptions())"><p v-if="!cellHits.items.length">没有匹配的单元格。</p><ul><li v-for="h in cellHits.items"><button class="textbtn" @click="jumpCell(h)">{{h.side==='old'?'旧表':'新表'}} {{h.address}}</button> · {{h.field}} · {{h.value}}</li></ul><button class="btn" :disabled="!cellHits.offset" @click="searchCells(cellHits.offset-20)">上一批</button><button class="btn" :disabled="!cellHits.more" @click="searchCells(cellHits.offset+20)">下一批</button></template></details>
<div class="grid-tools19" v-if="grid"><div><span v-for="(n,label) in grid.summary">{{label}} <b>{{n}}</b></span></div><div><select v-model="gridLocate" aria-label="整行定位方式"><option value="new">新表地址</option><option value="old">旧表地址</option><option v-if="grid.key" value="key">业务编号</option></select><input v-model="gridTarget" :placeholder="gridLocate==='key'?'输入完整编号':'例如 C24 或 24'" @keyup.enter="loadGrid(true)"><button class="btn" :disabled="!gridTarget.trim()" @click="loadGrid(true)">定位</button></div></div><p role="alert" class="error" v-if="grid&&gridError">{{gridError}}</p><div class="empty" v-if="!grid">{{gridError||diff.error||'正在读取工作表…'}}</div>
<template v-else><div class="scroll sheet-scroll"><table class="sheet-table"><thead><tr><th>旧行</th><th>新行</th><th>修订</th><th v-for="c in grid.columns">{{c.title}}<small>{{c.old||'—'}} → {{c.new||'—'}}</small></th></tr></thead><tbody>
<tr v-for="line in grid.rows" :class="{'row-add':line.kind==='新增','row-del':line.kind==='删除','row-gap':line.kind==='gap','row-target':line.target}">
<template v-if="line.kind==='gap'"><td>{{line.old}}</td><td>{{line.new}}</td><td :colspan="1+grid.columns.length"><button @click="expandRows=true;gridPage=line.expand_page;loadGrid()">展开 {{line.count}} 个未变行</button></td></template>
<template v-else><td>{{line.old||''}}</td><td>{{line.new||''}}</td><td>{{line.kind==='新增'?'＋':line.kind==='删除'?'−':'·'}}<small v-if="line.moved">调序</small></td><td v-for="cell in line.cells" :class="{'cell-changed':!!cell.note}"><span>{{cell.value??'—'}}</span><small v-if="cell.note">{{cell.address}} · {{cell.note}}<template v-if="cell.type"> · {{cell.type}}</template></small><details v-if="cell.detail"><summary>具体变化</summary><small>{{cell.detail}}</small></details></td></template></tr></tbody></table></div>
<div class="pager"><span>整行视图 · {{grid.page}} / {{grid.pages}} 页 · 列组 {{grid.col_page}} / {{grid.col_pages}}</span><div><button class="btn" v-if="grid.col_pages>1" :disabled="gridCol===1" @click="gridCol--;loadGrid()">上一组列</button> <button class="btn" v-if="grid.col_pages>1" :disabled="gridCol===grid.col_pages" @click="gridCol++;loadGrid()">下一组列</button> <button class="btn" :disabled="gridPage===1" @click="gridPage--;loadGrid()">上一页</button> <button class="btn" :disabled="gridPage===grid.pages" @click="gridPage++;loadGrid()">下一页</button></div></div></template>
<button class="textbtn" @click="displayMode='detail'">查看单元格、打印设置及其他属性差异（{{diff.total}} 项）</button></section>
<template v-else><div class="diff-meta"><button v-for="k in ['新增','修改','删除']" class="kind-chip" :class="kindTone(k)" :aria-pressed="diffKind===k" @click="filterDiff(k)">{{k}} <b>{{diff.counts[k]}}</b></button><button class="textbtn" v-if="diffKind" @click="filterDiff(diffKind)">显示全部</button><span class="quiet">{{diff.status}}</span></div><div class="filters"><select v-model="sheet" @change="dp=1;loadDiff()"><option value="">全部位置分组</option><option v-for="g in diff.sheets">{{g}}</option></select><select v-if="diff.is_excel||diff.is_tabular" aria-label="差异类别" v-model="diffCategory" @change="dp=1;loadDiff()"><option value="">全部差异类别</option><option v-for="c in diff.categories">{{c}}</option></select><label class="search-input"><ico n="search"></ico><input v-model="loc" :placeholder="diff.is_excel?'搜索字段、位置、编号或值':'搜索位置、旧值或新值'" @input="dp=1;loadDiff()"></label><button class="textbtn" v-if="diffFiltered" @click="changePair">清除筛选</button><button class="btn export-diff" :disabled="diffLoading||!diff.total" @click="exportDifference"><ico n="download"></ico>导出筛选结果（{{diff.total}} 项）</button></div><details class="advanced"><summary>精确查找与匹配范围</summary><div class="filter-grid"><label>搜索范围<select v-model="searchIn" @change="dp=1;loadDiff()"><option value="">全部内容</option><option value="old">仅旧值</option><option value="new">仅新值</option><option value="location">仅位置</option></select></label><label><input type="checkbox" v-model="caseSensitive" @change="dp=1;loadDiff()">区分大小写</label><label><input type="checkbox" v-model="exact" @change="dp=1;loadDiff()">完全匹配</label><template v-if="diff.is_excel||diff.is_tabular"><label>业务字段<select v-model="diffField" @change="dp=1;loadDiff()"><option value="">全部字段</option><option v-for="v in diff.fields">{{v}}</option></select></label><label>完整记录编号<input v-model="recordId" @input="dp=1;loadDiff()"></label></template></div></details>
<div class="revision-groups" v-if="['records','paths','assets'].includes(presentation)"><section v-for="[group,items] in groupedChanges" class="revision-group"><h3>{{group}}</h3><div class="scroll"><table class="compare"><thead><tr><th>{{presentation==='records'?'列':presentation==='paths'?'字段路径':'条目'}}</th><th>旧版本</th><th>新版本</th><th>变化</th></tr></thead><tbody><tr v-for="d in items"><td>{{presentation==='records'?d.location.split(' · ').pop():d.location}}</td><td class="oldval">{{d.old??'—'}}</td><td class="newval">{{d.new??'—'}}</td><td>{{d.kind}}</td></tr></tbody></table></div></section></div>
<div class="revision-groups" v-else-if="presentation!=='detail'"><section v-for="[group,items] in groupedChanges" class="revision-group"><h3>{{group}}</h3><article v-for="d in items"><h4>{{d.location}} · {{d.kind}}</h4><div v-for="side in ['old','new'].filter(k=>d[k]!=null)" :class="side==='old'?'row-del':'row-add'" class="revision-line"><b>{{side==='old'?'−':'＋'}}</b><span><template v-if="d[side+'_parts']"><span v-for="part in d[side+'_parts']" :class="{'fragment-change':part[1]}">{{part[0]}}</span></template><template v-else>{{d[side]}}</template></span></div></article></section></div>
<div class="scroll" v-else><table class="compare"><thead><tr><th>位置</th><th>旧值 · V{{diff.old_number}}</th><th>新值 · V{{diff.new_number}}</th><th>变化</th></tr></thead><tbody><tr v-for="d in diff.items"><td><small>{{d.sheet}}</small><b>{{d.location}}</b><small v-if="d.category">{{d.category}}<template v-if="d.field"> · {{d.field}}</template></small><small v-if="d.record_key" class="record-key">{{d.record_key}}</small></td><td class="oldval"><small class="value-type" v-if="d.old_type&&d.new_type&&d.old_type!==d.new_type">{{d.old_type}}</small><template v-if="d.old_parts"><span v-for="(part,index) in d.old_parts" :key="index" :class="{'text-change':part[1]}">{{part[0]}}</span></template><template v-else>{{d.old===null?'—':d.old}}</template></td><td class="newval"><small class="value-type" v-if="d.old_type&&d.new_type&&d.old_type!==d.new_type">{{d.new_type}}</small><template v-if="d.new_parts"><span v-for="(part,index) in d.new_parts" :key="index" :class="{'text-change':part[1]}">{{part[0]}}</span></template><template v-else>{{d.new===null?'—':d.new}}</template></td><td><span class="tag" :class="kindTone(d.kind)">{{d.kind}}</span></td></tr></tbody></table></div><div class="empty" v-if="!diff.items.length"><b>{{diff.error||(diffFiltered?'当前筛选没有匹配项':'两个版本没有可列出的结构化差异')}}</b><small>可在下方核对版本属性。</small></div><div class="pager"><span>共 {{diff.total}} 项　<select aria-label="差异每页条数" v-model.number="diffSize" @change="dp=1;loadDiff()"><option v-for="n in [20,40,80,100]" :value="n">每页 {{n}} 项</option></select></span><div><button class="btn" :disabled="dp===1" @click="dp--;loadDiff()">上一页</button> {{dp}} <button class="btn" :disabled="dp*diff.size>=diff.total" @click="dp++;loadDiff()">下一页</button></div></div></template><button class="textbtn" @click="editReview(versions.find(v=>v.id===right))">登记新侧版本 V{{diff.new_number}} 的复核结论</button><details><summary>文件大小与 SHA-256</summary><p class="hash" v-for="v in versions.filter(v=>v.id===left||v.id===right)">V{{v.num}} · {{bytes(v.size)}} · {{v.sha}}</p></details></template><p class="empty" v-else>{{diffLoading?'正在比较版本…':left===right?'请选择两个不同的历史版本进行对比。':'暂时无法显示对比结果。'}}</p></section></template></template>
<template v-if="page==='复核工作台'"><section class="card review-board">
<div class="review-statebar"><button v-for="state in ['',...reviewStates]" :aria-pressed="reviewFilter.state===state" @click="reviewFilter.state=state;loadReview(true)">{{state||'全部'}} <b>{{state?reviews.counts[state]||0:Object.values(reviews.counts).reduce((a,b)=>a+b,0)}}</b></button></div>
<div class="filters"><input v-model="reviewFilter.q" aria-label="搜索复核记录" @input="scheduleReview" @keyup.enter="loadReview(true)" placeholder="文件名、复核备注或失败原因"><button class="btn" @click="loadReview(true)">查询</button><button class="btn" @click="reviewFilter=freshReviewForm();loadReview(true)">清除条件</button><button class="btn" :disabled="reviewBusy||!reviews.total" @click="exportReviews">导出复核清单</button></div>
<details class="advanced"><summary>复核范围与排序</summary><div class="filter-grid">
<label>目录<select v-model="reviewFilter.root" @change="loadReview(true)"><option value="">全部目录</option><option v-for="r in s.roots" :value="r.id">{{base(r.path)}}</option></select></label>
<label>文件类型<input v-model="reviewFilter.ext" @change="loadReview(true)" placeholder="例如 xlsx"></label>
<label>解析状态<select v-model="reviewFilter.status" @change="loadReview(true)"><option value="">全部</option><option v-for="n in parseStates">{{n}}</option></select></label>
<label>起始日<input type="date" v-model="reviewFilter.start" @change="loadReview(true)"></label><label>结束日<input type="date" v-model="reviewFilter.end" @change="loadReview(true)"></label>
<label><input type="checkbox" v-model="reviewFilter.baseline" @change="loadReview(true)">包含初始快照</label><label><input type="checkbox" v-model="reviewFilter.latest" @change="loadReview(true)">仅文件最新版</label><label><input type="checkbox" v-model="reviewFilter.starred" @change="loadReview(true)">仅关注文件</label>
<label>排序<select v-model="reviewFilter.sort" @change="loadReview(true)"><option value="">最近保存</option><option value="oldest">最早保存</option><option value="changes">差异最多</option><option value="reviewed">最近复核</option></select></label></div></details>
<div class="filters batch-toolbar"><span role="status">已选 {{reviewSelected.length}} / 100</span>
<button class="btn" :disabled="reviewBusy||!reviews.items.some(v=>!reviewIsSelected(v.id))" @click="selectReviewRows">选择本页</button>
<button class="btn" :disabled="reviewBusy||!reviews.items.some(v=>reviewIsSelected(v.id))" @click="clearReviewPage">取消本页</button>
<button class="textbtn" :disabled="!reviewSelected.length" @click="reviewSelected=[]">清空选择</button>
<button class="primary" :disabled="!reviewSelected.length" @click="openReviewBatch">批量复核</button></div>
<div class="scroll"><table><thead><tr><th>选择</th><th>文件与版本</th><th>保存时间</th><th>解析结果</th><th>复核结论</th><th>操作</th></tr></thead><tbody><tr v-for="v in reviews.items" :key="v.id"><td><input type="checkbox" :aria-label="'选择 '+v.rel+' V'+v.num" :checked="reviewIsSelected(v.id)" :disabled="reviewBusy||(!reviewIsSelected(v.id)&&reviewSelected.length===100)" @change="toggleReviewSelection(v)"></td><td><b>{{base(v.rel)}} · V{{v.num}}</b><small>{{parent(v.root,v.rel)}}</small></td><td>{{fmt(v.stamp)}}</td><td>{{v.status}}<small v-if="v.status==='已解析'">{{v.changes}} 项差异</small><small v-if="v.error" class="error">{{v.error}}</small></td><td><span class="tag" :class="v.review==='已复核'?'green':v.review==='需跟进'?'amber':'neutral'">{{v.review}}</span><small class="review-note">{{v.note}}</small><small v-if="v.reviewed_at">{{fmt(v.reviewed_at)}}</small></td><td><button class="textbtn" @click="openReviewVersion(v)">{{v.parent_id?'查看差异':'查看初版'}}</button><button class="textbtn" @click="editReview(v)">登记复核</button><button class="textbtn" :disabled="hasBundleVersion(v.id)" @click="addBundleVersion(v)">加入交付篮</button><button class="textbtn" v-if="!demo&&v.status==='解析失败'" @click="perform('retry',{id:v.id}).then(()=>loadReview())">重试此版本</button></td></tr></tbody></table></div>
<div class="empty" v-if="!reviews.items.length">{{reviewBusy?'正在读取…':'当前范围没有复核记录'}}</div><div class="pager"><span>共 {{reviews.total}} 个版本 · <select aria-label="每页复核版本" v-model.number="reviewFilter.size" @change="loadReview(true)"><option v-for="n in [10,25,50,100]" :value="n" :key="n">每页 {{n}} 项</option></select></span><div><button class="btn" :disabled="reviewBusy||reviews.page<=1" @click="reviewFilter.page--;loadReview()">上一页</button> {{reviews.page}} / {{reviews.pages}} <button class="btn" :disabled="reviewBusy||reviews.page>=reviews.pages" @click="reviewFilter.page++;loadReview()">下一页</button></div></div>
</section></template>
<template v-if="page==='差异检索'"><section class="card listcard">
<form @submit.prevent="findChanges()"><div class="filters"><label>检索内容<input v-model="findForm.q" maxlength="512" placeholder="例如物料编号、库存或旧值"></label>
<label>查找范围<select v-model="findForm.side"><option value="">全部位置与值</option><option value="old_value">仅旧值</option><option value="new_value">仅新值</option><option value="location">仅位置</option></select></label>
<label>监控目录<select v-model="findForm.root"><option value="">所有目录</option><option v-for="r in s.roots" :value="r.id">{{r.path}}</option></select></label>
<label>事件路径<input v-model="findForm.filename" placeholder="文件名或路径片段"></label><label>扩展名<input v-model="findForm.ext" placeholder="xlsx, csv"></label>
<label>变化类型<select v-model="findForm.kind"><option value="">全部类型</option><option v-for="k in ['新增','修改','删除']">{{k}}</option></select></label>
<label>数值方向<select v-model="findForm.direction"><option value="">全部</option><option value="up">数值上升</option><option value="down">数值下降</option><option value="same">数值等值</option></select></label></div>
<details><summary>更多查询条件</summary><div class="filters"><label>工作表或分组<input v-model="findForm.sheet"></label><label>字段名<input v-model="findForm.field"></label><label>业务编号<input v-model="findForm.record"></label>
<label>开始日期<input type="date" v-model="findForm.start"></label><label>结束日期<input type="date" v-model="findForm.end"></label>
<label><input type="checkbox" v-model="findForm.exact">整项匹配</label><label><input type="checkbox" v-model="findForm.sensitive">区分大小写</label><label><input type="checkbox" v-model="findForm.starred">仅关注文件</label></div></details>
<div class="filters"><label>结果排序<select v-model="findForm.sort"><option value="">最近优先</option><option value="oldest">最早优先</option><option value="path">事件路径</option></select></label>
<button class="primary" :disabled="finderBusy">查询差异</button><button type="button" class="btn" @click="findForm=freshFind();presetId=0;findChanges()">清空条件</button></div></form>
<details><summary>保存或使用查询条件</summary><div class="filters"><label>组合名称<input v-model="presetName" maxlength="60"></label><button class="btn" :disabled="!presetName.trim()" @click="savePreset">保存条件</button>
<label>已保存组合<select v-model.number="presetId" @change="applyPreset"><option :value="0">自定义</option><option v-for="p in presets" :value="p.id">{{p.name}}</option></select></label><button class="textbtn" :disabled="!presetId" @click="forgetPreset">移除组合</button></div></details></section>
<section class="card listcard" aria-live="polite"><p v-if="finderBusy">正在查询已解析差异…</p><template v-if="found"><div class="card-head"><h2>{{found.total}} 项差异</h2><button class="btn" :disabled="!found.total" @click="exportFinder">导出查询结果</button></div><p>{{found.files}} 个文件 · {{found.events}} 条变更事件</p>
<div class="scroll"><table><thead><tr><th>文件与版本</th><th>位置</th><th>变化</th><th>旧值</th><th>新值</th><th></th></tr></thead><tbody><tr v-for="r in found.items" :key="r.eid+'-'+r.ordinal"><td>{{r.rel}}<small>V{{r.prior}} → V{{r.version}} · {{fmt(r.stamp)}}</small></td><td>{{r.sheet}} · {{r.location}}<small>{{r.field}}　{{r.record_key}}</small></td><td>{{r.kind}}</td><td class="snippet111">{{r.old_value??'—'}}{{r.old_value_truncated?'…':''}}</td><td class="snippet111">{{r.new_value??'—'}}{{r.new_value_truncated?'…':''}}</td><td><button class="textbtn" @click="openFound(r)">核对原差异</button></td></tr></tbody></table></div><p v-if="!found.total">没有匹配的可见差异。</p>
<div class="pager"><button class="btn" :disabled="found.page===1" @click="findChanges(found.page-1,findApplied)">上一页</button><span>{{found.page}} / {{found.pages}}</span><button class="btn" :disabled="found.page===found.pages" @click="findChanges(found.page+1,findApplied)">下一页</button></div></template></section></template>
<template v-if="page==='历史正文检索'">
<section class="card listcard">
<form @submit.prevent="searchText()">
<div class="filters">
<label>正文关键词<input v-model="textForm.q" required maxlength="160" placeholder="例如 RK-001"></label>
<label>监控目录<select v-model="textForm.root"><option :value="0">全部目录</option><option v-for="r in s.roots" :key="r.id" :value="r.id">{{r.path}}</option></select></label>
<label>最近登记路径<input v-model="textForm.filename" maxlength="512" placeholder="文件名或相对路径片段"></label>
<label>历史后缀<input v-model="textForm.ext" maxlength="512" placeholder="txt, md, csv"></label>
<label>版本范围<select v-model="textForm.latest"><option :value="true">每个文件最新保存</option><option :value="false">所有历史版本</option></select></label>
</div>
<details><summary>更多检索条件</summary><div class="filters">
<label>文件范围<select v-model="textForm.scope"><option value="">全部文件</option><option value="live">当前在册</option><option value="history">全部历史文件</option><option value="deleted">已删除</option><option value="excluded">规则已排除</option><option value="removed">目录已移除</option></select></label>
<label>保存日期从<input type="date" v-model="textForm.start" :max="textForm.end||undefined"></label>
<label>保存日期至<input type="date" v-model="textForm.end" :min="textForm.start||undefined"></label>
<label>上下文<select v-model="textForm.context"><option :value="0">只显示命中行</option><option :value="1">前后各 1 行</option><option :value="2">前后各 2 行</option></select></label>
<label><input type="checkbox" v-model="textForm.starred">仅关注文件</label>
<label><input type="checkbox" v-model="textForm.skip_initial">跳过首次建档</label>
<label><input type="checkbox" v-model="textForm.exact">整行匹配</label>
<label><input type="checkbox" v-model="textForm.sensitive">区分大小写</label>
</div></details>
<div class="filters">
<button class="primary" :disabled="textBusy||!textForm.q.trim()">检索正文</button>
<button type="button" class="btn" @click="resetTextSearch">清空条件</button>
<button type="button" v-if="demo" class="textbtn" :disabled="textBusy" @click="resetTextSearch();textForm.q='RK-001';textForm.filename='退货轨迹.csv';textForm.latest=false;searchText()">查找示例 RK-001</button>
<span v-if="textForm.file" class="tag blue">仅 {{textFileLabel}} <button type="button" class="textbtn" @click="textForm.file=0;textFileLabel=''">取消限定</button></span>
</div>
</form>
<details><summary>检索范围和限制</summary><p>查找仓库快照中的纯文本，包含已保存的早期版本。支持 TXT、Markdown、CSV、TSV、日志及常见源码和配置文件。CSV 按原文的物理行定位。每个快照最多 2 MiB。</p><p>结果显示文件最近登记的路径。若要查找某个日期范围内的旧保存，请选择「所有历史版本」。</p></details>
</section>
<section class="card listcard" :aria-busy="textBusy">
<p v-if="textBusy" role="status">正在读取历史正文…</p>
<p v-if="textError" class="error" role="alert">{{textError}}</p>
<template v-if="textResult">
<div class="card-head"><h2>第 {{textCursors.length}} 批 · {{textResult.items.length}} 个命中版本</h2><button class="btn" :disabled="textBusy||!textResult.items.length" @click="exportTextSearch">导出本批命中片段</button></div>
<p role="status">关键词「{{textApplied.q}}」 · 检查 {{textResult.checked}} 个快照 · 本批处理 {{textResult.scanned}} 个候选</p>
<p v-if="Object.keys(textResult.skipped).length" class="quiet">跳过 <span v-for="(count,reason) in textResult.skipped" :key="reason">{{reason}} {{count}} 项　</span></p>
<p v-if="!textResult.items.length">{{textResult.next?'本批没有命中，可继续检索较早的版本。':'本批没有命中的历史正文。'}}</p>
<article v-for="item in textResult.items" :key="item.id" class="text-hit">
<div class="card-head"><div><h3>{{item.rel}} · V{{item.num}}</h3><small>{{item.root}} · {{fmt(item.stamp)}} · {{item.ext}} · {{item.encoding}} · {{bytes(item.size)}} · {{item.state}}</small></div>
<div class="actions"><button class="textbtn" @click="openTextVersion(item)">打开命中版本</button><button class="textbtn" :disabled="hasBundleVersion(item.id)" @click="addBundleVersion(item)">加入交付篮</button><button v-if="item.parent_id" class="textbtn" @click="openTextVersion(item,true)">与上版比较</button></div></div>
<details open><summary>{{item.matches}} 个匹配行<span v-if="item.matches>item.previews.length"> · 显示前 {{item.previews.length}} 行</span></summary>
<div v-for="hit in item.previews" :key="hit.line" class="text-context">
<button class="textbtn" @click="openLineage(item,hit.line)">追溯第 {{hit.line}} 行来源</button><button class="textbtn" @click="openSnapshot(item,hit.line)">查看原件第 {{hit.line}} 行</button>
<div v-for="row in hit.rows" :key="row.line" :class="{'text-hit-line':row.column!==null}">
<span :title="row.column===null?'上下文':'首个匹配的起始列 '+row.column">{{row.line}}<template v-if="row.column!==null">:{{row.column}}</template></span>
<code>{{row.head?'…':''}}{{row.prefix}}<mark v-if="row.match">{{row.match}}</mark>{{row.suffix}}{{row.tail?'…':''}}</code>
</div>
</div></details>
</article>
<div class="pager"><button class="btn" :disabled="textBusy||textCursors.length<2" @click="searchText(-1)">上一批</button><span>{{textResult.next?'还有较早的候选版本':'已到本次检索范围末尾'}}</span><button class="btn" :disabled="textBusy||!textResult.next" @click="searchText(1)">继续检索</button></div>
</template>
</section>
</template>
<template v-if="page==='相同内容追溯'">
<section class="card listcard">
<form @submit.prevent="loadContentGroups()">
<div class="filters">
<label>分组方式<select v-model="contentForm.mode"><option value="cross">跨文件相同正文</option><option value="repeat">同文件多次引用</option><option value="shared">所有重复引用</option><option value="all">所有正文</option></select></label>
<label>SHA-256 或前缀<input v-model="contentForm.sha" maxlength="64" placeholder="至少 6 位十六进制字符" spellcheck="false"></label>
<label>最近登记路径<input v-model="contentForm.q" maxlength="512" placeholder="文件名或路径片段"></label>
<label>监控目录<select v-model="contentForm.root"><option :value="0">全部目录</option><option v-for="r in s.roots" :key="r.id" :value="r.id">{{r.path}}</option></select></label>
<label>历史后缀<input v-model="contentForm.ext" maxlength="512" placeholder="例如 pdf, xlsx"></label>
</div>
<details><summary>更多筛选条件</summary><div class="filters">
<label>文件当前状态<select v-model="contentForm.state"><option value="">全部状态</option><option v-for="state in ['当前在册','目录已暂停','规则已排除','目录已移除','已删除']" :key="state">{{state}}</option></select></label>
<label>保存日期从<input type="date" v-model="contentForm.start" :max="contentForm.end||undefined"></label>
<label>保存日期至<input type="date" v-model="contentForm.end" :min="contentForm.start||undefined"></label>
<label>最小字节数<input type="number" min="0" step="1" v-model.number="contentForm.minimum"></label>
<label>最大字节数<input type="number" min="0" step="1" v-model.number="contentForm.maximum"></label>
<label><input type="checkbox" v-model="contentForm.latest">仅每文件最新版</label>
<label><input type="checkbox" v-model="contentForm.starred">仅关注文件</label>
<label><input type="checkbox" v-model="contentForm.empty">包含空文件</label>
</div></details>
<div class="filters">
<label>分组排序<select v-model="contentForm.sort"><option value="saved">复用字节最多</option><option value="versions">版本引用最多</option><option value="files">文件身份最多</option><option value="bytes">单份正文最大</option><option value="recent">最近保存优先</option></select></label>
<label>每页<select v-model.number="contentForm.size"><option v-for="n in [10,25,50]" :key="n" :value="n">{{n}} 项</option></select></label>
<button class="primary" :disabled="contentBusy">查询相同正文</button>
<button type="button" class="btn" @click="resetContent();loadContentGroups()">重置并查询</button>
<button type="button" v-if="demoContentSha" class="textbtn" :disabled="contentBusy" @click="go('相同内容追溯',{sha:demoContentSha})">查看示例交接副本</button>
</div>
</form>
<details><summary>如何理解用量和文件身份</summary><p>按完整 SHA-256 分组。目录、路径、日期等条件先限定参与统计的版本。复用字节等于引用字节合计减去每组单份正文的大小，是当前范围内的去重用量，不能直接作为可释放的磁盘空间。同名文件在删除后重新建档可拥有独立身份。</p><p>原件校验只读取所选摘要的归档副本。需要回到正在编辑的文件确认时，可在历史版本使用「保存核对」。</p></details>
</section>
<section class="card listcard" :aria-busy="contentBusy">
<p role="status" v-if="contentBusy">正在汇总版本引用…</p>
<p class="error" role="alert" v-if="contentError">{{contentError}}</p>
<template v-if="contentGroups">
<div class="card-head"><h2>{{num(contentGroups.total)}} 组正文</h2><button class="btn" :disabled="contentBusy||!contentGroups.total" @click="exportContent()">导出分组 CSV</button></div>
<p>{{num(contentGroups.summary.versions)}} 次版本引用 · 引用字节 {{bytes(contentGroups.summary.logical)}} · 单份正文合计 {{bytes(contentGroups.summary.unique_bytes)}} · 复用 {{bytes(contentGroups.summary.saved)}}</p>
<p v-if="contentGroups.summary.conflicts" class="error">{{contentGroups.summary.conflicts}} 组长度冲突，已从字节汇总排除。</p>
<div v-if="contentGroups.items.length" class="scroll"><table class="catalog-table">
<thead><tr><th>SHA-256</th><th>单份正文</th><th>版本 / 最新</th><th>文件 / 目录 / 后缀</th><th>保存范围</th><th>复用字节</th><th>操作</th></tr></thead>
<tbody><tr v-for="group in contentGroups.items" :key="group.sha" :class="{'catalog-selected':contentSelected?.sha===group.sha}">
<td class="hash">{{group.sha}}</td><td>{{group.conflict?'长度冲突':bytes(group.size)}}<small v-if="!group.conflict">引用 {{bytes(group.logical)}}</small></td><td>{{num(group.versions)}} / {{num(group.latest)}}</td>
<td>{{num(group.files)}} / {{num(group.roots)}} / {{num(group.formats)}}</td>
<td>{{fmt(group.first_stamp)}}<small>至 {{fmt(group.last_stamp)}}</small></td><td>{{group.conflict?'—':bytes(group.saved)}}</td>
<td><button class="textbtn" :aria-pressed="contentSelected?.sha===group.sha" @click="selectContent(group)">版本引用</button></td>
</tr></tbody></table></div>
<p v-else>当前条件没有相同正文分组。</p>
<div class="pager" v-if="contentGroups.pages>1">
<button class="btn" :disabled="contentBusy||contentGroups.page<=1" @click="loadContentGroups(contentGroups.page-1,true)">上一页</button><span>{{contentGroups.page}} / {{contentGroups.pages}}</span>
<button class="btn" :disabled="contentBusy||contentGroups.page>=contentGroups.pages" @click="loadContentGroups(contentGroups.page+1,true)">下一页</button>
</div>
</template>
</section>
<section v-if="contentSelected" class="card listcard" :aria-busy="contentRefsBusy">
<div class="card-head"><h2>版本引用</h2><button class="textbtn" @click="clearContentSelection">收起明细</button></div>
<p class="hash">{{contentSelected.sha}}</p>
<div class="filters">
<label><input type="checkbox" v-model="contentScoped" @change="loadContentRefs()">仅显示符合分组筛选的引用</label>
<label>明细排序<select v-model="contentRefSort" @change="loadContentRefs()"><option value="recent">最近保存</option><option value="oldest">最早保存</option><option value="path">按文件路径</option></select></label>
<label>每页<select v-model.number="contentRefSize" @change="loadContentRefs()"><option v-for="n in [10,25,50]" :key="n" :value="n">{{n}} 项</option></select></label>
<button class="btn" :disabled="contentCheckBusy" @click="verifyContent">{{contentCheckBusy?'校验中…':'校验归档副本'}}</button>
<button class="btn" :disabled="contentRefsBusy||!contentRefs?.total" @click="exportContent(true)">导出引用 CSV</button>
</div>
<p role="status" v-if="contentCheck" :class="{error:contentCheck.status!=='通过'}"><strong>{{contentCheck.status==='通过'?'归档副本校验通过':contentCheck.status}}</strong> · 索引 {{contentCheck.expected==null?'—':bytes(contentCheck.expected)}} · 实际 {{contentCheck.actual==null?'—':bytes(contentCheck.actual)}} · {{fmt(contentCheck.checked)}}</p>
<p class="error" role="alert" v-if="contentCheckError">{{contentCheckError}}</p>
<p role="status" v-if="contentRefsBusy">正在读取版本引用…</p>
<p class="error" role="alert" v-if="contentRefsError">{{contentRefsError}}</p>
<template v-if="contentRefs">
<p>{{num(contentRefs.total)}} 条{{contentScoped?'筛选后':'全部'}}版本引用</p>
<div v-if="contentRefs.items.length" class="scroll"><table class="catalog-table">
<thead><tr><th>文件与目录</th><th>版本</th><th>保存时间</th><th>文件状态</th><th>版本大小及解析状态</th><th>操作</th></tr></thead>
<tbody><tr v-for="v in contentRefs.items" :key="v.id"><td>{{v.rel}}<small>{{v.root}}</small></td><td>V{{v.num}}<small>{{v.ext||'无后缀'}}<template v-if="v.latest"> · 最新保存</template></small></td>
<td>{{fmt(v.stamp)}}</td><td>{{v.state}}</td><td>{{bytes(v.size)}}<small>{{v.status}}</small></td>
<td><button class="textbtn" @click="openContentVersion(v)">打开版本</button><button class="textbtn" v-if="v.parent_id" @click="openContentVersion(v,true)">与上版比较</button></td></tr></tbody></table></div>
<p v-else>当前条件没有引用记录。</p>
<div class="pager" v-if="contentRefs.pages>1">
<button class="btn" :disabled="contentRefsBusy||contentRefs.page<=1" @click="loadContentRefs(contentRefs.page-1)">上一页</button><span>{{contentRefs.page}} / {{contentRefs.pages}}</span>
<button class="btn" :disabled="contentRefsBusy||contentRefs.page>=contentRefs.pages" @click="loadContentRefs(contentRefs.page+1)">下一页</button>
</div>
</template>
</section>
</template>
<template v-if="page==='逐行来源'">
<section class="card listcard">
<div class="card-head"><h2>{{lineageFile?.rel||'选择一个历史文本版本'}}</h2><div class="actions">
<button v-if="lineageBack" class="btn" @click="go(lineageBack)">返回{{lineageBack}}</button>
<button class="btn" @click="go('文件管理')">查找文件</button>
<button v-if="demoLineage" class="btn" @click="openLineage(demoLineage)">查看示例退货台账</button></div></div>
<p v-if="lineageFile?.root" class="quiet">{{lineageFile.root}}</p>
<p v-if="!lineageFile">打开文件的历史版本，选择「逐行来源」。支持 TXT、Markdown、CSV、TSV、日志和常见源码、配置文本。</p>
<form v-else @submit.prevent="loadLineage()">
<div class="filters">
<label>目标版本<select v-model.number="lineageForm.id" @change="changeLineageTarget" :disabled="lineageBusy"><option v-for="v in lineageVersions" :key="v.id" :value="v.id">V{{v.num}} · {{fmt(v.stamp)}} · {{v.ext}}</option></select></label>
<label>最多追溯版本<select v-model.number="lineageForm.depth"><option v-for="n in [5,10,20,40]" :key="n" :value="n">{{n}} 版（含目标）</option></select></label>
<label><input type="checkbox" v-model="lineageForm.moves">识别唯一文本移位</label>
<label>正文关键词<input v-model="lineageForm.q" maxlength="160"></label>
<label>筛选来源<select v-model="lineageForm.kind"><option value="">全部</option><option value="target">判为目标版出现</option><option value="earlier">已确认的较早来源</option><option value="initial">首次建档可见</option><option value="unknown">来源未确认</option><option value="moved">曾识别移位</option></select></label>
</div>
<details><summary>更多行筛选</summary><div class="filters">
<label>从行号<input type="number" min="0" step="1" v-model.number="lineageForm.low" placeholder="0 为不限"></label>
<label>至行号<input type="number" min="0" step="1" v-model.number="lineageForm.high" placeholder="0 为不限"></label>
<label><input type="checkbox" v-model="lineageForm.exact">整行匹配</label>
<label><input type="checkbox" v-model="lineageForm.sensitive">区分大小写</label>
<label>来源版本<select v-model.number="lineageForm.origin"><option :value="0">所有来源</option><option v-for="v in lineageData?.sources||[]" :key="v.id" :value="v.id">V{{v.num}}</option></select></label>
<label>每页<select v-model.number="lineageForm.size"><option v-for="n in [20,50,100]" :key="n" :value="n">{{n}} 行</option></select></label>
</div></details>
<div class="filters">
<button class="primary" :disabled="lineageBusy||!lineageVersions.length">追溯与筛选</button>
<button type="button" class="btn" :disabled="lineageBusy||!lineageVersions.length" @click="resetLineageFilters">清空行筛选</button>
</div></form>
<details><summary>判断口径与限制</summary><p>以快照物理行按相邻版本对齐。行内容改变会重新判定来源。唯一文本移位可辅助识别重排，重复行按顺序对齐，结果无法还原逐次键盘操作或作者。扫描间的未保存内容不在历史中。</p><p>每版最多 512 KiB、2500 行。遇到无法读取的旧版、比较预算或选定深度时，保留已确认结果，并对其余行显示最早可见版本。</p></details>
</section>
<section v-if="lineageFile" class="card listcard" :aria-busy="lineageBusy">
<p v-if="lineageBusy" role="status">正在追溯历史行…</p>
<p v-if="lineageError" class="error" role="alert">{{lineageError}}</p>
<template v-if="lineageData">

<template v-if="page==='路径沿革'">
<section class="card listcard">
<form @submit.prevent="loadPath()">
<div class="filters">
<label>查询范围<select v-model="pathForm.mode" @change="pathForm.direction=''"><option value="path">完整相对路径</option><option value="folder">子目录及后代</option><option value="identity">单个文件身份</option></select></label>
<label>监控目录<select v-model.number="pathForm.root"><option :value="0">全部目录</option><option v-if="pathForm.root&&!s.roots.some(r=>r.id===pathForm.root)" :value="pathForm.root">目录 #{{pathForm.root}}</option><option v-for="r in s.roots" :key="r.id" :value="r.id">{{r.path}}</option></select></label>
<label v-if="pathForm.mode==='identity'">文件身份编号<input type="number" min="1" step="1" v-model.number="pathForm.file" required></label>
<label v-else>相对路径<input v-model="pathForm.rel" required maxlength="512" placeholder="例如 归档/交接.md"></label>
<label v-if="pathForm.mode!=='identity'"><input type="checkbox" v-model="pathForm.fold">忽略路径大小写</label>
<label><input type="checkbox" v-model="pathForm.structural">仅建档、增删与重命名或移动</label>
</div>
<details><summary>日期、类型与排序</summary><div class="filters">
<label>开始日期<input type="date" v-model="pathForm.start" :max="pathForm.end||undefined"></label>
<label>结束日期<input type="date" v-model="pathForm.end" :min="pathForm.start||undefined"></label>
<label>事件类型<select v-model="pathForm.kind"><option value="">全部</option><option v-for="k in kinds.filter(k=>k!=='已撤回')" :key="k">{{k}}</option></select></label>
<label>路径关系<select v-model="pathForm.direction"><option value="">全部</option><option v-for="k in pathRelations" :key="k">{{k}}</option></select></label>
<label>扫描来源<input v-model="pathForm.source" maxlength="512" placeholder="按原文匹配"></label>
<label>排序<select v-model="pathForm.sort"><option value="newest">最近记录在前</option><option value="oldest">最早记录在前</option></select></label>
<label>每页<select v-model.number="pathForm.size"><option v-for="n in [10,25,50,100]" :key="n" :value="n">{{n}} 项</option></select></label>
</div></details>
<div class="filters">
<button type="submit" class="primary" :disabled="pathBusy||!(pathForm.mode==='identity'?pathForm.file:pathForm.rel)">查询沿革</button>
<button type="button" class="btn" @click="resetPath">重置条件</button>
<button type="button" class="btn" v-if="pathPrevious" @click="restorePathScope">返回原路径查询</button>
<button type="button" class="textbtn" v-if="demo" @click="openPath({rel:'业务明细/仓库交接.md'})">查示例旧文件名</button>
</div></form>
<details><summary>如何阅读路径沿革</summary><p>路径模式核对每条可见事件的原路径与事件路径。进入、移出和删除表示系统记录到的动作。扫描间隔和日志处置可能留下空档，沿革无法确认任意时点的现场状态。子目录模式以斜杠为边界，匹配目录内各级文件。</p></details>
</section>
<section class="card listcard" :aria-busy="pathBusy">
<p role="status" v-if="pathBusy">正在查询可见路径事件…</p>
<p role="alert" class="error" v-if="pathError">{{pathError}}</p>
<template v-if="pathResult">
<div class="card-head"><h2>{{pathResult.mode==='identity'?'文件身份 #'+pathApplied.file:pathResult.path}}</h2><button class="btn" :disabled="pathBusy||!pathResult.total" @click="exportPath">导出沿革 CSV</button></div>
<p role="status">{{num(pathResult.total)}} 条事件 · {{num(pathResult.identities)}} 个文件身份 · {{num(pathResult.roots)}} 个监控目录<template v-if="pathResult.total"> · {{fmt(pathResult.first)}} 至 {{fmt(pathResult.last)}}</template></p>
<div class="filters" v-if="pathResult.total||pathApplied.direction">
<button v-for="(count,direction) in pathResult.counts" :key="direction" class="btn" :aria-pressed="pathApplied.direction===direction" :disabled="pathBusy" @click="filterPathRelation(direction)">{{direction}} {{count}}</button>
<button v-if="pathApplied.direction" class="textbtn" :disabled="pathBusy" @click="filterPathRelation(pathApplied.direction)">清除关系筛选</button>
</div>
<details v-if="pathResult.groups.length&&pathResult.mode!=='identity'"><summary>按文件身份查看</summary>
<div class="scroll"><table><thead><tr><th>文件身份</th><th>监控目录</th><th>事件及时间范围</th><th>操作</th></tr></thead>
<tbody><tr v-for="g in pathResult.groups" :key="g.file_id"><td>#{{g.file_id}}</td><td>{{g.root}}</td><td>{{g.total}} 条<small>{{fmt(g.first)}} 至 {{fmt(g.last)}}</small></td>
<td><button class="textbtn" @click="openPath(g,'identity')">跟踪此身份</button></td></tr></tbody></table></div>
<div class="pager" v-if="pathResult.identity_pages>1"><button class="btn" :disabled="pathBusy||pathResult.identity_page===1" @click="loadPath(pathResult.page,pathResult.identity_page-1,true)">上一组</button><span>{{pathResult.identity_page}} / {{pathResult.identity_pages}}</span><button class="btn" :disabled="pathBusy||pathResult.identity_page===pathResult.identity_pages" @click="loadPath(pathResult.page,pathResult.identity_page+1,true)">下一组</button></div>
</details>
<p v-if="!pathResult.total">当前条件下没有可见路径记录。</p>
<div v-else class="scroll"><table class="path-history-table">
<thead><tr><th>时间与身份</th><th>原路径</th><th>事件路径</th><th>关系与事件</th><th>版本与来源</th><th>操作</th></tr></thead>
<tbody><tr v-for="row in pathResult.items" :key="row.id">
<td>{{fmt(row.stamp)}}<small>身份 #{{row.file_id}} · 事件 #{{row.id}}</small><small>{{row.root}}</small></td>
<td :class="{'path-hit':row.old_match}">{{row.old_rel||'—'}}</td><td :class="{'path-hit':row.new_match}">{{row.rel}}</td>
<td>{{row.direction}}<small>{{row.kind}}</small><small v-if="row.caption">{{row.caption}}</small></td>
<td>{{row.prior?'V'+row.prior:'—'}} → {{row.version?'V'+row.version:'—'}}<small>{{row.source}}</small></td>
<td><button class="textbtn" @click="openPathEvent(row)">查看事件</button><button v-if="pathResult.mode!=='identity'" class="textbtn" @click="openPath(row,'identity')">跟踪此身份</button></td>
</tr></tbody>
</table></div>
<div class="pager" v-if="pathResult.pages>1"><button class="btn" :disabled="pathBusy||pathResult.page===1" @click="loadPath(pathResult.page-1,pathResult.identity_page,true)">上一页</button><span>{{pathResult.page}} / {{pathResult.pages}}</span><button class="btn" :disabled="pathBusy||pathResult.page===pathResult.pages" @click="loadPath(pathResult.page+1,pathResult.identity_page,true)">下一页</button></div>
</template></section>
</template>
<template v-if="page==='清单三方对照'">
<section class="card listcard">
<div class="filters"><label>监控目录<select v-model.number="triRoot" @change="loadTriList"><option :value="0">选择目录</option><option v-for="r in s.roots" :key="r.id" :value="r.id">{{r.path}}</option></select></label>
<button class="btn" :disabled="triBusy||!triRoot" @click="loadTriList">刷新清单</button><button class="textbtn" @click="go('目录清单')">返回目录清单</button></div>
<p v-if="!triBusy&&triList.length<3">同一目录至少需要三份清单。可在「目录清单」保存缺少的清单。</p>
<form v-if="triList.length>=3" @submit.prevent="loadTri()">
<div class="filters">
<label>基准<select v-model.number="triForm.base"><option v-for="c in triList" :key="c.id" :value="c.id">{{c.label}} · {{fmt(c.stamp)}}</option></select></label>
<label>左侧<select v-model.number="triForm.left"><option v-for="c in triList" :key="c.id" :value="c.id">{{c.label}} · {{fmt(c.stamp)}}</option></select></label>
<label>右侧<select v-model.number="triForm.right"><option v-for="c in triList" :key="c.id" :value="c.id">{{c.label}} · {{fmt(c.stamp)}}</option></select></label>
<button type="button" class="btn" :disabled="triBusy" @click="swapTri">交换左右</button></div>
<details><summary>筛选项与排序</summary><div class="filters">
<label>路径关键词<input v-model="triForm.q" maxlength="512" placeholder="任一侧的路径片段"></label>
<label>后缀<input v-model="triForm.ext" maxlength="512" placeholder="例如 xlsx, csv"></label>
<label>三方结果<select v-model="triForm.kind"><option value="">全部</option><option v-for="k in triKinds" :key="k">{{k}}</option></select></label>
<label><input type="checkbox" v-model="triForm.unchanged">包含相同项</label>
<label><input type="checkbox" v-model="triForm.issues">仅需复核</label>
<label><input type="checkbox" v-model="triForm.collision">仅路径争用</label>
<label>排序<select v-model="triForm.sort"><option value="review">需复核优先</option><option value="path">按路径</option><option value="left">左侧字节变化幅度</option><option value="right">右侧字节变化幅度</option><option value="impact">任一侧最大字节变化</option></select></label>
<label>每页<select v-model.number="triForm.size"><option v-for="n in [10,25,50,100]" :key="n" :value="n">{{n}} 项</option></select></label>
</div></details>
<div class="filters">
<button class="primary" :disabled="triBusy">对照三份清单</button>
<button type="button" class="btn" :disabled="triBusy" @click="resetTriFilters">重置筛选</button>
</div></form>
<details><summary>结果如何判定</summary><p>同一文件按仓库身份对齐，独立比较路径和正文摘要。两侧变更涉及不同维度时可得到互补候选；同一维度改为不同结果或一侧移出、另一侧变动时需要复核。</p><p>候选路径在忽略大小写和 Unicode 规范化后相同，或一条路径将另一条路径用作目录时，会标记路径争用。候选仅用于复核，现场文件保持原状。</p></details>
</section>
<section class="card listcard" :aria-busy="triBusy">
<p v-if="triBusy" role="status">正在读取三份清单…</p><p v-if="triError" role="alert" class="error">{{triError}}</p>
<template v-if="triData">
<div class="card-head"><h2>三方对照结果</h2><button class="btn" :disabled="triBusy||!triData.total" @click="exportTri">导出三方 CSV</button></div>
<div class="filters tri-snapshot-labels">
<span v-for="(label,i) in ['基准','左侧','右侧']" :key="label"><b>{{label}}</b> {{triData.meta[['base','left','right'][i]].label}}<small>保存 {{fmt(triData.meta[['base','left','right'][i]].stamp)}} · 扫描 {{fmt(triData.meta[['base','left','right'][i]].last_scan)}}</small></span>
</div>
<p role="status">{{num(triData.total)}} 项 · {{num(triData.review)}} 项需复核 · {{num(triData.collisions)}} 项路径争用 · 左侧净变化 {{num(triData.left_delta)}} 字节 · 右侧净变化 {{num(triData.right_delta)}} 字节</p>
<p class="quiet" v-if="triData.total"><span v-for="(count,kind) in triData.counts" :key="kind">{{kind}} {{count}}　</span></p>
<p v-if="!triData.total">当前筛选没有匹配项目。</p>
<div v-else class="scroll"><table class="tri-table">
<thead><tr><th>文件身份与结果</th><th>基准</th><th>左侧</th><th>右侧</th><th>候选与复核</th></tr></thead>

<template v-if="row[side]">{{row[side].rel}}<small><button class="textbtn" @click="openTriVersion(row,row[side])">V{{row[side].num}}</button> · {{bytes(row[side].size)}}</small><details><summary>保存时间与摘要</summary><small>{{fmt(row[side].stamp)}}</small><small class="hash">{{row[side].sha}}</small></details></template>
<span v-else class="quiet">缺席</span><small v-if="side!=='base'">{{row[side+'_kind']}} · {{num(row[side+'_delta'])}} 字节</small>
</td>
<td>
<template v-if="row.collision"><b class="error">路径争用</b><small>{{row.collision}} · 另 {{row.other_count}} 个身份</small><small>#{{row.others.join('、#')}}{{row.other_count>row.others.length?' 等':''}}</small></template>
<template v-else-if="row.candidate_path">{{row.candidate_path}}<small class="hash">{{row.candidate_sha}}</small></template>
<span class="quiet" v-else>{{row.review?'待核对':'结果缺席'}}</span>
<div class="actions">
<button v-if="row.base&&row.left&&row.base.id!==row.left.id" class="textbtn" @click="openTriVersion(row,row.base,row.left)">基准与左侧</button>
<button v-if="row.base&&row.right&&row.base.id!==row.right.id" class="textbtn" @click="openTriVersion(row,row.base,row.right)">基准与右侧</button>
<button v-if="row.left&&row.right&&row.left.id!==row.right.id" class="textbtn" @click="openTriVersion(row,row.left,row.right)">左侧与右侧</button>
</div></td></tr></tbody></table></div>
<div class="pager" v-if="triData.pages>1"><button class="btn" :disabled="triBusy||triData.page===1" @click="loadTri(triData.page-1,true)">上一页</button><span>{{triData.page}} / {{triData.pages}}</span><button class="btn" :disabled="triBusy||triData.page===triData.pages" @click="loadTri(triData.page+1,true)">下一页</button></div>
</template>
</section>

<label>{{snapshotShowsHex?'起始字节偏移':'起始行号'}}<input type="number" step="1" :min="snapshotShowsHex?0:1" v-model.number="snapshotForm.low"></label>
<label>{{snapshotShowsHex?'结束字节偏移':'结束行号'}}<input type="number" step="1" :min="snapshotShowsHex?0:1" v-model.number="snapshotForm.high"></label>
<label>{{snapshotShowsHex?'跳到十进制字节偏移':'跳到行号'}}<input type="number" step="1" :min="snapshotShowsHex?0:1" v-model.number="snapshotForm.at"></label>
<label v-if="!snapshotShowsHex"><input type="checkbox" v-model="snapshotForm.exact">整行匹配</label>
<label v-if="!snapshotShowsHex"><input type="checkbox" v-model="snapshotForm.sensitive">区分大小写</label>
</div></details>
<div class="filters"><button class="primary" :disabled="snapshotBusy||!snapshotVersions.length">更新预览</button><button type="button" class="btn" :disabled="snapshotBusy||!snapshotVersions.length" @click="resetSnapshotView">清空范围与检索</button><button type="button" v-if="!demo" class="btn" :disabled="!snapshotVersions.length" @click="saveSnapshotOriginal">另存原件</button></div>
</form>
<details><summary>预览范围和编码</summary><p>预览校验历史副本大小与 SHA-256，每个快照最多 2 MiB。文本模式按物理行显示，十六进制模式的字节偏移从 0 开始，位置输入使用十进制。直接定位会显示指定位置所在页，筛选后可定位到下一条匹配记录。</p><p v-if="demo">离线样例提供文本版本和一个工作簿的原始字节。</p></details>

<section v-if="snapshotFile" class="card listcard" :aria-busy="snapshotBusy">
<p v-if="snapshotBusy" role="status">正在校验并读取历史原件…</p><p v-if="snapshotError" role="alert" class="error">{{snapshotError}}</p>
<template v-if="snapshotData">
<div class="card-head"><h2>V{{snapshotData.meta.num}} · {{snapshotData.mode==='text'?'文本':'十六进制'}}</h2><button class="btn" :disabled="snapshotBusy||!snapshotData.total" @click="exportSnapshot">导出预览 CSV</button></div>
<p>{{fmt(snapshotData.meta.stamp)}} · {{snapshotData.meta.ext||'无后缀'}} · {{bytes(snapshotData.meta.size)}} · {{snapshotData.meta.status}} · 归档校验通过</p>
<p class="hash">SHA-256 {{snapshotData.meta.sha}}</p>
<p v-if="snapshotData.fallback" class="quiet">{{snapshotData.fallback}}</p>
<p v-if="snapshotData.encoding">{{snapshotData.encoding}}<template v-for="(count,ending) in snapshotData.endings" :key="ending"><span v-if="count"> · {{ending==='无'?'无行尾换行':ending}} {{count}} 行</span></template></p>
<p role="status">{{num(snapshotData.units)}} {{snapshotData.mode==='text'?'行原文':'个原始字节'}} · 当前范围 {{num(snapshotData.total)}} 行</p>
<p v-if="!snapshotData.total" class="quiet">{{snapshotData.units?'当前范围没有匹配项。':'此历史原件为空。'}}</p>
<div v-else class="scroll">
<table v-if="snapshotData.mode==='text'" class="snapshot-table"><thead><tr><th>行号</th><th>原文</th><th>行尾</th></tr></thead>
<tbody><tr v-for="row in snapshotData.items" :key="row.pos" :class="{'snapshot-focus':snapshotData.at===row.pos}">
<td>{{row.pos}}<small v-if="row.match">第 {{row.match}} 列</small></td>
<td><code v-if="row.left||row.hit||row.right">{{row.before?'…':''}}{{row.left}}<mark v-if="row.hit">{{row.hit}}</mark>{{row.right}}{{row.after?'…':''}}</code><span v-else class="quiet">（空行）</span></td>
<td>{{row.ending}}<button v-if="canTraceLines(snapshotData.meta)" class="textbtn" @click="openLineage(snapshotData.meta,row.pos)">逐行来源</button></td></tr></tbody></table>
<table v-else class="snapshot-table"><thead><tr><th>字节偏移</th><th>十六进制</th><th>ASCII</th></tr></thead>
<tbody><tr v-for="row in snapshotData.items" :key="row.pos" :class="{'snapshot-focus':snapshotData.at!==null&&row.pos<=snapshotData.at&&row.end>=snapshotData.at}">
<td><code>0x{{row.pos.toString(16).toUpperCase().padStart(8,'0')}}</code><small>{{row.pos}}–{{row.end}}</small><small v-if="row.match!==null">匹配 {{row.match}}</small></td>
<td class="snapshot-bytes"><code><span v-for="(cell,i) in row.cells" :key="i" :class="{'snapshot-byte-hit':row.match!==null&&row.pos+i>=row.match&&row.pos+i<row.match+row.match_size}">{{cell}}</span></code></td><td><code>{{row.ascii}}</code></td></tr></tbody></table>
</div>
<div class="pager"><button class="btn" :disabled="snapshotBusy||snapshotData.page===1" @click="loadSnapshot(snapshotData.page-1,true)">上一页</button><span>{{snapshotData.page}} / {{snapshotData.pages}}</span><button class="btn" :disabled="snapshotBusy||snapshotData.page===snapshotData.pages" @click="loadSnapshot(snapshotData.page+1,true)">下一页</button></div>
</template></section>
</template>

<template v-if="page==='系统设置'"><section class="card settings"><h2>后台引擎状态</h2><div><label>{{demo?'示例进程':'当前进程'}} {{runtime?.pid||'—'}}</label><button class="btn" @click="loadRuntime">刷新状态</button></div><template v-if="runtime"><p>启动 {{fmt(runtime.started)}} · 已运行 {{runtime.uptime}} 秒 · {{runtime.watch}}</p><p>待扫描目录 {{runtime.queued}} · 待解析版本 {{runtime.parsing}} · 等待文件 {{runtime.waiting}}<span v-if="runtime.due_in!==null"> · 最早任务约 {{runtime.due_in}} 秒后到期</span></p><p v-for="(stamp,name) in runtime.beats">{{name}}最近活动 · {{fmt(stamp)}}</p><p v-for="(stamp,name) in runtime.faults" class="error">{{name}} · {{fmt(stamp)}}</p></template></section><section class="card settings"><h2>监控与外观</h2><div><label>周期校对间隔<small>重新检查目录并核对文件内容</small></label><select v-model.number="prefs.interval"><option v-for="n in [5,15,30,60,300,900,3600]" :value="n">{{n<60?n+' 秒':n/60+' 分钟'}}</option></select></div><div><label>界面主题</label><select v-model="prefs.theme"><option>浅色</option><option>深色</option></select></div><div v-if="!demo"><label>登录 Windows 后后台启动</label><input type="checkbox" v-model="prefs.autostart"></div><div><span></span><button class="primary" @click="savePrefs">保存设置</button></div></section><section class="card settings"><h2>存储与维护</h2><div class="actions"><button class="btn" @click="healthDialog">仓库体检报告</button><button class="btn" @click="deliveryDialog()">核查交付包</button><button v-if="demo" class="btn" @click="inspectDialog">示例备份覆盖情况</button></div><div><label>仓库用量<small>按快照大小计算，重复内容只存一份。</small></label><span class="actions"><button class="btn" @click="loadStorage">计算用量</button><button class="btn" @click="go('相同内容追溯')">查看正文复用</button></span></div><section v-if="storageData" class="storage19"><p>历史版本合计 {{bytes(storageData.logical)}} · 唯一对象 {{bytes(storageData.unique)}} · 去重节省 {{bytes(storageData.saved)}}</p><p>数据库与日志 {{bytes(storageData.database)}} · 所在磁盘可用 {{bytes(storageData.free)}}</p><details><summary>各目录历史用量</summary><p v-for="r in storageData.by_root">{{r.root}} · {{r.versions}} 版 · {{bytes(r.bytes)}}</p></details><details><summary>历史体积最大的文件</summary><p v-for="r in storageData.largest"><button class="textbtn" @click="selectFile(r)">{{r.rel}}</button> · {{r.versions}} 版 · {{bytes(r.bytes)}}</p></details></section><div v-if="native"><label>后台监控<small>点窗口 × 收到托盘。左键托盘图标打开工作台，右键「退出监控」停止引擎。</small></label></div><div><label>版本仓库<small>{{s.home}}</small></label><span>{{num(s.objects)}} 个对象</span></div><div v-if="s.recovery"><label>待核对的恢复任务<small>正在等待目录上线或文件可读</small></label><button v-if="!demo" class="btn" @click="perform('retry_recovery',{})">重新核对（{{s.recovery}}）</button></div><div><label>解析失败<small>失败文件的历史原件仍然保留</small></label><button class="btn" v-if="!demo&&s.failures" @click="perform('retry',{},'已重新安排解析')">重新解析</button><span v-else>{{s.failures}} 项</span></div><div v-if="!demo"><label>备份与完整性</label><span class="actions"><button class="btn" @click="perform('verify',{})">校验仓库</button><button class="btn" @click="inspectDialog">核查已有备份</button><button class="btn" @click="backupDialog()">创建备份</button></span></div></section></template></template>
</div><footer class="foot"><span><i></i>{{demo?'示例数据':s.watch}}</span><span>FileGuard · 1.23.0</span></footer></main>

<details><summary>更换右侧台账</summary><div class="actions"><input aria-label="台账路径片段" v-model="dialog.find" @keydown.enter.prevent="ledgerSearch()" placeholder="文件名或路径"><button type="button" class="btn" @click="ledgerSearch()">搜索历史文件</button></div>
