<template v-if="dialog.oa&&dialog.ob"><button class="textbtn" type="button" @click="ledgerSwap">交换左右台账与规则</button><details><summary>保存或使用对账模板</summary><div class="actions"><label>新模板名称<input maxlength="60" v-model="dialog.tname"></label><button type="button" class="btn" :disabled="!dialog.report||!dialog.tname.trim()" @click="ledgerTemplateSave">保存当前规则</button><label>已有模板<select v-model.number="dialog.tid" @change="dialog.confirmRemove=false"><option :value="0">请选择</option><option v-for="t in dialog.templates" :value="t.id">{{t.name}}</option></select></label><button type="button" class="btn" :disabled="!dialog.tid" @click="ledgerTemplateApply">按表头应用</button><button type="button" class="textbtn" :disabled="!dialog.tid" @click="ledgerTemplateRemove">{{dialog.confirmRemove?'确认移除所选模板':'移除模板'}}</button></div></details><h3>业务编号</h3><div class="actions" v-for="(k,i) in dialog.keys"><label>左侧<select v-model.number="k.l" @change="ledgerReset"><option :value="-1">选择字段</option><option v-for="c in dialog.colsA" :value="c.index">{{c.label}}</option></select></label><label>右侧<select v-model.number="k.r" @change="ledgerReset"><option :value="-1">选择字段</option><option v-for="c in dialog.colsB" :value="c.index">{{c.label}}</option></select></label><button type="button" class="textbtn" v-if="dialog.keys.length>1" @click="dialog.keys.splice(i,1);ledgerReset()">移除</button></div>
<button type="button" class="textbtn" :disabled="dialog.keys.length>=3" @click="dialog.keys.push({l:-1,r:-1});ledgerReset()">添加组合编号列</button>
<details><summary>参与核对的字段与配对规则</summary><div class="actions"><button type="button" class="textbtn" @click="ledgerMap">重新按表头配对</button><button type="button" class="textbtn" @click="dialog.pairs.forEach(p=>p.use=false);ledgerReset()">清除字段选择</button></div>
<div class="ledger-map"><div v-for="(p,i) in dialog.pairs" class="actions"><input type="checkbox" aria-label="核对此字段" v-model="p.use" @change="ledgerReset"><select aria-label="左字段" v-model.number="p.l" @change="ledgerReset"><option :value="-1">无左列</option><option v-for="c in dialog.colsA" :value="c.index">{{c.label}}</option></select><span>→</span><select aria-label="右字段" v-model.number="p.r" @change="ledgerReset"><option :value="-1">无右列</option><option v-for="c in dialog.colsB" :value="c.index">{{c.label}}</option></select></div></div>
<div class="report-controls"><label v-for="(name,k) in {keyTrim:'编号去首尾空白',trim:'文本去首尾空白',fold:'文本忽略大小写',width:'文本 Unicode 兼容归一',typed:'区分文本与数值类型',numeric:'使用十进制数值比较',empty:'空文本与缺格等价'}"><span><input type="checkbox" v-model="dialog[k]" @change="ledgerReset"> {{name}}</span></label><label v-if="dialog.numeric">允许绝对差值<input v-model="dialog.tolerance" @input="ledgerReset"></label></div></details>
<div class="actions"><button type="button" class="primary" @click="ledgerRun">按当前规则对账</button>
<button type="button" class="btn" :disabled="!dialog.report" @click="ledgerTab('records')">记录对照</button><button type="button" class="btn" :disabled="!dialog.report" @click="ledgerTab('fields')">字段影响汇总</button><button type="button" class="btn" :disabled="!dialog.report" @click="ledgerTab('issues')">编号问题 {{dialog.report?.issues.length||0}}</button>
<label>体检一侧<select v-model="dialog.profileSide" @change="ledgerTab('profile')"><option value="r">右侧</option><option value="l">左侧</option></select></label><button type="button" class="btn" @click="ledgerTab('profile')">字段体检</button></div>
<template v-if="dialog.tab==='records'&&dialog.report"><p><span v-for="(n,k) in dialog.report.counts">{{k}} {{n}}　</span> · 跳过全空行：左 {{dialog.report.emptyLeft}} / 右 {{dialog.report.emptyRight}}</p>
<div class="report-controls" @input="dialog.page=1;dialog.expand=null" @change="dialog.page=1;dialog.expand=null"><label>左表行号<input type="number" min="1" v-model.number="dialog.leftRow"></label><label>右表行号<input type="number" min="1" v-model.number="dialog.rightRow"></label><label>含变化的值类型<select v-model="dialog.cellType"><option value="">全部</option><option v-for="k in ['文本','数值','公式','错误','布尔','日期时间','时长']">{{k}}</option></select></label><label><span><input type="checkbox" v-model="dialog.onlySuppressed"> 只看按规则视为相同的原始差别</span></label><label>编号含有<input v-model="dialog.q"></label><label>变化字段含有<input v-model="dialog.field"></label><label>状态<select v-model="dialog.status"><option value="">全部</option><option v-for="(_,k) in dialog.report.counts">{{k}}</option></select></label><label>排序<select v-model="dialog.sort"><option value="">右表原顺序</option><option value="old">左表原顺序</option><option value="key">按编号</option><option value="count">变动字段最多</option></select></label><label><span><input type="checkbox" v-model="dialog.differences"> 隐藏一致行</span></label></div>
<p v-if="dialog.fieldMatch">限定字段 {{dialog.fieldMatch.left}} → {{dialog.fieldMatch.right}} <button type="button" class="textbtn" @click="dialog.fieldMatch=null;dialog.page=1">取消限定</button></p><div class="scroll"><table><thead><tr><th>业务编号</th><th>左行 → 右行</th><th>结果</th><th>字段数</th></tr></thead><tbody><template v-for="r in ledgerSlice.items"><tr><td><button class="textbtn" type="button" @click="dialog.expand=dialog.expand===r.key?null:r.key">{{r.key}}</button></td><td>{{r.old??'—'}} → {{r.new??'—'}}</td><td>{{r.status}}</td><td>{{r.changes.length}}</td></tr><tr v-if="dialog.expand===r.key"><td colspan="4"><p v-if="!r.changes.length">没有字段值差异。</p><details v-if="r.suppressed.length"><summary>按规则视为相同的原始差别 · {{r.suppressed.length}}</summary><p v-for="c in r.suppressed">{{c.left}} {{c.oldAddress}}［{{c.before?.[0]||'缺格'}}］{{c.before?.[1]??'—'}} → {{c.right}} {{c.newAddress}}［{{c.after?.[0]||'缺格'}}］{{c.after?.[1]??'—'}}</p></details><div class="ledger-field" v-for="c in r.changes"><b>{{c.left||'—'}} → {{c.right||'—'}}</b><span>{{c.oldAddress||'—'}}　{{c.before?.[0]||'缺格'}}　{{c.before?.[1]??'—'}}</span><span>{{c.newAddress||'—'}}　{{c.after?.[0]||'缺格'}}　{{c.after?.[1]??'—'}}</span></div></td></tr></template></tbody></table></div></template>
<template v-if="dialog.tab==='fields'"><table><thead><tr><th>字段配对</th><th>影响记录</th><th>新增值</th><th>移除值</th><th>双侧变化</th><th>其中类型改变</th></tr></thead><tbody><tr v-for="v in ledgerSlice.items"><td><button type="button" class="textbtn" @click="ledgerFieldRows(v)">{{v.left||'—'}} → {{v.right||'—'}}</button></td><td>{{v.count}}</td><td>{{v.added}}</td><td>{{v.removed}}</td><td>{{v.changed}}</td><td>{{v.retyped}}</td></tr></tbody></table></template><template v-if="dialog.tab==='issues'"><p>编号重复或不完整的行单列，避免配错业务记录。</p><table><thead><tr><th>一侧</th><th>原始行</th><th>编号</th><th>原因</th></tr></thead><tbody><tr v-for="r in ledgerSlice.items"><td>{{r.side==='l'?'左':'右'}}</td><td>{{r.n}}</td><td>{{r.key}}</td><td>{{r.why}}</td></tr></tbody></table></template>
<template v-if="dialog.tab==='profile'&&dialog.profile"><p>基于{{dialog.profileSide==='l'?'左':'右'}}表表头以下的非空数据行。点击字段查看各取值出现次数。</p>
<div class="scroll"><table><thead><tr><th>字段</th><th>非空 / 空</th><th>不同值 / 多余重复</th><th>含首尾空白</th><th>数值数 / 零</th><th>最小 → 最大</th><th>最长字符 / 行</th><th>类型</th></tr></thead><tbody><tr v-for="p in ledgerSlice.items"><td><button type="button" class="textbtn" @click="ledgerFrequency(p)">{{p.field}}</button></td><td>{{p.filled}} / {{p.missing}}</td><td>{{p.unique}} / {{p.duplicates}}</td><td>{{p.spaces}}</td><td>{{p.numeric}} / {{p.zeros}}</td><td>{{p.min||'—'}} → {{p.max||'—'}}</td><td>{{p.longest}} / {{p.longRow??'—'}}</td><td><span v-for="(n,k) in p.types">{{k}} {{n}}　</span></td></tr></tbody></table></div></template>
<template v-if="dialog.tab==='freq'&&dialog.frequency"><h3>{{dialog.frequency.field}} · 取值频次</h3><div class="actions"><label>取值片段<input v-model="dialog.freqTerm" @input="dialog.page=1"></label><label><input type="checkbox" v-model="dialog.repeatOnly" @change="dialog.page=1"> 只看重复值</label><button type="button" class="textbtn" @click="ledgerTab('profile')">返回字段体检</button></div><table><thead><tr><th>取值</th><th>类型</th><th>次数</th><th>首次 / 末次行</th></tr></thead><tbody><tr v-for="v in ledgerSlice.items"><td class="trace-value">{{v.value}}</td><td>{{v.type}}</td><td>{{v.count}}</td><td>{{v.first}} / {{v.last}}</td></tr></tbody></table></template>
<div class="actions" v-if="dialog.report||dialog.profile"><button type="button" class="btn" :disabled="ledgerSlice.page<=1" @click="dialog.page=ledgerSlice.page-1">上一页</button><span>{{ledgerSlice.page}} / {{ledgerSlice.pages}} 页 · {{ledgerSlice.total}} 项</span><button type="button" class="btn" :disabled="ledgerSlice.page>=ledgerSlice.pages" @click="dialog.page=ledgerSlice.page+1">下一页</button><button type="button" class="btn" :disabled="!ledgerSlice.total" @click="ledgerExport()">导出当前结果 CSV</button><button v-if="dialog.tab==='records'" type="button" class="btn" :disabled="!ledgerSlice.total" @click="ledgerExport(true)">导出字段明细 CSV</button></div></template></template>

<div class="filters"><label>对象摘要片段<input v-model="dialog.q"></label><label>结果类别<select v-model="dialog.status"><option value="">全部</option><option v-for="(_,k) in dialog.data.counts">{{k}}</option></select></label><label>与前一份报告相比<select v-model="dialog.change"><option value="">本轮发现</option><option v-for="(_,k) in dialog.data.changes">{{k}}</option></select></label><button type="button" class="btn" @click="loadHealth()">筛选</button><button type="button" class="btn" @click="healthExport">导出明细</button></div><p>{{dialog.data.total}} 条匹配</p><ul><li v-for="r in dialog.data.items"><span class="hash">{{r.object_key}}</span> · {{r.status}} · {{r.change}}<small>索引 {{r.expected??'—'}} / 实际 {{r.actual??'—'}} 字节 · {{r.versions}} 版 / {{r.files}} 个文件</small><button v-if="r.versions" class="textbtn" type="button" @click="affectedVersions(r)">查看引用</button></li></ul><div class="pager"><button type="button" class="btn" :disabled="dialog.data.page<=1" @click="loadHealth(dialog.data.page-1)">上一页</button>{{dialog.data.page}} / {{dialog.data.pages}}<button type="button" class="btn" :disabled="dialog.data.page>=dialog.data.pages" @click="loadHealth(dialog.data.page+1)">下一页</button></div>
<details v-if="dialog.refs" open><summary>当前引用版本 · {{dialog.refs.total}}</summary><p v-for="r in dialog.refs.items">{{r.root}} / {{r.rel}} · V{{r.num}} · {{fmt(r.stamp)}}</p><button type="button" class="btn" :disabled="dialog.refs.page<=1" @click="affectedVersions(dialog.refs.row,dialog.refs.page-1)">上一页</button><button type="button" class="btn" :disabled="dialog.refs.page>=dialog.refs.pages" @click="affectedVersions(dialog.refs.row,dialog.refs.page+1)">下一页</button></details></template></template></template>
<template v-if="dialog.type==='variance'"><div class="filters"><label>工作表或分组<input v-model="dialog.sheet"></label><label>字段<input v-model="dialog.field"></label><label>业务编号<input v-model="dialog.record"></label><label>绝对差额至少<input v-model="dialog.minimum" placeholder="例如 5"></label><label>绝对变化率至少（%）<input v-model="dialog.rate" placeholder="例如 10"></label><label>变化方向<select v-model="dialog.direction"><option value="">全部</option><option v-for="k in ['上升','下降','等值']">{{k}}</option></select></label><label>顺序<select v-model="dialog.sort"><option value="magnitude">差额绝对值最大</option><option value="rate">变化率绝对值最大</option><option value="up">差额降序</option><option value="down">差额升序</option><option value="position">原始差异顺序</option></select></label><button type="button" class="btn" @click="loadVariance()">核对</button></div>
<template v-if="dialog.data"><p>{{dialog.data.total}} 项符合条件 · 上升 {{dialog.data.counts['上升']||0}} · 下降 {{dialog.data.counts['下降']||0}} · 等值 {{dialog.data.counts['等值']||0}}</p><small v-for="(n,k) in dialog.data.skips">{{k}} {{n}}　</small><details><summary>按分组与字段汇总匹配项</summary><p v-for="g in dialog.data.groups">{{g.sheet}} / {{g.field}} · {{g.count}} 项 · {{g.old}} → {{g.new}} · 净差 {{g.delta}}</p></details><div class="scroll"><table><thead><tr><th>位置</th><th>旧值</th><th>新值</th><th>差额</th><th>变化率</th></tr></thead><tbody><tr v-for="r in dialog.data.items"><td><button type="button" class="textbtn" @click="varianceSource(r)">{{r.sheet}} · {{r.location}}</button> <button type="button" class="textbtn" @click="reportDialog('trace',r)">追踪此项</button><small>{{r.record}}　{{r.field}}</small></td><td>{{r.old}}</td><td>{{r.new}}</td><td>{{r.delta}}</td><td>{{r.percent===null?'原值为零':r.percent+'%'}}</td></tr></tbody></table></div><div class="pager"><button type="button" class="btn" :disabled="dialog.data.page<=1" @click="loadVariance(dialog.data.page-1,dialog.applied)">上一页</button>{{dialog.data.page}} / {{dialog.data.pages}}<button type="button" class="btn" :disabled="dialog.data.page>=dialog.data.pages" @click="loadVariance(dialog.data.page+1,dialog.applied)">下一页</button><button type="button" class="btn" :disabled="!dialog.data.total" @click="varianceExport">导出数值 CSV</button></div><small>变化率 = 差额 ÷ 旧值绝对值。此处仅统计差异中的可比数值。</small></template></template>
<template v-if="dialog.type==='period'||dialog.type==='trace'">
<div v-if="dialog.type==='period'" class="report-controls">
<label>本期开始<input type="date" v-model="dialog.form.start"></label><label>本期结束<input type="date" v-model="dialog.form.end"></label>
<label>统计分组<select v-model="dialog.form.group"><option v-for="(label,k) in {file:'文件',root:'监控目录',folder:'所在文件夹',ext:'扩展名',kind:'变更类型',source:'采集来源',weekday:'星期',hour:'小时'}" :value="k">{{label}}</option></select></label>
<label>监控目录<select v-model="dialog.form.root_id"><option value="">全部</option><option v-for="r in s.roots" :value="r.id">{{r.path}}</option></select></label>
<label>历史路径片段<input v-model="dialog.form.q"></label><label>扩展名<input v-model="dialog.form.ext" placeholder="xlsx, csv"></label><label>事件类型<input v-model="dialog.form.kind" placeholder="例如 内容修改"></label><label>采集来源<input v-model="dialog.form.source" placeholder="例如 手动扫描"></label>
<label>只看分组<select v-model="dialog.form.trend"><option v-for="(label,k) in {'':'全部',up:'次数增加',down:'次数减少',equal:'次数相同',new:'本期才出现',gone:'仅上期出现'}" :value="k">{{label}}</option></select></label>
<label>排序<select v-model="dialog.form.sort"><option v-for="(label,k) in {after:'本期次数',before:'上期次数',delta:'增幅最大（次数）',drop:'减幅最大（次数）',files:'文件最多',days:'活跃天数最多',label:'分组名称'}" :value="k">{{label}}</option></select></label>
<label><span>初次采集</span><span><input type="checkbox" v-model="dialog.form.initial"> 包含初始建档</span></label>
</div>
<p v-if="dialog.type==='trace'">填写业务编号、字段或位置中的至少一项，查看这个文件多次保存之间的变化。</p>
<div v-if="dialog.type==='trace'" class="report-controls"><label>业务编号<input v-model="dialog.form.record" placeholder="例如 MD-001"></label><label>字段<input v-model="dialog.form.field" placeholder="例如 现存量"></label><label>位置<input v-model="dialog.form.location" placeholder="例如 C2"></label><label>工作表或分组<input v-model="dialog.form.sheet"></label>
<label>起始新版本号<input type="number" min="1" v-model="dialog.form.low"></label><label>结束新版本号<input type="number" min="1" v-model="dialog.form.high"></label>
<label>变化类型<select v-model="dialog.form.kind"><option value="">全部</option><option v-for="t in ['新增','修改','删除']">{{t}}</option></select></label>
<label>差异类别<input v-model="dialog.form.category" placeholder="例如 单元格值"></label><label>旧值或新值含有<input v-model="dialog.form.value"></label>
<label><span>轨迹</span><span><input type="checkbox" v-model="dialog.form.only_return"> 只看回到先前可见值</span></label><label><span>时间顺序</span><span><input type="checkbox" v-model="dialog.form.ascending"> 最早版本优先</span></label>
</div>
<div class="actions"><button type="button" class="primary" @click="runReport()">查询</button><button type="button" class="btn" :disabled="!dialog.data?.total" @click="exportReport">导出查询结果 CSV</button></div>
<p v-if="dialog.loading" role="status">正在读取变动…</p>
<template v-if="dialog.data">
<template v-if="dialog.type==='period'"><p>上期 {{dialog.data.previous}} 至 {{dialog.data.previous_end}}，{{dialog.data.before}} 次，涉及 {{dialog.data.files_before}} 个文件。<br>本期 {{dialog.data.start}} 至 {{dialog.data.end}}，{{dialog.data.after}} 次，涉及 {{dialog.data.files_after}} 个文件。</p>
<div class="scroll"><table><thead><tr><th>分组</th><th>上期</th><th>本期</th><th>增减</th><th>本期文件</th><th>活跃天数</th><th>本期首次 / 最近</th><th>核查</th></tr></thead><tbody><tr v-for="r in dialog.data.items"><td>{{r.label}}</td><td>{{r.before}}</td><td>{{r.after}}</td><td>{{r.delta>0?'+'+r.delta:r.delta}}</td><td>{{r.files}}</td><td>{{r.days}}</td><td>{{r.first?fmt(r.first):'—'}}<br>{{r.last?fmt(r.last):'—'}}</td><td><button type="button" class="textbtn" @click="reportSource(r)">最近事件</button></td></tr></tbody></table></div></template>
<template v-else><p>命中 {{dialog.data.versions}} 个版本 · 回到先前可见值 {{dialog.data.returns}} 项</p><small>所选范围内可见相邻版本的解析情况：<span v-for="(n,k) in dialog.data.coverage"> {{k}} {{n}}　</span></small>
<div class="scroll"><table><thead><tr><th>保存时间 / 版本</th><th>当时路径 / 位置</th><th>编号 / 字段</th><th>旧值</th><th>新值</th><th>变化</th></tr></thead><tbody><tr v-for="r in dialog.data.items"><td>{{fmt(r.stamp)}}<br>V{{r.prior}} → V{{r.version}}</td><td>{{r.rel}}<br>{{r.sheet}} · <button type="button" class="textbtn" @click="reportSource(r)">{{r.location}}</button></td><td>{{r.record}}<br>{{r.field}}</td><td class="trace-value">{{r.old??'—'}}</td><td class="trace-value">{{r.new??'—'}}</td><td>{{r.kind}} {{r.category}}<small v-if="r.returning==='是'">回到先前可见值</small></td></tr></tbody></table></div></template>
<p v-if="!dialog.data.total">当前条件没有匹配项。</p><div class="actions"><button type="button" class="btn" :disabled="dialog.data.page===1" @click="runReport(dialog.data.page-1,dialog.applied)">上一页</button><span>{{dialog.data.page}} / {{dialog.data.pages}} 页 · {{dialog.data.total}} 项</span><button type="button" class="btn" :disabled="dialog.data.page===dialog.data.pages" @click="runReport(dialog.data.page+1,dialog.applied)">下一页</button></div>
</template></template>
<template v-if="dialog.type==='capture_policy'"><p class="path">{{dialog.path}}</p><label>稳定等待时长<select v-model.number="dialog.settle_ms"><option v-for="v in [500,1500,3000,5000,10000]" :value="v">{{v/1000}} 秒</option></select></label><label><input type="checkbox" v-model="dialog.all_types">对所有扩展名启用稳定等待</label><small>监听到保存后，在复查中确认签名保持稳定。默认用于 Office、开放文档、PDF、电子书、ZIP 和笔记本等格式。</small></template>
<template v-if="dialog.type==='waiting_files'">
<p class="path">{{dialog.path}}</p>
<div class="filters scan-filters">
<label>文件路径<input v-model="dialog.filters.q" maxlength="512" placeholder="输入相对路径片段"></label>
<label>等待原因<select v-model="dialog.filters.reason"><option value="">全部</option><option v-for="v in scanFacetChoices(dialog.reasons,dialog.filters.reason)" :key="v">{{v}}</option></select></label>
<label>排序<select v-model="dialog.filters.sort"><option value="">最早等待</option><option value="recent">最近观察</option><option value="attempts">观察次数最多</option><option value="path">文件路径</option></select></label>
</div>
<div class="actions scan-actions"><button type="submit" class="primary">查询当前队列</button><button type="button" class="btn" @click="resetWaiting">重置</button><button type="button" class="btn" @click="backToJournal">{{dialog.previousJournal?'返回扫描运行记录':'查看扫描运行记录'}}</button></div>
<p v-if="dialog.loading" role="status">正在读取当前等待队列…</p>
<template v-if="dialog.data">
<p v-if="scanFiltersPending" class="quiet">筛选条件已修改，查询后更新结果。</p>
<p role="status">当前匹配 {{num(dialog.data.total)}} 个等待文件</p>
<div v-if="Object.keys(dialog.data.counts||{}).length" class="actions scan-chips" role="group" aria-label="按当前路径查询的等待原因筛选">
<button v-for="(count,reason) in dialog.data.counts" :key="reason" type="button" class="btn" :aria-pressed="dialog.applied.reason===reason" @click="waitingReason(reason)">{{reason}} {{num(count)}}</button>
</div>
<div v-if="dialog.data.total" class="scroll scan-scroll" tabindex="0" role="region" aria-label="等待文件表"><table>
<thead><tr><th scope="col">文件与原因</th><th scope="col">首次等待</th><th scope="col">最近观察</th><th scope="col">观察次数</th></tr></thead>
<tbody><tr v-for="r in dialog.data.items" :key="r.rel"><td>{{r.rel}}<small>{{r.reason}}</small></td><td>{{fmt(r.first_seen)}}</td><td>{{fmt(r.last_seen)}}</td><td>{{num(r.attempts)}}</td></tr></tbody>
</table></div>
<p v-else>当前条件下没有等待文件。</p>
<div v-if="dialog.data.pages>1" class="pager scan-pager"><button class="btn" type="button" :disabled="dialog.data.page<=1" @click="loadWaiting(dialog.data.page-1)">上一页</button><span>第 {{dialog.data.page}} / {{dialog.data.pages}} 页</span><button class="btn" type="button" :disabled="dialog.data.page>=dialog.data.pages" @click="loadWaiting(dialog.data.page+1)">下一页</button></div>
</template>
<small>此处显示查询时仍在等待的文件。</small>
</template>
<template v-if="dialog.type==='scan_log'">
<p class="path">{{dialog.path}}</p>
<div class="filters scan-filters">
<label>运行结果<select v-model="dialog.filters.state"><option value="">全部</option><option v-for="v in dialog.states" :key="v">{{v}}</option></select></label>
<label>触发来源<select v-model="dialog.filters.source"><option value="">全部</option><option v-for="v in scanFacetChoices(dialog.sources,dialog.filters.source)" :key="v">{{v}}</option></select></label>
<label>起始日期<input type="date" v-model="dialog.filters.start"></label>
<label>结束日期<input type="date" v-model="dialog.filters.end"></label>
</div>
<details class="scan-details"><summary>异常、跳过与排序</summary>
<div class="filters scan-filters">
<label>异常类别<select v-model="dialog.filters.problem"><option value="">全部</option><option v-for="v in scanFacetChoices(dialog.problems,dialog.filters.problem)" :key="v">{{v}}</option></select></label>
<label>跳过原因<select v-model="dialog.filters.skip_reason"><option value="">全部</option><option v-for="v in scanFacetChoices(dialog.skipReasons,dialog.filters.skip_reason)" :key="v">{{v}}</option></select></label>
<label>排序<select v-model="dialog.filters.sort"><option value="recent">最新运行</option><option value="oldest">最早运行</option><option value="slowest">耗时最长</option><option value="waiting">等待数量最多</option></select></label>
<label>每页条数<select v-model.number="dialog.filters.size"><option v-for="v in [20,50,100]" :key="v" :value="v">{{v}} 条</option></select></label>
</div>
<div class="filters"><label><input type="checkbox" v-model="dialog.filters.skips">仅有跳过项</label><label><input type="checkbox" v-model="dialog.filters.waiting">仅有等待项</label></div>
</details>
<div class="actions scan-actions">
<button type="submit" class="primary">查询扫描记录</button>
<button type="button" class="btn" @click="resetJournal">重置</button>
<button type="button" class="btn" :disabled="!dialog.data?.total||dialog.loading" @click="exportJournal">导出当前结果 CSV</button>
<button type="button" class="btn" @click="journalWaiting">查看当前等待队列</button>
</div>
<p v-if="dialog.loading" role="status">正在读取扫描记录…</p>
<template v-if="dialog.data">
<p v-if="scanFiltersPending" class="quiet">筛选条件已修改，查询后更新结果。</p>
<p role="status">匹配 {{num(dialog.data.total)}} 次运行</p>
<template v-if="dialog.data.total">
<section class="scan-summary" v-if="dialog.data.summary" aria-label="匹配运行汇总">
<dl class="scan-metrics">
<div v-for="[key,label] in [['candidates','候选'],['captured','快照读取'],['read_bytes','快照读取量'],['reused','内容复用'],['waiting','等待'],['skipped','跳过']]" :key="key">
<dt>{{label}}</dt><dd>{{journalMetric(key,dialog.data.summary[key])}}</dd>
</div>
</dl>
<p v-if="dialog.data.summary.finished">{{num(dialog.data.summary.finished)}} 次有耗时记录 · 平均 {{num(dialog.data.average)}} 毫秒 · 最长 {{num(dialog.data.longest)}} 毫秒</p>
<p v-else>当前结果没有耗时记录。</p>
<details class="scan-details"><summary>运行分布与耗时分位</summary>
<p v-if="dialog.data.summary.finished">50% 的有耗时运行在 {{num(dialog.data.summary.p50)}} 毫秒内 · 95% 在 {{num(dialog.data.summary.p95)}} 毫秒内</p>
<div class="actions scan-chips" role="group" aria-label="按匹配记录的运行结果筛选">
<template v-for="(n,name) in dialog.data.summary.states" :key="name"><button v-if="n" type="button" class="btn" :aria-pressed="dialog.applied.state===name" @click="journalFacet('state',name)">{{name}} {{num(n)}}</button></template>
</div>
<div v-if="Object.keys(dialog.data.summary.skip_reasons).length" class="actions scan-chips" role="group" aria-label="按匹配记录的跳过原因筛选">
<button v-for="(n,name) in dialog.data.summary.skip_reasons" :key="name" type="button" class="btn" :aria-pressed="dialog.applied.skip_reason===name" @click="journalFacet('skip_reason',name)">{{name}} {{num(n)}}</button>
</div>
<div v-if="Object.keys(dialog.data.summary.problems).length" class="actions scan-chips" role="group" aria-label="按匹配记录的异常类别筛选">
<button v-for="(n,name) in dialog.data.summary.problems" :key="name" type="button" class="btn" :aria-pressed="dialog.applied.problem===name" @click="journalFacet('problem',name)">{{name}} {{num(n)}}</button>
</div>
</details>
</section>
</template>
<template v-else><p>没有匹配的运行记录。</p></template>
</template>
<section v-if="dialog.selectedRuns.length" class="scan-selection" aria-label="两次扫描对照">
<div class="actions scan-chips">
<span role="status">已选 {{dialog.selectedRuns.length}} / 2</span>
<button v-for="run in dialog.selectedRuns" :key="run.id" type="button" class="btn" @click="toggleJournalRun(run)" :aria-label="'移除扫描 #'+run.id">移除 #{{run.id}}</button>
<button type="button" class="btn" @click="dialog.selectedRuns=[]">清空对照</button>
</div>
<template v-if="journalComparison">
<h3>两次扫描对照</h3>
<div class="scroll scan-scroll" tabindex="0" role="region" aria-label="扫描对照表"><table>
<thead><tr><th scope="col">指标</th><th scope="col">较早 #{{journalComparison.before.id}}</th><th scope="col">较晚 #{{journalComparison.after.id}}</th><th scope="col">增减</th></tr></thead>
<tbody>
<tr><th scope="row">开始与来源</th><td>{{fmt(journalComparison.before.started)}}<small>{{journalComparison.before.source}} · {{journalComparison.before.status}}</small></td><td>{{fmt(journalComparison.after.started)}}<small>{{journalComparison.after.source}} · {{journalComparison.after.status}}</small></td><td>—</td></tr>
<tr v-for="metric in journalComparison.metrics" :key="metric.key"><th scope="row">{{metric.label}}</th><td>{{journalMetric(metric.key,metric.before)}}</td><td>{{journalMetric(metric.key,metric.after)}}</td><td>{{journalMetric(metric.key,metric.delta,true)}}</td></tr>
</tbody></table></div>
</template>
<p v-else>再选一次扫描即可对照。已选记录会保留到下一页。</p>
</section>
<template v-if="dialog.data?.total">
<div class="scroll scan-scroll" tabindex="0" role="region" aria-label="扫描运行表"><table>
<thead><tr><th scope="col">开始与来源</th><th scope="col">结果</th><th scope="col">耗时</th><th scope="col">运行数据</th><th scope="col">对照</th></tr></thead>
<tbody><tr v-for="r in dialog.data.items" :key="r.id">
<td>{{fmt(r.started)}}<small>#{{r.id}} · {{r.source}}</small></td><td>{{r.status}}<small v-if="r.problem">{{r.problem}}</small></td><td>{{r.ended?num(r.elapsed_ms)+' ms':'—'}}</td>
<td><details><summary>查看运行数据</summary>
<p>候选 {{num(r.candidates)}} · 快照读取 {{num(r.captured)}}（{{bytes(r.read_bytes)}}）· 内容复用 {{num(r.reused)}} · 等待 {{num(r.waiting)}} · 跳过 {{num(r.skipped)}}</p>
<p v-for="(n,k) in r.skip_reasons" :key="k">{{k}} {{num(n)}}</p>
<p v-if="r.ended">结束于 {{fmt(r.ended)}}</p>
</details></td>
<td><button type="button" class="btn" :aria-label="(journalHasRun(r.id)?'移除':'选择')+'扫描 #'+r.id" :aria-pressed="journalHasRun(r.id)" :disabled="r.status==='进行中'||(!journalHasRun(r.id)&&dialog.selectedRuns.length>=2)" @click="toggleJournalRun(r)">{{journalHasRun(r.id)?'移除':'选择'}}</button></td>
</tr></tbody></table></div>
<div v-if="dialog.data.pages>1" class="pager scan-pager"><button type="button" class="btn" :disabled="dialog.data.page<=1" @click="loadJournal(dialog.data.page-1)">上一页</button><span>第 {{dialog.data.page}} / {{dialog.data.pages}} 页</span><button type="button" class="btn" :disabled="dialog.data.page>=dialog.data.pages" @click="loadJournal(dialog.data.page+1)">下一页</button></div>
</template>
<small>每个目录保留最近 200 次扫描。汇总涵盖所有匹配运行，同一文件可能计入多次。</small>
</template>
<template v-if="dialog.type==='rule_history'"><p class="path">{{dialog.path}}</p><ol><li v-for="r in dialog.entries" :key="r.id">{{fmt(r.stamp)}} · {{r.patterns||'无排除规则'}} · {{r.max_mb ? r.max_mb+' MiB':'不限大小'}}</li></ol><small>最近 100 次配置，最新在前。</small></template><template v-if="dialog.type==='inspect'"><label>备份 ZIP 路径<input v-model="dialog.path" required></label><small>逐个核对对象，无需退出监控。</small></template><template v-if="dialog.type==='backup'"><label>管理口令<input v-model="dialog.password" type="password" autocomplete="off" required></label><label>新备份文件的完整路径<input v-model="dialog.path" required></label></template><template v-if="dialog.type==='root'"><label>目录路径<div class="inline"><input v-model="dialog.path" placeholder="例如 D:\业务资料\仓库" required :readonly="!!dialog.id"><button type="button" class="btn" v-if="native&&!dialog.id" @click="chooseDir">浏览</button></div></label><label>排除规则<input v-model="dialog.patterns" placeholder="例如 *.tmp，*.bak，缓存/*"></label><label>单文件大小上限（MiB）<input type="number" min="0" v-model.number="dialog.max_mb"></label><small>填 0 表示不限大小。超过上限的文件会跳过。</small><details><summary>保存前预演规则</summary><label>待测文件相对路径，每行一个<textarea v-model="dialog.paths" placeholder="草稿/试算.xlsx"></textarea></label><label>假设每个文件大小（字节，可留空）<input type="number" min="0" v-model="dialog.probeBytes"></label><button class="btn" type="button" @click="previewRules">预演</button><ul v-if="dialog.samples&&dialog.probed===ruleSignature(dialog)"><li v-for="r in dialog.samples">{{r.rel}} · {{r.reason}} <span v-if="r.pattern">· {{r.pattern}} 命中 {{r.part}}</span></li></ul></details></template>
<template v-if="dialog.type==='save'"><label>保存路径<input v-model="dialog.path" required placeholder="请输入完整的新文件路径"></label></template><template v-if="['info','confirm'].includes(dialog.type)"><p style="white-space:pre-line">{{dialog.body}}</p></template>
<template v-if="dialog.type==='tree'"><label class="search-input"><ico n="search"></ico><input v-model="dialog.query" placeholder="搜索子目录路径"></label><div class="picklist"><button type="button" @click="rootFiles(dialog.root)">全部文件</button><button type="button" v-for="folder in visibleFolders" :key="folder.path" @click="treeSelect(dialog.root,folder.path)" :style="{paddingLeft:(8+14*(folder.path.split('/').length-1))+'px'}"><ico n="folder"></ico><span>{{folder.path}}</span><small>{{folder.total}} 个文件</small></button></div><small v-if="!dialog.folders.length">当前目录没有含已跟踪文件的子目录。</small><small v-else-if="!visibleFolders.length">没有匹配的子目录。</small></template><template v-if="dialog.type==='pick'"><div class="picker-tools"><label class="search-input"><ico n="search"></ico><input id="filePicker" v-model="pickQ" @input="searchPick" placeholder="搜索现名、旧名或相对路径"></label><select v-model="pickScope" aria-label="历史文件范围" @change="pickPage=1;loadPicks()"><option v-for="entry in fileScopes" :value="entry[0]">{{entry[1]}}</option></select></div><div class="picklist"><button type="button" v-for="v in picks.items" :key="v.id" :disabled="pickLoading" @click="picked(v)"><span class="file-icon" :class="tone(v.ext)"><ico :n="fileIcon(v.ext)"></ico></span><span class="file-summary"><b>{{base(v.rel)}}</b><small>{{parent(v.root,v.rel)}}</small><small v-if="v.matched_path">原路径：{{v.matched_path}}</small><small><span class="tag" :class="stateTone(v.file_state)">{{v.file_state}}</span>　V{{v.version}} · {{fmt(v.updated)}}</small></span><ico n="chevron-right"></ico></button><p v-if="pickLoading" role="status">正在查找…</p><p v-else-if="!picks.items.length">当前范围内没有找到文件</p></div><div class="pager"><span>共 {{picks.total}} 个文件</span><span><button type="button" class="btn" :disabled="pickPage<=1" @click="pickPage--;loadPicks()">上一页</button> <button type="button" class="btn" :disabled="pickPage*picks.size>=picks.total" @click="pickPage++;loadPicks()">下一页</button></span></div></template>
<p class="error" v-if="dialog.error">{{dialog.error}}</p><div v-if="!['pick','info','tree','rule_history','private_records','scan_log','waiting_files','ledger','receipt','period','trace','inventory','health','variance','backup_result','delivery_result','review_batch'].includes(dialog.type)&&!(dialog.type==='restore_preview'&&(demo||dialog.loading||!dialog.info||dialog.info.identical))" class="form-actions"><button type="button" class="btn" :disabled="busy" @click="dialog=null">取消</button><button class="primary" :disabled="busy">{{busy?'处理中…':dialog.submit||'保存'}}</button></div></form></section></div><div class="toast" role="status" v-if="message">{{message}}</div></div></div><script src="vue.js"></script><script src="icons.js"></script><script src="ledger.js"></script><script src="view.js"></script><script src="app.js"></script></body></html>
